<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:var(--font-sans); background:var(--bg-page); color:var(--text-1); display:flex; height:100vh; overflow:hidden; }
  /* ---- 侧边栏 ---- */
  nav { width:200px; background:var(--brand-900); color:#fff; display:flex; flex-direction:column; flex-shrink:0; }
  .logo { display:flex; align-items:center; gap:10px; height:60px; padding:0 12px; box-sizing:border-box; }
  .logo img { width:34px; height:34px; }
  .logo b { font-size:16px; letter-spacing:.5px; }
  .logo span { font-size:10px; opacity:.65; display:block; }
  .navlist { flex:1; min-height:0; overflow-y:auto; padding:6px 12px;
    scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.22) transparent; }
  .navlist::-webkit-scrollbar { width:8px; }
  .navlist::-webkit-scrollbar-track { background:transparent; }
  .navlist::-webkit-scrollbar-thumb { background:rgba(255,255,255,.22); border-radius:4px; }
  .navlist::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,.34); }
  .navitem { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--r-sm); cursor:pointer; font-size:14px; color:rgba(255,255,255,.85); margin-bottom:2px; }
  .navitem:hover { background:rgba(255,255,255,.08); }
  .navitem.on { background:var(--brand-700); color:#fff; font-weight:600; }
  .navitem .em { width:20px; text-align:center; }
  /* 导航项与统计卡是 <button>：清掉浏览器默认外观，保持原来的块状样式 */
  button.navitem { width:100%; background:none; border:0; font-family:inherit; text-align:left; line-height:inherit; }
  button.stat { width:100%; font:inherit; color:inherit; }
  .skip { position:absolute; left:-9999px; top:0; z-index:200; padding:10px 16px;
    background:var(--brand-700); color:#fff; border-radius:0 0 var(--r-sm) 0; font-size:13px; }
  .skip:focus { left:0; }
  .navgroup { padding:12px 12px 4px; font-size:10px; letter-spacing:.14em; color:rgba(255,255,255,.62); }
  .navgroup + .navitem { margin-top:0; }
  .homeempty { padding:var(--sp-4); border:1px dashed rgba(11,110,79,.35); background:rgba(11,110,79,.04); }
  .navfoot { padding:12px; border-top:1px solid rgba(255,255,255,.12); }
  .footchips { display:flex; gap:6px; }
  .footchip { flex:1 1 0; min-width:0; text-align:center; font-size:11px; line-height:1; padding:6px; border-radius:var(--r-sm);
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); color:rgba(255,255,255,.82);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  .footchip:hover { background:rgba(255,255,255,.16); }
  .footacts { display:flex; gap:8px; margin-top:8px; }
  .footacts button { flex:1; min-width:0; padding:6px 0; font-size:11.5px; line-height:1.2; cursor:pointer;
    color:#fff; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.3); border-radius:var(--r-sm); }
  .footacts button:hover { background:rgba(255,255,255,.2); }
  .footacts button:first-child { background:rgba(255,255,255,.22); border-color:rgba(255,255,255,.45); }
  /* ---- 内容区 ---- */
  .content { flex:1; display:flex; flex-direction:column; min-width:0; }
  iframe { flex:1; border:0; background:var(--bg-page); }
  /* ---- 备份提醒条 ---- */
  .backup-bar { flex:0 0 auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:9px 14px; background:#fff7e6; border-bottom:1px solid #e2c98f; color:var(--warn-text); font-size:13px; }
  .backup-bar[hidden] { display:none; }
  .backup-bar .bb-msg { flex:1 1 auto; min-width:12em; }
  .backup-bar .bb-btn { flex:0 0 auto; font:inherit; font-size:12.5px; line-height:1.2; padding:6px 14px;
    border-radius:999px; border:1px solid #9a6b16; background:#fff; color:var(--warn-text); cursor:pointer; }
  .backup-bar .bb-btn:hover { background:#ffefd2; }
  .backup-bar .bb-btn.primary { background:#8a5a00; border-color:#8a5a00; color:#fff; }
  .backup-bar .bb-btn.primary:hover { background:#6f4900; }
  /* ---- 首页 ---- */
  #home { flex:1; overflow:auto; padding:var(--sp-8); }
  #home h2 { margin:0 0 4px; font-size:22px; }
  #home .sub { color:var(--text-2); font-size:13px; margin-bottom:var(--sp-6); }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:var(--sp-3); margin-bottom:var(--sp-6); }
  .stat { padding:var(--sp-4); text-align:center; cursor:pointer; }
  .stat:hover { border-color:var(--brand-500); }
  .stat b { display:block; font-size:28px; margin-bottom:2px; }
  .stat span { font-size:12px; color:var(--text-2); }
  .brief { margin-bottom:var(--sp-6); }
  .brief .ft-ai-output { font-size:14px; line-height:1.8; }
  .quick { display:flex; gap:var(--sp-3); flex-wrap:wrap; }
  /* ---- 今日工作台：有数据时填满下半屏 ---- */
  .dash { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--sp-3); margin-bottom:var(--sp-6); }
  .dash[hidden] { display:none; }
  .dash-card { padding:var(--sp-4); min-width:0; }
  .dash-h { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .dash-h b { font-size:13.5px; }
  .dash-h .dash-more { font:inherit; font-size:11.5px; color:var(--brand-700); background:none; border:0; padding:0; cursor:pointer; }
  .dash-h .dash-more:hover { text-decoration:underline; }
  .dash-row { display:flex; align-items:center; gap:8px; width:100%; text-align:left; font:inherit; color:inherit;
    background:none; border:0; border-top:1px dashed var(--border); padding:9px 0; cursor:pointer; }
  .dash-row:first-child { border-top:0; }
  .dash-row:hover .dr-t { color:var(--brand-700); }
  .dash-row .dr-main { flex:1; min-width:0; }
  .dash-row .dr-t { display:block; font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dash-row .dr-s { display:block; font-size:11.5px; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
  .dr-badge { flex:0 0 auto; font-size:10.5px; line-height:1.5; padding:1px 8px; border-radius:999px; white-space:nowrap; }
  .dr-badge.bad { background:#fee2e2; color:#991b1b; }
  .dr-badge.warn { background:#fef3c7; color:#92400e; }
  .dr-badge.ok { background:#d1fae5; color:#065f46; }
  .dr-badge.info { background:#e0f2fe; color:#075985; }
  .dash-empty { font-size:12.5px; color:var(--text-3); padding:8px 0; line-height:1.6; }
  .dialog-wrap { padding:0; }
  /* ---- 移动端抽屉 ---- */
  .mbar { display:none; }
  .mcover { display:none; }
  .mdot { display:none; }
  @media (max-width:860px) {
    body { display:block; height:100vh; height:100dvh; overflow:hidden; }
    .mbar { display:flex; position:fixed; top:0; left:0; right:0; height:52px; z-index:60; background:var(--brand-900); color:#fff; align-items:center; gap:10px; padding:0 12px; box-sizing:border-box; }
    .mbar .mburger { width:36px; height:36px; flex:0 0 36px; border-radius:8px; border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.14); color:#fff; font-size:18px; line-height:1; cursor:pointer; }
    .mbar b { font-size:14px; letter-spacing:.3px; }
    .mbar #mTitle { margin-left:auto; font-size:12px; opacity:.75; max-width:44%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .mbar .mdot { display:inline-block; width:8px; height:8px; flex:0 0 8px; border-radius:50%; margin-left:6px; background:rgba(255,255,255,.45); cursor:pointer; }
    nav { position:fixed; top:0; bottom:0; left:0; width:268px; max-width:84vw; z-index:70; transform:translateX(-100%); transition:transform .22s ease; box-shadow:8px 0 30px rgba(0,0,0,.25); overflow:hidden; }
    nav.open { transform:none; }
    .mcover { position:fixed; inset:0; z-index:65; background:rgba(0,0,0,.45); }
    .mcover.show { display:block; }
    .content { height:100%; padding-top:52px; box-sizing:border-box; }
    iframe { width:100%; height:100%; }
    #home { padding:16px 12px; height:calc(100vh - 52px); height:calc(100dvh - 52px); }
    /* 备份条出现时让内容区自己分配高度，避免 100dvh 计算溢出 */
    .content.has-banner iframe, .content.has-banner #home { height:auto; min-height:0; }
    .backup-bar { padding:8px 12px; font-size:12px; gap:8px; }
    .backup-bar .bb-msg { flex:1 1 100%; }
    #home h2 { font-size:19px; }
    #home .sub { font-size:12px; margin-bottom:14px; }
    #home .grid { grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
    #home .dash { grid-template-columns:1fr; gap:8px; margin-bottom:14px; }
    .dash-card { padding:var(--sp-3); }
    .quick { gap:8px; }
    .quick button { flex:1 1 46%; }
    .stat b { font-size:22px; }
  }
</style>

<script>
'use strict';
/* 模块 iframe 缓存版本：改动 modules/*.html 或它们引用的 js 后把字母/数字往后调，
   避免用户只刷新首页、iframe 里仍跑旧代码（GitHub Pages 缓存很顽固） */
var MODULE_V = '20261030a';
function go(view){
  document.querySelectorAll('.navitem').forEach(function(n){
    var on = n.dataset.view===view;
    n.classList.toggle('on', on);
    if (on) n.setAttribute('aria-current','page'); else n.removeAttribute('aria-current');
  });
  if (view==='home'){ location.hash=''; $('frame').style.display='none'; $('home').style.display='block'; refresh(); }
  else { $('frame').src=view + (view.indexOf('?')<0?'?':'&') + 'v=' + MODULE_V; $('frame').style.display='block'; $('home').style.display='none'; }
  var item = document.querySelector('.navitem[data-view="' + view + '"]');
  var label = item && item.lastChild ? String(item.lastChild.textContent || '').trim() : '';
  $('mTitle').textContent = view === 'home' ? '工作台' : label;
  closeNav();
}
/* 模块 iframe 里的 FT.go() 优先直接调用 parent.go()；
   跨域或沙箱环境会退回 postMessage，这里接住并做白名单校验。 */
window.addEventListener('message', function(e){
  if (e.origin !== window.location.origin) return;
  var d = e.data;
  if (!d || d.type !== 'ft:navigate' || typeof d.view !== 'string') return;
  if (!/^modules\/[a-z0-9_-]+\.html$/i.test(d.view)) return;
  go(d.view);
});
function toggleNav(){
  var nav = $('appnav');
  var open = !nav.classList.contains('open');
  nav.classList.toggle('open', open);
  $('mcover').classList.toggle('show', open);
  var b = $('mBurger');
  if (b){ b.setAttribute('aria-expanded', open ? 'true' : 'false'); b.setAttribute('aria-label', open ? '关闭菜单' : '打开菜单'); }
}
function closeNav(){
  $('appnav').classList.remove('open');
  $('mcover').classList.remove('show');
  var b = $('mBurger');
  if (b){ b.setAttribute('aria-expanded','false'); b.setAttribute('aria-label','打开菜单'); }
}
function $(id){ return document.getElementById(id); }
document.querySelectorAll('.navitem').forEach(function(n){
  n.addEventListener('click', function(){ go(n.dataset.view); });
});
/* ---------- 今日工作台 ----------
   有业务数据后，首页下半屏给出三个可执行列表：
   该跟进的线索 / 临期待办 / 最近报价。没有数据时整块隐藏，保留空态引导。 */
function escHtml(s){
  return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
/* 相对今天的天数：正数=过去几天，负数=还有几天（按本地日历，不走 UTC） */
function dayDiff(dateStr){
  var p = String(dateStr || '').slice(0,10).split('-');
  if (p.length < 3) return null;
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  if (isNaN(d.getTime())) return null;
  var now = new Date();
  var t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((t0 - d) / 86400000);
}
function dashRow(title, sub, badge, cls){
  return '<button type="button" class="dash-row" onclick="go(\'modules/leads.html\')">'
    + '<span class="dr-main"><span class="dr-t">' + escHtml(title) + '</span>'
    + '<span class="dr-s">' + escHtml(sub || '—') + '</span></span>'
    + '<span class="dr-badge ' + cls + '">' + escHtml(badge) + '</span></button>';
}
function renderDash(leads, todos, quotes){
  var box = $('dash');
  if (!box) return;
  leads = leads || []; todos = todos || []; quotes = quotes || [];
  var hasAny = leads.length || todos.length || quotes.length;
  box.hidden = !hasAny;
  if (!hasAny) return;

  /* 1) 今天该跟进：超过 3 天没联系、且未成交的线索，最久没联系的排前面 */
  var follow = leads.filter(function(l){
    return l.stage !== '成交' && l.last && dayDiff(l.last) > 3;
  }).sort(function(a,b){ return dayDiff(b.last) - dayDiff(a.last); });
  $('dashFollow').innerHTML = follow.slice(0,4).map(function(l){
    var d = dayDiff(l.last);
    var sub = [l.country, l.product || l.note].filter(Boolean).join(' · ');
    return dashRow(l.name || '未命名线索', sub, d + ' 天未联系', d >= 14 ? 'bad' : 'warn');
  }).join('') || '<div class="dash-empty">没有超过 3 天未联系的线索。</div>';

  /* 2) 临期待办：未完成、且 3 天内到期（含已逾期） */
  var dueTodos = todos.filter(function(t){ return !t.done && t.due; })
    .map(function(t){ var d = dayDiff(t.due); return d === null ? null : { t: t, left: -d }; })
    .filter(function(x){ return x && x.left <= 3; })
    .sort(function(a,b){ return a.left - b.left; });
  $('dashTodo').innerHTML = dueTodos.slice(0,4).map(function(x){
    var t = x.t;
    var badge, cls;
    if (x.left < 0) { badge = '逾期 ' + (-x.left) + ' 天'; cls = 'bad'; }
    else if (x.left === 0) { badge = '今天到期'; cls = 'warn'; }
    else { badge = x.left + ' 天后'; cls = 'info'; }
    var sub = [t.due, t.leadName].filter(Boolean).join(' · ');
    return '<button type="button" class="dash-row" onclick="go(\'modules/todos.html\')">'
      + '<span class="dr-main"><span class="dr-t">' + escHtml(t.title || '未命名待办') + '</span>'
      + '<span class="dr-s">' + escHtml(sub) + '</span></span>'
      + '<span class="dr-badge ' + cls + '">' + escHtml(badge) + '</span></button>';
  }).join('') || '<div class="dash-empty">3 天内没有到期待办。</div>';

  /* 3) 最近报价：按日期倒序，最多 4 张 */
  var STATUS = { draft:'草稿', sent:'已发送', accepted:'已接受', rejected:'已拒绝', expired:'已过期' };
  var STATUS_CLS = { draft:'info', sent:'warn', accepted:'ok', rejected:'bad', expired:'bad' };
  var qs = quotes.slice().sort(function(a,b){
    return String(b.date || b.updatedAt || b.createdAt || '').localeCompare(String(a.date || a.updatedAt || a.createdAt || ''));
  });
  $('dashQuote').innerHTML = qs.slice(0,4).map(function(q){
    var money = (q.currency || 'USD') + ' ' + Number(q.total || 0).toLocaleString();
    var sub = [q.leadName, money].filter(Boolean).join(' · ');
    var st = q.status || 'draft';
    return '<button type="button" class="dash-row" onclick="go(\'modules/quotes.html\')">'
      + '<span class="dr-main"><span class="dr-t">' + escHtml(q.no || '未编号报价') + '</span>'
      + '<span class="dr-s">' + escHtml(sub) + '</span></span>'
      + '<span class="dr-badge ' + (STATUS_CLS[st] || 'info') + '">' + escHtml(STATUS[st] || st) + '</span></button>';
  }).join('') || '<div class="dash-empty">还没有报价，去新建一张？</div>';
}

function refresh(){
  var leads = DataStore.list('leads'), todos = DataStore.list('todos'), quotes = DataStore.list('quotes');
  var today = new Date(); var ts = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  var open=0;
  todos.forEach(function(t){
    if (!t.done) open++;
  });
  $('hLeads').textContent=leads.length;
  var he=$('homeEmpty'); if(he) he.style.display = (leads.length || todos.length || quotes.length) ? 'none' : 'block';
  $('hScored').textContent=leads.filter(function(l){return l.score!=null;}).length;
  $('hQuotes').textContent=quotes.filter(function(q){return q.status==='sent'||q.status==='draft';}).length;
  $('hTodos').textContent=open;
  renderDash(leads, todos, quotes);
  var aiLeft=null; try{ aiLeft=AgnesAI.aiTrialLeft(); }catch(e){}
  var aiUsed=0; try{ aiUsed=AgnesAI.todayCount(); }catch(e){}
  var aiChip=$('aiCnt');
  if (aiChip){
    aiChip.textContent = aiLeft===null ? 'AI 不限' : 'AI 剩余 '+aiLeft+' 次';
    aiChip.title = (aiLeft===null ? '已激活，AI 不限次数' : 'AI 剩余次数 '+aiLeft+' / '+AgnesAI.aiTrialLimit)
      + ' · 今日已用 '+aiUsed+' 次 · 点击打开 AI 设置';
  }
  paintLicenseDot();
  refreshBackupBar();
}
function paintLicenseDot(){
  var dot=$('mDot'); if(!dot)return;
  var s=null; try{ s=License.status(); }catch(e){}
  if(!s||(!s.pro&&!s.state)){ dot.style.background='rgba(255,255,255,.45)'; dot.title='授权状态未知'; return; }
  if(s.pro){ dot.style.background='#7ee2b8'; dot.title='已授权 · '+(s.company||''); }
  else if(s.state==='trial_over'){ dot.style.background='#ff6b6b'; dot.title='试用已结束，点此激活'; }
  else { dot.style.background='#f6c453'; dot.title='试用 · 剩 '+s.daysLeft+' 天 / '+s.usesLeft+' 次'; }
}
async function aiBrief(){
  var todos = DataStore.list('todos').filter(function(t){ return !t.done; });
  var leads = DataStore.list('leads');
  if (!todos.length && !leads.length){ toast('先去录入线索吧'); return; }
  $('btnBrief').textContent='⏳ 生成中…'; $('btnBrief').disabled=true;
  try {
    var res = await AgnesAI.genDailyPlan(todos, leads);
    var html = '<b>🧭 今天最重要的一件事：</b>'+(res.focus||'—')+'<br><br>';
    if (res.plan && res.plan.length){
      var todosAll = DataStore.list('todos'); var leadsAll = leads;
      html += res.plan.map(function(p){
        var label = '';
        var t = todosAll.find(function(x){return x.id===p.id;});
        if (t) label = '待办：'+t.title;
        else { var l = leadsAll.find(function(x){return x.id===p.id;}); if (l) label='线索：'+l.name+'（'+(l.stage||'')+'）'; }
        return '<div>#'+p.rank+' '+label+'<span style="color:var(--text-2)"> — '+p.why+'</span></div>';
      }).join('');
    }
    $('briefWrap').innerHTML = '<div class="ft-ai-output ft-card" style="padding:var(--sp-4)">'+html+'</div>';
  } catch(e){ toast('简报失败：'+e.message.slice(0,80)); }
  $('btnBrief').textContent='🧭 生成简报'; $('btnBrief').disabled=false;
}
/* 统一走 assets/a11y.js 的右下角提示条，避免同一句提示出现在多个位置 */
function toast(msg){ if (window.FT && FT.toast) FT.toast(msg); }

/* ---------- 备份 / 恢复 v2：完整 JSON 覆盖全部 11 个存储键（HUIDI feature 5） ---------- */
var COLL_LABEL = {
  leads:'线索', todos:'待办', outreach:'触达', quotes:'报价', docs:'单证',
  reviews:'复盘', comps:'竞品', profile:'资料', products:'商品', searches:'搜索历史', cfg:'配置'
};
function readRaw(lsKey){
  try { return JSON.parse(localStorage.getItem(lsKey)); } catch(e){ return null; }
}
/* ---------- 备份逾期提醒 ----------
   本地存储唯一的真实死法是“忘了备份”。记录上次备份时间，
   有业务数据且从未备份 / 超过 BACKUP_DAYS 天时在内容区顶部提示。 */
var BACKUP_KEY = 'ftc_last_backup';
var BACKUP_SNOOZE_KEY = 'ftc_backup_snooze';
var BACKUP_DAYS = 7;
function backupAgeDays(){
  var raw = null;
  try { raw = localStorage.getItem(BACKUP_KEY); } catch(e){ return null; }
  if (!raw) return null;
  var t = Date.parse(raw);
  if (!isFinite(t)) return null;
  return Math.floor((Date.now() - t) / 86400000);
}
function backupHasData(){
  /* 覆盖全部业务数据类：只维护复盘 / 触达 / 客户资料 / 搜索历史的用户也要收到提醒。
     profile 也是数组（单条记录），统一按数组长度判断。 */
  return ['leads','todos','outreach','quotes','docs','reviews','comps','profile','products','searches'].some(function(name){
    var arr = readRaw(DataStore.KEYS[name]);
    if (Array.isArray(arr)) return arr.length > 0;
    if (arr && typeof arr === 'object') return Object.keys(arr).length > 0;
    return arr != null && arr !== '';
  });
}
function setBackupBar(show){
  var bar = $('backupBar');
  if (!bar) return;
  bar.hidden = !show;
  $('content').classList.toggle('has-banner', show);
}
function refreshBackupBar(){
  var snoozed = false;
  try { snoozed = sessionStorage.getItem(BACKUP_SNOOZE_KEY) === '1'; } catch(e){}
  var days = backupAgeDays();
  var show = !snoozed && backupHasData() && (days === null || days > BACKUP_DAYS);
  setBackupBar(show);
  if (show){
    $('backupMsg').textContent = days === null
      ? '该备份了：还没有备份过'
      : '该备份了：上次备份是 ' + days + ' 天前';
  }
}
function snoozeBackup(){
  try { sessionStorage.setItem(BACKUP_SNOOZE_KEY, '1'); } catch(e){}
  setBackupBar(false);
}
function markBackedUp(){
  try { localStorage.setItem(BACKUP_KEY, new Date().toISOString()); } catch(e){}
  setBackupBar(false);
}
function openLicense(){
  if (typeof License !== 'undefined' && License.showLock) { License.showLock('manual'); return; }
  alert('授权模块没加载成功，请按 Ctrl+F5 强制刷新页面后重试。');
}
function backupAll(){
  var keys = DataStore.KEYS;
  var data = {}, counts = {};
  Object.keys(keys).forEach(function(name){
    var raw = readRaw(keys[name]);
    if (raw === null || raw === undefined){
      data[name] = (name === 'cfg') ? {} : [];
      counts[name] = 0;
      return;
    }
    data[name] = raw;
    counts[name] = Array.isArray(raw) ? raw.length
      : (raw && typeof raw === 'object' ? Object.keys(raw).length : 1);
  });
  data._meta = {
    app: 'FT Compass',
    schema: 'ftc-backup-v2',
    version: 2,
    exportedAt: new Date().toISOString(),
    keys: Object.keys(keys),
    counts: counts
  };
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], {type:'application/json'}));
  a.download = 'ftcompass_backup_' + FT.today() + '.json';
  a.click();
  var parts = Object.keys(counts).map(function(n){ return (COLL_LABEL[n]||n)+' '+counts[n]; });
  toast('完整备份已下载（v2）：'+parts.join('、'));
  markBackedUp();
}
function restoreAll(input){
  var f = input.files && input.files[0];
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function(){
    var data;
    try { data = JSON.parse(reader.result); } catch(e){ toast('文件不是合法 JSON'); return; }
    if (!data || typeof data !== 'object' || Array.isArray(data)){ toast('不是合法的备份结构'); return; }
    if (data._meta && data._meta.app && data._meta.app !== 'FT Compass'){ toast('不是 FT Compass 的备份文件'); return; }
    var keys = DataStore.KEYS;
    var toRestore = [];
    Object.keys(keys).forEach(function(name){
      if (!Object.prototype.hasOwnProperty.call(data, name)) return;
      var val = data[name];
      if (name === 'cfg'){
        if (val && typeof val === 'object' && !Array.isArray(val)) toRestore.push({name:name, val:val, n:1});
        return;
      }
      if (Array.isArray(val)) toRestore.push({name:name, val:val, n:val.length});
    });
    if (!toRestore.length){ toast('备份里没有可恢复的数据'); return; }
    var total = toRestore.reduce(function(s,x){ return s + x.n; }, 0);
    var summary = toRestore.map(function(x){ return (COLL_LABEL[x.name]||x.name)+' '+x.n; }).join('、');
    var ver = (data._meta && (data._meta.schema || ('v'+data._meta.version))) || 'legacy';
    if (!confirm('将覆盖当前数据并写入 '+toRestore.length+' 类 / 共 '+total+' 条（'+ver+'）：\n\n'+summary+'\n\n建议先点备份留底。继续？')) return;
    toRestore.forEach(function(x){ DataStore.saveAll(x.name, x.val); });
    toast('恢复完成：'+toRestore.length+' 类 / '+total+' 条，正在刷新…');
    setTimeout(function(){ location.reload(); }, 1200);
  };
  reader.readAsText(f);
  input.value='';
}
$('agPanel').innerHTML = AgnesAI.settingsHTML();
refresh();
License.ready();
paintLicenseDot();
setTimeout(paintLicenseDot, 400);
</script>
