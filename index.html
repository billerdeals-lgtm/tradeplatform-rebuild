<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FT Compass · 外贸客户开发工作台</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="assets/tokens.css">
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:var(--font-sans); background:var(--bg-page); color:var(--text-1); display:flex; height:100vh; overflow:hidden; }
  /* ---- 侧边栏 ---- */
  nav { width:200px; background:var(--brand-900); color:#fff; display:flex; flex-direction:column; flex-shrink:0; }
  .logo { display:flex; align-items:center; gap:10px; padding:18px 16px 14px; }
  .logo img { width:34px; height:34px; }
  .logo b { font-size:16px; letter-spacing:.5px; }
  .logo span { font-size:10px; opacity:.65; display:block; }
  .navlist { flex:1; padding:6px 8px; }
  .navitem { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--r-sm); cursor:pointer; font-size:14px; color:rgba(255,255,255,.85); margin-bottom:2px; }
  .navitem:hover { background:rgba(255,255,255,.08); }
  .navitem.on { background:var(--brand-700); color:#fff; font-weight:600; }
  .navitem .em { width:20px; text-align:center; }
  .navfoot { padding:12px; border-top:1px solid rgba(255,255,255,.12); font-size:11px; opacity:.6; }
  /* ---- 内容区 ---- */
  .content { flex:1; display:flex; flex-direction:column; min-width:0; }
  iframe { flex:1; border:0; background:var(--bg-page); }
  /* ---- 首页 ---- */
  #home { flex:1; overflow:auto; padding:var(--sp-8); }
  #home h2 { margin:0 0 4px; font-size:22px; }
  #home .sub { color:var(--text-2); font-size:13px; margin-bottom:var(--sp-6); }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:var(--sp-3); margin-bottom:var(--sp-6); }
  .stat { padding:var(--sp-4); text-align:center; cursor:pointer; }
  .stat:hover { border-color:var(--brand-500); }
  .stat b { display:block; font-size:28px; margin-bottom:2px; }
  .stat span { font-size:12px; color:var(--text-2); }
  .brief { margin-bottom:var(--sp-6); }
  .brief .ft-ai-output { font-size:14px; line-height:1.8; }
  .quick { display:flex; gap:var(--sp-3); flex-wrap:wrap; }
  .dialog-wrap { padding:0; }
</style>
</head>
<body>
<nav>
  <div class="logo">
    <img src="assets/logo.svg" alt="">
    <div><b>FT Compass</b><span>外贸客户开发工作台</span></div>
  </div>
  <div class="navlist" id="nav">
    <div class="navitem on" data-view="home"><span class="em">🏠</span>工作台</div>
    <div class="navitem" data-view="modules/find.html"><span class="em">🔍</span>找客户</div>
    <div class="navitem" data-view="modules/leads.html"><span class="em">👤</span>线索 Pipeline</div>
    <div class="navitem" data-view="modules/customer360.html"><span class="em">🎯</span>客户 360°</div>
    <div class="navitem" data-view="modules/todos.html"><span class="em">✅</span>待办任务</div>
    <div class="navitem" data-view="modules/templates.html"><span class="em">🗨</span>话术库</div>
    <div class="navitem" data-view="modules/maillog.html"><span class="em">📧</span>发送记录</div>
    <div class="navitem" data-view="modules/quotes.html"><span class="em">💰</span>报价管理</div>
    <div class="navitem" data-view="modules/calculator.html"><span class="em">🧮</span>利润计算器</div>
    <div class="navitem" data-view="modules/docs.html"><span class="em">📄</span>单证中心</div>
    <div class="navitem" data-view="modules/review.html"><span class="em">📊</span>复盘增长</div>
    <div class="navitem" data-view="modules/holidays.html"><span class="em">🎁</span>复购 · 节假日</div>
    <div class="navitem" data-view="modules/profile.html"><span class="em">📇</span>我的资料</div>
  </div>
  <div class="navfoot">
    数据 100% 本机存储<br>AI：Agnes 2.5 Flash<br><span id="aiCnt"></span>
    <div style="display:flex;gap:6px;margin-top:8px">
      <button onclick="backupAll()" style="flex:1;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:5px 0;font-size:11px;cursor:pointer">⬇ 备份</button>
      <button onclick="document.getElementById('restoreFile').click()" style="flex:1;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:5px 0;font-size:11px;cursor:pointer">⬆ 恢复</button>
    </div>
    <input type="file" id="restoreFile" accept=".json" style="display:none" onchange="restoreAll(this)">
  </div>
</nav>

<div class="content" id="content">
  <!-- 首页简报 -->
  <div id="home">
    <h2>早上好 🧭</h2>
    <div class="sub">FT Compass 自研版 · 8 步闭环第一步已就绪（线索 → 触达 → 成交）</div>
    <div class="grid">
      <div class="ft-card stat" onclick="go('modules/leads.html')"><b id="hLeads" style="color:var(--brand-700)">0</b><span>线索总数</span></div>
      <div class="ft-card stat" onclick="go('modules/leads.html')"><b id="hScored" style="color:var(--accent-500)">0</b><span>已 AI 评分</span></div>
      <div class="ft-card stat" onclick="go('modules/quotes.html')"><b id="hQuotes" style="color:var(--ok)">0</b><span>报价中</span></div>
      <div class="ft-card stat" onclick="go('modules/todos.html')"><b id="hTodos" style="color:var(--warn)">0</b><span>待办</span></div>
    </div>
    <div class="brief" id="briefWrap">
      <div class="ft-card" style="padding:var(--sp-4);display:flex;align-items:center;gap:var(--sp-3)">
        <div style="flex:1"><b>AI 今日简报</b><div style="font-size:12px;color:var(--text-2)">汇总待办与线索评分，生成今天的工作重点</div></div>
        <button class="ft-btn-ai" id="btnBrief" onclick="aiBrief()">🧭 生成简报</button>
      </div>
    </div>
    <div class="quick">
      <button class="ft-btn-primary" onclick="go('modules/leads.html')">＋ 录入线索</button>
      <button class="ft-btn-primary" onclick="go('modules/quotes.html')">💰 新建报价</button>
      <button class="ft-btn-primary" onclick="go('modules/calculator.html')">🧮 利润计算器</button>
      <button class="ft-btn-primary" onclick="go('modules/templates.html')">翻开话术库</button>
      <button class="ft-btn-ai" onclick="dlgSettings.showModal()">⚙ AI 设置</button>
    </div>
  </div>
  <!-- 模块 iframe -->
  <iframe id="frame" style="display:none"></iframe>
</div>

<dialog id="dlgSettings" class="dialog-wrap">
  <div class="dlg-h" style="background:var(--bg-inset);padding:var(--sp-3) var(--sp-4);font-weight:600;display:flex;justify-content:space-between">
    <span>AI 设置（Agnes 2.5 Flash）</span>
    <button class="iconbtn" onclick="dlgSettings.close()">✕</button>
  </div>
  <div style="padding:var(--sp-4)" id="agPanel"></div>
</dialog>

<script src="agnes-ai.js"></script>
<script src="js/datastore.js"></script>
<script>
'use strict';
function go(view){
  document.querySelectorAll('.navitem').forEach(function(n){ n.classList.toggle('on', n.dataset.view===view); });
  if (view==='home'){ location.hash=''; $('frame').style.display='none'; $('home').style.display='block'; refresh(); }
  else { $('frame').src=view; $('frame').style.display='block'; $('home').style.display='none'; }
}
function $(id){ return document.getElementById(id); }
document.querySelectorAll('.navitem').forEach(function(n){
  n.addEventListener('click', function(){ go(n.dataset.view); });
});
function refresh(){
  var leads = DataStore.list('leads'), todos = DataStore.list('todos'), quotes = DataStore.list('quotes');
  var today = new Date(); var ts = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  var open=0;
  todos.forEach(function(t){
    if (!t.done) open++;
  });
  $('hLeads').textContent=leads.length;
  $('hScored').textContent=leads.filter(function(l){return l.score!=null;}).length;
  $('hQuotes').textContent=quotes.filter(function(q){return q.status==='sent'||q.status==='draft';}).length;
  $('hTodos').textContent=open;
  $('aiCnt').textContent='今日 AI 已用 '+AgnesAI.todayCount()+' 次';
}
async function aiBrief(){
  var todos = DataStore.list('todos').filter(function(t){ return !t.done; });
  var leads = DataStore.list('leads');
  if (!todos.length && !leads.length){ toast('先去录入线索吧'); return; }
  $('btnBrief').textContent='⏳ 生成中…'; $('btnBrief').disabled=true;
  try {
    var res = await AgnesAI.genDailyPlan(todos, leads);
    var html = '<b>🧭 今天最重要的一件事：</b>'+(res.focus||'—')+'<br><br>';
    if (res.plan && res.plan.length){
      var todosAll = DataStore.list('todos'); var leadsAll = leads;
      html += res.plan.map(function(p){
        var label = '';
        var t = todosAll.find(function(x){return x.id===p.id;});
        if (t) label = '待办：'+t.title;
        else { var l = leadsAll.find(function(x){return x.id===p.id;}); if (l) label='线索：'+l.name+'（'+(l.stage||'')+'）'; }
        return '<div>#'+p.rank+' '+label+'<span style="color:var(--text-2)"> — '+p.why+'</span></div>';
      }).join('');
    }
    $('briefWrap').innerHTML = '<div class="ft-ai-output ft-card" style="padding:var(--sp-4)">'+html+'</div>';
  } catch(e){ toast('简报失败：'+e.message.slice(0,80)); }
  $('btnBrief').textContent='🧭 生成简报'; $('btnBrief').disabled=false;
}
function toast(msg){ var t=document.createElement('div'); t.textContent=msg;
  t.style.cssText='position:fixed;top:16px;right:16px;background:var(--brand-900);color:#fff;padding:8px 20px;border-radius:999px;font-size:13px;z-index:99';
  document.body.appendChild(t); setTimeout(function(){t.remove();},2600); }

/* ---------- 备份 / 恢复（防 localStorage 清空丢数据） ---------- */
function backupAll(){
  var data = DataStore.exportAll();
  data._meta = { app:'FT Compass', version:1, exportedAt:new Date().toISOString() };
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], {type:'application/json'}));
  a.download = 'ftcompass_backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  toast('备份已下载（含线索/待办/触达/报价/单证/复盘/竞品全部数据）');
}
function restoreAll(input){
  var f = input.files && input.files[0];
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function(){
    var data;
    try { data = JSON.parse(reader.result); } catch(e){ toast('文件不是合法 JSON'); return; }
    if (!data || data._meta && data._meta.app !== 'FT Compass'){ toast('不是 FT Compass 的备份文件'); return; }
    // 按业务名分组校验：leads/todos/outreach/quotes/docs/reviews/comps
    var valid = Object.keys(data).filter(function(k){ return k!=='_meta' && Array.isArray(data[k]) && DataStore.KEYS[k]; });
    if (!valid.length){ toast('备份里没有可恢复的数据'); return; }
    var total = valid.reduce(function(s,k){ return s+data[k].length; },0);
    if (!confirm('将覆盖当前数据并写入 '+valid.length+' 类共 '+total+' 条记录（建议先点备份留底）。继续？')) return;
    valid.forEach(function(k){ DataStore.saveAll(k, data[k]); });
    toast('恢复完成：'+valid.length+' 类 / '+total+' 条，正在刷新…');
    setTimeout(function(){ location.reload(); }, 1200);
  };
  reader.readAsText(f);
  input.value='';
}
$('agPanel').innerHTML = AgnesAI.settingsHTML();
refresh();
</script>
</body>
</html>
