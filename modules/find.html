<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FT Compass · 找客户</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
<link rel="stylesheet" href="../assets/tokens.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--bg-page); color:var(--text-1); }
  header { background:var(--brand-900); color:#fff; padding:var(--sp-4) var(--sp-6); display:flex; align-items:center; gap:var(--sp-3); }
  header img { width:34px; height:34px; }
  header h1 { font-size:18px; margin:0; flex:1; }
  main { max-width:1060px; margin:0 auto; padding:var(--sp-4) var(--sp-4) 80px; }
  .sa { background:var(--bg-card); border-radius:var(--r-md); box-shadow:var(--shadow-card); padding:var(--sp-4); margin-bottom:var(--sp-4); }
  .row { display:flex; gap:var(--sp-3); flex-wrap:wrap; align-items:flex-end; }
  .field { flex:1; min-width:150px; }
  .field.wide { flex:2.5; min-width:220px; }
  .field label { display:block; font-size:12px; color:var(--text-2); margin-bottom:4px; }
  .field input, .field select { width:100%; box-sizing:border-box; padding:9px 10px; border:1px solid var(--border-strong); border-radius:var(--r-sm); font-size:14px; background:var(--bg-card); }
  .field input:focus, .field select:focus { outline:none; border-color:var(--brand-600); }
  .srcw { margin-top:var(--sp-3); }
  .srcw > label { display:block; font-size:12px; color:var(--text-2); margin-bottom:6px; }
  .srclist { display:flex; flex-wrap:wrap; gap:8px; }
  .srcchip { display:flex; align-items:center; gap:6px; border:1px solid var(--border-strong); border-radius:999px; padding:5px 12px 5px 9px; cursor:pointer; font-size:12.5px; background:var(--bg-card); user-select:none; }
  .srcchip:hover { border-color:var(--brand-600); }
  .srcchip input { margin:0; }
  .srcchip b { font-weight:600; }
  .srcchip span { color:var(--text-3); font-size:11px; }
  .acts { display:flex; gap:var(--sp-3); margin-top:var(--sp-3); align-items:center; flex-wrap:wrap; }
  .btn-main { padding:10px 28px; border-radius:var(--r-sm); border:0; font-size:14px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .btn-ai { background:linear-gradient(135deg,#f59e0b,#f97316); color:#fff; }
  .btn-ai:hover { background:linear-gradient(135deg,#d97706,#ea580c); }
  .btn-ai:disabled { opacity:.5; cursor:not-allowed; }
  .btn-sec { background:var(--bg-inset); color:var(--text-2); border:1px solid var(--border); }
  .status { font-size:13px; color:var(--text-2); }
  .progress { width:100%; height:5px; background:var(--bg-inset); border-radius:3px; margin-top:var(--sp-3); overflow:hidden; display:none; }
  .progress-bar { height:100%; background:linear-gradient(90deg,var(--brand-600),#f59e0b); border-radius:3px; transition:width .4s; width:0%; }
  .stats { display:flex; gap:var(--sp-6); margin:var(--sp-3) 0; }
  .stat { text-align:center; } .stat b { display:block; font-size:22px; font-weight:700; } .stat span { font-size:11.5px; color:var(--text-3); }
  .tw { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; background:var(--bg-card); border-radius:var(--r-md); overflow:hidden; box-shadow:var(--shadow-card); }
  th { background:var(--brand-900); color:#fff; text-align:left; padding:10px 12px; font-size:12px; white-space:nowrap; }
  td { padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:top; }
  tr:hover td { background:var(--bg-inset); }
  .cn { font-weight:600; color:var(--brand-700); } .cn a { color:var(--brand-700); text-decoration:none; } .cn a:hover { text-decoration:underline; }
  .cd { font-size:12px; color:var(--text-3); margin-top:2px; max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cc { font-size:12.5px; line-height:1.6; } .cc a { color:var(--brand-700); text-decoration:none; } .cc a:hover { text-decoration:underline; }
  .badge { font-size:10.5px; padding:2px 7px; border-radius:999px; white-space:nowrap; display:inline-block; margin:1px 2px 1px 0; }
  .b-ddg { background:#dbeafe; color:#1d4ed8; } .b-li { background:#e0e7ff; color:#3730a3; }
  .b-eu { background:#dcfce7; color:#166534; } .b-dir { background:#fef3c7; color:#92400e; }
  .b-ai { background:#fae8ff; color:#86198f; } .b-web { background:#d1fae5; color:#065f46; }
  .bs { font-size:12px; padding:5px 12px; border-radius:var(--r-sm); border:0; cursor:pointer; white-space:nowrap; }
  .bi { background:var(--brand-700); color:#fff; } .bi:hover { background:var(--brand-800); }
  .bd { background:var(--bg-inset); color:var(--text-2); border:1px solid var(--border) !important; }
  .imp { font-size:11px; color:var(--ok); }
  .empty { text-align:center; color:var(--text-3); padding:var(--sp-8) 0; font-size:14px; }
  .log { font-size:12px; color:var(--text-3); margin-top:var(--sp-3); max-height:130px; overflow:auto; background:var(--bg-inset); border-radius:var(--r-sm); padding:8px 12px; display:none; }
  .log div { margin-bottom:1px; } .log .ok { color:var(--ok); } .log .fail { color:var(--danger); }
  dialog { border:0; border-radius:var(--r-lg); box-shadow:0 20px 60px rgba(0,0,0,.3); padding:0; max-width:420px; width:90%; overflow:hidden; }
  dialog::backdrop { background:rgba(0,0,0,.5); backdrop-filter:blur(4px); }
  .dh { background:var(--brand-900); color:#fff; padding:var(--sp-3) var(--sp-4); display:flex; justify-content:space-between; align-items:center; }
  .dh h3 { margin:0; font-size:15px; }
  .dc { background:none; border:0; color:rgba(255,255,255,.7); font-size:20px; cursor:pointer; }
  .db { padding:var(--sp-4); }
  .dr { margin-bottom:var(--sp-3); }
  .dr label { display:block; font-size:12px; color:var(--text-2); margin-bottom:4px; }
  .dr input, .dr textarea { width:100%; box-sizing:border-box; padding:9px 12px; border:1px solid var(--border-strong); border-radius:var(--r-sm); font-size:14px; font-family:var(--font-sans); }
  .dr textarea { min-height:50px; resize:vertical; }
  .dr input:focus, .dr textarea:focus { outline:none; border-color:var(--brand-600); }
  .dr2 { display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-3); }
  .df { display:flex; gap:var(--sp-3); padding:0 var(--sp-4) var(--sp-4); }
  .df button { flex:1; padding:10px; border-radius:var(--r-sm); border:0; font-size:14px; font-weight:600; cursor:pointer; }
  .ds { background:var(--brand-700); color:#fff; }
  .dx { background:var(--bg-inset); color:var(--text-2); }
</style>
</head>
<body>
<header><img src="../assets/logo.svg" alt="logo"><h1>找客户</h1></header>
<main>
  <div class="sa">
    <div class="row">
      <div class="field wide"><label>产品关键词（英文）</label><input id="k_prod" placeholder="如：washing powder, LED light, solar panel"></div>
      <div class="field"><label>目标市场</label>
        <select id="k_region"><option value="">全球</option><option value="Southeast Asia">东南亚</option><option value="Middle East">中东</option><option value="USA">美国</option><option value="Europe">欧洲</option><option value="Africa">非洲</option><option value="Latin America">拉美</option></select>
      </div>
      <div class="field"><label>客户类型</label>
        <select id="k_type"><option value="wholesaler">批发商</option><option value="distributor">经销商</option><option value="importer">进口商</option><option value="retailer">零售商</option></select>
      </div>
    </div>
    <div class="srcw"><label>数据来源（可多选）</label><div class="srclist" id="srclist"></div></div>
    <div class="acts">
      <button class="btn-main btn-ai" id="btnS" onclick="doSearch()">🔍 开始挖掘</button>
      <button class="btn-main btn-sec" id="btnM" onclick="doMore()" style="display:none">➕ 换一批</button>
      <span class="status" id="st"></span>
    </div>
    <div class="progress" id="prog"><div class="progress-bar" id="progBar"></div></div>
  </div>
  <div class="stats">
    <div class="stat"><b id="sN">0</b><span>找到公司</span></div>
    <div class="stat"><b id="sV">0</b><span>已验证</span></div>
    <div class="stat"><b id="sC" style="color:var(--ok)">0</b><span>有联系方式</span></div>
    <div class="stat"><b id="sI" style="color:var(--brand-700)">0</b><span>已转线索</span></div>
  </div>
  <div class="acts" id="bR" style="display:none;margin-top:0">
    <button class="btn-main btn-ai" onclick="bulkImp()">⬇ 一键导入有联系方式的</button>
    <span class="status" id="bS"></span>
  </div>
  <div class="tw"><table id="rT" style="display:none"><thead><tr><th>公司</th><th>国家</th><th>联系方式</th><th>来源</th><th></th></tr></thead><tbody id="rB"></tbody></table></div>
  <div id="eS"><div class="empty">输入产品关键词，选择来源，点击「开始挖掘」<br>系统从搜索引擎 + B2B 目录 + 领英反查多源抓取真实公司，AI 补充联系方式</div></div>
  <div class="log" id="log"></div>
</main>
<dialog id="dlg"><div class="dh"><h3>导入线索</h3><button class="dc" onclick="dlg.close()">✕</button></div>
  <div class="db">
    <div class="dr"><label>公司名 *</label><input id="c_name"></div>
    <div class="dr2"><div class="dr"><label>国家</label><input id="c_country"></div><div class="dr"><label>联系人</label><input id="c_person"></div></div>
    <div class="dr2"><div class="dr"><label>邮箱</label><input id="c_email"></div><div class="dr"><label>WhatsApp/电话</label><input id="c_wa"></div></div>
    <div class="dr"><label>官网</label><input id="c_web"></div>
    <div class="dr"><label>备注</label><textarea id="c_note"></textarea></div>
  </div>
  <div class="df"><button class="dx" onclick="dlg.close()">取消</button><button class="ds" onclick="convSave()">保存到线索</button></div>
</dialog>
<script src="../js/datastore.js"></script><script src="../js/sources.js"></script><script src="../agnes-ai.js"></script><script>
'use strict';
var S={results:[],convIds:{},round:0};

function v(i){return document.getElementById(i).value}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function log(m,ok){var b=$('log');b.style.display='block';var d=document.createElement('div');d.className=ok===true?'ok':ok===false?'fail':'';d.textContent=new Date().toLocaleTimeString()+' '+m;b.appendChild(d);b.scrollTop=b.scrollHeight}
function setP(p){$('prog').style.display=p>0?'block':'none';$('progBar').style.width=p+'%'}
function regionText(){return document.getElementById('k_region').value}
function hasC(r){return(r.email&&r.email.length>3)||(r.phone&&r.phone.length>5)}

/* ---------- 来源选择 ---------- */
function renderSrcList(){
  $('srclist').innerHTML=Sources.META.map(function(s){
    return '<label class="srcchip"><input type="checkbox" id="src_'+s.id+'"'+(s.def?' checked':'')+'> <b>'+esc(s.name)+'</b><span>'+esc(s.desc)+'</span></label>';
  }).join('')
    +'<label class="srcchip"><input type="checkbox" id="optEnrich" checked> <b>AI 补充</b><span>官网/邮箱/WhatsApp</span></label>';
}
function selectedSources(){return Sources.META.filter(function(s){return $('src_'+s.id).checked}).map(function(s){return s.id})}

/* ---------- 抓取工具 ---------- */
async function scrapeWebsite(url){
  try{var body=await Sources.fetchRaw(url,15000);return Sources.extractContacts(body.text)}
  catch(e){return{emails:[],phones:[],was:[]}}
}
async function enrichProfile(c){
  if(!c.profileUrl||c.website)return;
  try{
    var body=await Sources.fetchRaw(c.profileUrl,15000);
    var links=Sources.extractLinks(body,c.profileUrl);
    for(var i=0;i<links.length;i++){
      var d=Sources.domainOf(links[i].url);
      if(d&&!Sources.isBlocked(d)&&!/europages/i.test(d)){c.website='https://'+d;break}
    }
    var txt=body.text||'';
    if(!c.country){var cm=txt.match(/(?:Poland|France|Germany|Italy|Spain|Turkey|Netherlands|Belgium|United Kingdom|USA|China|India|Thailand|Vietnam|Indonesia|Malaysia|Philippines|Saudi Arabia|UAE|Nigeria|South Africa|Brazil|Mexico|Egypt|Pakistan|Bangladesh|Sri Lanka|Morocco|Tunisia|Kenya|Ghana|Colombia|Chile|Peru|Argentina)/i);if(cm)c.country=cm[0]}
    var ct=Sources.extractContacts(txt);
    if(ct.emails.length&&!c.email)c.email=ct.emails[0];
    if(!c.phone){if(ct.was.length)c.phone='+'+ct.was[0];else if(ct.phones.length)c.phone=ct.phones[0]}
  }catch(e){}
}
async function aiEnrich(prod,companies){
  if(!companies.length)return[];
  var p='基于以下从多来源获取的公司信息，补充官网URL和联系方式（邮箱/WhatsApp/电话）。产品：'+prod+'\n\n'
    +companies.map(function(c,i){return (i+1)+'.'+c.name+' | '+(c.country||'未知')+' | '+(c.desc||'')}).join('\n')
    +'\n\n输出JSON：{"companies":[{"i":序号,"website":"官网URL","email":"邮箱","phone":"电话/WhatsApp","why":"一句话评估"}]}'
    +'\n只输出JSON，尽量提供真实信息，不确定的留空。';
  try{
    var txt=await AgnesAI.ask(p,{json:true,temperature:0.2,maxTokens:2000});
    var res=AgnesAI.parseLoose(txt);
    return(res&&res.companies)||[];
  }catch(e){return[]}
}

/* ---------- 合并去重 ---------- */
function dedupe(list){
  var map={},out=[];
  list.forEach(function(c){
    if(!c||!c.name)return;
    var key=c.website?Sources.domainOf(c.website):(c.linkedin?'li:'+c.linkedin.toLowerCase():(c.name||'').toLowerCase().replace(/[^a-z0-9]+/g,''));
    if(!key)return;
    var e=map[key];
    if(e){
      ['email','phone','website','country','desc','linkedin'].forEach(function(k){if(!e[k]&&c[k])e[k]=c[k]});
      if(c.source&&e._sources.indexOf(c.source)<0)e._sources.push(c.source);
      return;
    }
    c._sources=[c.source||'目录'];
    map[key]=c;out.push(c);
  });
  return out;
}

/* ---------- 主流程 ---------- */
async function doSearch(){S.round++;S.results=[];S.convIds={};await runPipeline(false)}

async function doMore(){S.round++;document.getElementById('btnM').disabled=true;await runPipeline(true);document.getElementById('btnM').disabled=false}

async function runPipeline(append){
  var prod=v('k_prod').trim();
  if(!prod){alert('请填写产品关键词');return}
  var ids=selectedSources();
  if(!ids.length){alert('请至少选择一个数据来源');return}
  var ctx={product:prod,region:regionText(),type:v('k_type'),exclude:append?S.results.map(function(r){return (r.name||'').toLowerCase()}):[]};

  $('btnS').disabled=true;$('btnS').innerHTML='⏳ 挖掘中…';
  if(!append){$('btnM').style.display='none';S.results=[];S.convIds={};$('rB').innerHTML=''}
  $('log').innerHTML='';setP(5);

  try{
    // 1. 并行多源抓取
    var done=0,all=[];
    await Promise.all(ids.map(async function(id){
      var nm=Sources.meta(id).name;
      $('st').textContent='📡 抓取 '+nm+'…';
      try{
        var cs=await Sources.run(id,ctx);
        cs.forEach(function(c){all.push(c)});
        log(nm+': '+cs.length+' 家',cs.length>0);
      }catch(e){log(nm+': 失败 '+e.message,false)}
      done++;setP(5+Math.round(done/ids.length*35));
    }));

    var merged=dedupe(all).filter(function(c){return c.name.length>2&&ctx.exclude.indexOf((c.name||'').toLowerCase())<0});
    if(!merged.length)throw new Error('所有来源均未找到公司，请换个关键词或增加来源');
    log('合并去重后 '+merged.length+' 家',true);
    setP(42);

    // 2. 目录页公司 → 官网/国家
    var toProfile=merged.filter(function(c){return c.profileUrl&&!c.website}).slice(0,20);
    for(var i=0;i<toProfile.length;i+=3){
      var b1=toProfile.slice(i,i+3);
      $('st').textContent='🔍 验证公司信息 '+(i+1)+'-'+Math.min(i+3,toProfile.length)+'/'+toProfile.length+'…';
      setP(42+Math.round(i/toProfile.length*13));
      await Promise.all(b1.map(enrichProfile));
    }

    // 3. AI 补充
    if($('optEnrich').checked){
      $('st').textContent='🧠 AI 补充联系方式…';setP(58);
      var aiData=await aiEnrich(prod,merged.slice(0,15));
      aiData.forEach(function(a){
        var idx=parseInt(a.i,10)-1;
        if(merged[idx]){
          if(a.website&&!merged[idx].website)merged[idx].website=a.website;
          if(a.email&&!merged[idx].email)merged[idx].email=a.email;
          if(a.phone&&!merged[idx].phone)merged[idx].phone=a.phone;
          if(a.why&&!merged[idx].desc)merged[idx].desc=a.why;
        }
      });
      log('AI 补充完成');
    }
    setP(72);

    // 4. 抓取官网联系方式
    var toScrape=merged.filter(function(c){return c.website&&!c.email}).slice(0,15);
    for(var j=0;j<toScrape.length;j+=3){
      var b2=toScrape.slice(j,j+3);
      $('st').textContent='🌐 抓取官网 '+(j+1)+'-'+Math.min(j+3,toScrape.length)+'/'+toScrape.length+'…';
      setP(72+Math.round(j/toScrape.length*24));
      await Promise.all(b2.map(async function(c){
        var contacts=await scrapeWebsite(c.website);
        if(contacts.emails.length)c.email=contacts.emails[0];
        if(contacts.was.length)c.phone='+'+contacts.was[0];else if(contacts.phones.length&&!c.phone)c.phone=contacts.phones[0];
        c._verified=true;
      }));
    }

    // 5. 合并结果
    merged.forEach(function(c){S.results.push(c)});
    setP(100);
    var nC=S.results.filter(hasC).length;
    $('st').textContent='✅ '+(append?'追加':'完成')+'：共 '+S.results.length+' 家，'+nC+' 家有联系方式';
    log('总计 '+S.results.length+' 家，'+nC+' 家有联系方式',true);
    DataStore.add('searches',{query:prod,via:ids.join('+'),n:S.results.length,contacts:nC,round:S.round});
    if(merged.length>5)$('btnM').style.display='inline-flex';
    render();
  }catch(e){
    $('st').textContent='❌ '+e.message;
    log('失败: '+e.message,false);
  }
  $('btnS').disabled=false;$('btnS').innerHTML='🔍 开始挖掘';
  setTimeout(function(){setP(0)},2000);
}

/* ---------- 渲染 ---------- */
function srcClass(s){
  s=String(s||'');
  if(/DuckDuckGo/i.test(s))return 'b-ddg';
  if(/LinkedIn/i.test(s))return 'b-li';
  if(/Europages/i.test(s))return 'b-eu';
  if(/go4World|ExportersIndia|ThomasNet|Bing/i.test(s))return 'b-dir';
  if(/AI/i.test(s))return 'b-ai';
  return 'b-web';
}
function render(){
  var nC=S.results.filter(hasC).length;
  var nV=S.results.filter(function(r){return r._verified}).length;
  $('sN').textContent=S.results.length;$('sV').textContent=nV;$('sC').textContent=nC;$('sI').textContent=Object.keys(S.convIds).length;
  $('bR').style.display=nC?'flex':'none';
  if(!S.results.length){$('rT').style.display='none';$('eS').style.display='block';return}
  $('rT').style.display='table';$('eS').style.display='none';
  function sc(r){var s=0;if(hasC(r))s+=100;if(r._verified)s+=50;return-s}
  var list=S.results.map(function(r,i){return{r:r,i:i}}).sort(function(a,b){return sc(a.r)-sc(b.r)});
  $('rB').innerHTML=list.map(function(it){
    var r=it.r,i=it.i,imp=S.convIds[i];
    var badges=(r._sources||[r.source||'目录']).map(function(s){return '<span class="badge '+srcClass(s)+'">'+esc(s)+'</span>'}).join('');
    var ch='';
    if(hasC(r)){
      var items=[];
      if(r.email)items.push('<a href="mailto:'+esc(r.email)+'">✉ '+esc(r.email)+'</a>');
      if(r.phone){var ph=r.phone.replace(/\s/g,'');if(ph.startsWith('+'))items.push('<a href="https://wa.me/'+esc(ph.replace('+',''))+'" target="_blank">🟢 '+esc(r.phone)+'</a>');else items.push('☎ '+esc(r.phone))}
      ch=items.join('<br>');
    }else{ch='<span style="color:var(--text-3)">—</span>'}
    var link=r.website||r.linkedin||'';
    return '<tr><td><div class="cn">'+(link?'<a href="'+esc(link)+'" target="_blank">'+esc(r.name)+'</a>':esc(r.name))+'</div>'+(r.desc?'<div class="cd" title="'+esc(r.desc)+'">'+esc(r.desc.slice(0,80))+'</div>':'')+'</td>'
      +'<td>'+esc(r.country||'—')+'</td><td class="cc">'+ch+'</td>'
      +'<td>'+badges+'</td>'
      +'<td>'+(imp?'<span class="imp">✓ 已导入</span>':(hasC(r)?'<button class="bs bi" onclick="openConv('+i+')">→ 导入</button>':(r.website?'<button class="bs bd" onclick="digOne('+i+')">⛏ 深挖</button>':'')))+'</td></tr>';
  }).join('');
}

async function digOne(i){
  var r=S.results[i];if(!r.website)return;
  $('st').textContent='⛏ 抓取 '+Sources.host(r.website)+'…';
  var c=await scrapeWebsite(r.website);
  if(c.emails.length)r.email=c.emails[0];
  if(c.was.length)r.phone='+'+c.was[0];else if(c.phones.length)r.phone=c.phones[0];
  r._verified=true;
  $('st').textContent=hasC(r)?'✓ 挖到联系方式':'未提取到';render();
}

function openConv(i){
  S._p=i;var r=S.results[i];
  $('c_name').value=r.name||'';$('c_country').value=r.country||'';$('c_email').value=r.email||'';
  $('c_wa').value=r.phone||'';$('c_person').value='';$('c_web').value=r.website||'';
  $('c_note').value='来源：'+((r._sources||[r.source||'']).join('/'))+(r.linkedin?' | 领英：'+r.linkedin:'')+(r.desc?' — '+r.desc.slice(0,80):'');
  dlg.showModal();
}
function convSave(){
  if(S._p==null)return;var name=$('c_name').value.trim();
  if(!name){alert('公司名必填');return}
  var email=$('c_email').value.trim(),phone=$('c_wa').value.trim();
  if(!email&&!phone){alert('邮箱或电话至少填一个');return}
  DataStore.add('leads',{name:name,country:$('c_country').value.trim(),person:$('c_person').value.trim(),market:regionText()?document.getElementById('k_region').selectedOptions[0].text:'',stage:'待开发',wa:phone,email:email,product:v('k_prod').trim(),website:$('c_web').value.trim(),amount:0,last:new Date().toISOString().slice(0,10),note:$('c_note').value.trim(),source:'multi_source'});
  S.convIds[S._p]=name;dlg.close();render();
}
function bulkImp(){
  var n=0;S.results.forEach(function(r,i){if(!hasC(r)||S.convIds[i])return;
    DataStore.add('leads',{name:r.name||'未知',country:r.country||'',person:'',market:regionText()?document.getElementById('k_region').selectedOptions[0].text:'',stage:'待开发',wa:r.phone||'',email:r.email||'',website:r.website||'',product:v('k_prod').trim(),amount:0,last:new Date().toISOString().slice(0,10),note:'来源：'+((r._sources||[r.source||'']).join('/')),source:'multi_source'});
    S.convIds[i]='bulk';n++});
  $('bS').textContent='已导入 '+n+' 条 ✓';render();
}
renderSrcList();
render();
</script></body></html>
