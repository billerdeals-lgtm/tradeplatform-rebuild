<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body { margin:0; font-family:var(--font-sans); background:var(--bg-page); color:var(--text-1); }
  header { background:var(--brand-900); color:#fff; padding:var(--sp-4) var(--sp-6); display:flex; align-items:center; gap:var(--sp-3); }
  header img { width:34px; height:34px; }
  header h1 { font-size:18px; margin:0; flex:1; }
  main { max-width:1060px; margin:0 auto; padding:var(--sp-4) var(--sp-4) 80px; }
  .sa { background:var(--bg-card); border-radius:var(--r-md); box-shadow:var(--shadow-card); padding:var(--sp-4); margin-bottom:var(--sp-4); }
  .row { display:flex; gap:var(--sp-3); flex-wrap:wrap; align-items:flex-end; }
  .field { flex:1; min-width:150px; }
  .field.wide { flex:2.5; min-width:220px; }
  .field label { display:block; font-size:12px; color:var(--text-2); margin-bottom:4px; }
  .field input, .field select { width:100%; box-sizing:border-box; padding:9px 10px; border:1px solid var(--border-field); border-radius:var(--r-sm); font-size:14px; background:var(--bg-card); }
  .field input:focus, .field select:focus { border-color:var(--brand-600); }
  .srcw { margin-top:var(--sp-3); }
  .srcw > .srclabel { display:block; font-size:12px; color:var(--text-2); margin-bottom:6px; }
  .srclist { display:flex; flex-wrap:wrap; gap:8px; }
  .srcchip { display:flex; align-items:center; gap:6px; border:1px solid var(--border-field); border-radius:999px; padding:5px 12px 5px 9px; cursor:pointer; font-size:12.5px; background:var(--bg-card); user-select:none; }
  .srcchip:hover { border-color:var(--brand-600); }
  .srcchip input { margin:0; }
  .srcchip b { font-weight:600; }
  .srcchip span { color:var(--text-3); font-size:11px; }
  .acts { display:flex; gap:var(--sp-3); margin-top:var(--sp-3); align-items:center; flex-wrap:wrap; }
  .btn-main { padding:10px 28px; border-radius:var(--r-sm); border:0; font-size:14px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .btn-ai { background:linear-gradient(135deg,#f59e0b,#f97316); color:#fff; }
  .btn-ai:hover { background:linear-gradient(135deg,#d97706,#ea580c); }
  .btn-ai:disabled { opacity:.5; cursor:not-allowed; }
  .btn-sec { background:var(--bg-inset); color:var(--text-2); border:1px solid var(--border); }
  .status { font-size:13px; color:var(--text-2); }
  .progress { width:100%; height:5px; background:var(--bg-inset); border-radius:3px; margin-top:var(--sp-3); overflow:hidden; display:none; }
  .progress-bar { height:100%; background:linear-gradient(90deg,var(--brand-600),#f59e0b); border-radius:3px; transition:width .4s; width:0%; }
  .stats { display:flex; gap:var(--sp-6); margin:var(--sp-3) 0; }
  .stat { text-align:center; } .stat b { display:block; font-size:22px; font-weight:700; } .stat span { font-size:11.5px; color:var(--text-3); }
  .filterbar { display:none; align-items:center; gap:12px; flex-wrap:wrap; background:var(--bg-card); border-radius:var(--r-md); box-shadow:var(--shadow-card); padding:10px 14px; margin-bottom:10px; font-size:12.5px; color:var(--text-2); }
  .filterbar input[type=range] { width:160px; }
  .filterbar b { color:var(--brand-700); font-size:15px; }
  .tw { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; background:var(--bg-card); border-radius:var(--r-md); overflow:hidden; box-shadow:var(--shadow-card); }
  th { background:var(--brand-900); color:#fff; text-align:left; padding:10px 12px; font-size:12px; white-space:nowrap; }
  td { padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:top; }
  tr:hover td { background:var(--bg-inset); }
  .cn { font-weight:600; color:var(--brand-700); } .cn a { color:var(--brand-700); text-decoration:none; } .cn a:hover { text-decoration:underline; }
  .cd { font-size:12px; color:var(--text-3); margin-top:2px; max-width:250px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cc { font-size:12.5px; line-height:1.6; } .cc a { color:var(--brand-700); text-decoration:none; } .cc a:hover { text-decoration:underline; }
  .badge { font-size:10.5px; padding:2px 7px; border-radius:999px; white-space:nowrap; display:inline-block; margin:1px 2px 1px 0; }
  .b-ddg { background:#dbeafe; color:#1d4ed8; } .b-li { background:#e0e7ff; color:#3730a3; }
  .b-eu { background:#dcfce7; color:#166534; } .b-dir { background:#fef3c7; color:#92400e; }
  .b-ai { background:#fae8ff; color:#86198f; } .b-web { background:#d1fae5; color:#065f46; }
  .score { font-size:16px; font-weight:700; } .score small { font-size:10px; font-weight:400; color:var(--text-3); }
  .tier { font-size:10px; padding:1px 6px; border-radius:999px; margin-left:4px; white-space:nowrap; }
  .t-a { background:#fee2e2; color:#991b1b; } .t-b { background:#ffedd5; color:#9a3412; }
  .t-c { background:#fef9c3; color:#854d0e; } .t-d { background:#f1f5f9; color:#475569; }
  .flags { font-size:11px; color:var(--text-2); margin-top:3px; letter-spacing:1px; }
  .bs { font-size:12px; padding:5px 12px; border-radius:var(--r-sm); border:0; cursor:pointer; white-space:nowrap; }
  .bi { background:var(--brand-700); color:#fff; } .bi:hover { background:var(--brand-800); }
  .bd { background:var(--bg-inset); color:var(--text-2); border:1px solid var(--border) !important; }
  .imp { font-size:11px; color:var(--ok-text); }
  .empty { text-align:center; color:var(--text-3); padding:var(--sp-8) 0; font-size:14px; }
  .log { font-size:12px; color:var(--text-3); margin-top:var(--sp-3); max-height:140px; overflow:auto; background:var(--bg-inset); border-radius:var(--r-sm); padding:8px 12px; display:none; }
  .log div { margin-bottom:1px; } .log .ok { color:var(--ok-text); } .log .fail { color:var(--danger-text); }
  dialog { border:0; border-radius:var(--r-lg); box-shadow:0 20px 60px rgba(0,0,0,.3); padding:0; max-width:420px; width:90%; overflow:hidden; }
  dialog::backdrop { background:rgba(0,0,0,.5); backdrop-filter:blur(4px); }
  .dh { background:var(--brand-900); color:#fff; padding:var(--sp-3) var(--sp-4); display:flex; justify-content:space-between; align-items:center; }
  .dh h3 { margin:0; font-size:15px; }
  .dc { background:none; border:0; color:rgba(255,255,255,.7); font-size:20px; cursor:pointer; }
  .db { padding:var(--sp-4); }
  .dr { margin-bottom:var(--sp-3); }
  .dr label { display:block; font-size:12px; color:var(--text-2); margin-bottom:4px; }
  .dr input, .dr textarea { width:100%; box-sizing:border-box; padding:9px 12px; border:1px solid var(--border-field); border-radius:var(--r-sm); font-size:14px; font-family:var(--font-sans); }
  .dr textarea { min-height:50px; resize:vertical; }
  .dr input:focus, .dr textarea:focus { border-color:var(--brand-600); }
  .dr2 { display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-3); }
  .df { display:flex; gap:var(--sp-3); padding:0 var(--sp-4) var(--sp-4); }
  .df button { flex:1; padding:10px; border-radius:var(--r-sm); border:0; font-size:14px; font-weight:600; cursor:pointer; }
  .ds { background:var(--brand-700); color:#fff; }
  .dx { background:var(--bg-inset); color:var(--text-2); }
  .srcnote { font-size:11.5px; color:var(--text-3); padding:0 var(--sp-4) var(--sp-4); line-height:1.55; }
</style>

<body>
<header><img src="../assets/logo.svg" alt=""><h1>找客户</h1></header>
<main>
  <div class="sa">
    <div class="row">
      <div class="field wide"><label for="k_prod">产品关键词（英文）</label><input id="k_prod" placeholder="如：washing powder, LED light, solar panel"></div>
      <div class="field"><label for="k_region">目标市场</label>
        <select id="k_region"><option value="">全球</option><option value="Southeast Asia">东南亚</option><option value="Middle East">中东</option><option value="USA">美国</option><option value="Europe">欧洲</option><option value="Africa">非洲</option><option value="Latin America">拉美</option></select>
      </div>
      <div class="field"><label for="k_type">客户类型</label>
        <select id="k_type"><option value="wholesaler">批发商</option><option value="distributor">经销商</option><option value="importer">进口商</option><option value="retailer">零售商</option></select>
      </div>
    </div>
    <div class="srcw"><span class="srclabel" id="srcLbl">数据来源（可多选）</span><div class="srclist" id="srclist" role="group" aria-labelledby="srcLbl"></div></div>
    <div class="srcnote">AI 挖掘只负责规划本地化搜索词；它点名的公司必须官网可访问、且名称与域名/标题匹配才会保留，未通过核验的不会出现在结果里。</div>
    <div class="acts">
      <button class="btn-main btn-ai" id="btnS" onclick="doSearch()">🔍 开始挖掘</button>
      <button class="btn-main btn-sec" id="btnM" onclick="doMore()" style="display:none">➕ 换一批</button>
      <span class="status" id="st"></span>
    </div>
    <div class="progress" id="prog"><div class="progress-bar" id="progBar"></div></div>
  </div>
  <div class="stats">
    <div class="stat"><b id="sN">0</b><span>找到公司</span></div>
    <div class="stat"><b id="sH" style="color:#c2410c">0</b><span>高意向(≥7)</span></div>
    <div class="stat"><b id="sC" style="color:var(--ok-text)">0</b><span>有联系方式</span></div>
    <div class="stat"><b id="sI" style="color:var(--brand-700)">0</b><span>已转线索</span></div>
  </div>
  <div class="filterbar" id="fbar">
    <span>最低意向分</span>
    <input type="range" id="minScore" aria-label="最低 AI 评分" min="0" max="12" step="1" value="4" oninput="applyFilter()">
    <b id="minVal">4</b><span>/12</span>
    <span id="fInfo" style="color:var(--text-3)" role="status"></span>
  </div>
  <div class="acts" id="bR" style="display:none;margin-top:0">
    <button class="btn-main btn-ai" onclick="bulkImp()">⬇ 一键导入有联系方式的</button>
    <span class="status" id="bS"></span>
  </div>
  <div class="twhint" id="twhint">← 左右滑动查看完整列 →</div>
  <div class="tw"><table id="rT" aria-label="客户搜索结果" style="display:none"><thead><tr><th scope="col">公司</th><th scope="col">国家</th><th scope="col">意向</th><th scope="col">联系方式</th><th scope="col">来源</th><th scope="col"></th></tr></thead><tbody id="rB"></tbody></table></div>
  <div id="eS"><div class="empty">输入产品关键词，选择来源，点击「开始挖掘」<br>系统用询盘式关键词多源搜索，规则引擎剔除供应商页，AI 给出买家意向分</div></div>
  <div class="log" id="log" role="log"></div>
</main>
<dialog role="dialog" aria-modal="true" id="dlg" aria-label="导入线索"><div class="dh"><h3>导入线索</h3><button class="dc" onclick="dlg.close()" aria-label="关闭">✕</button></div>
  <div class="db">
    <div class="dr"><label for="c_name">公司名 *</label><input id="c_name"></div>
    <div class="dr2"><div class="dr"><label for="c_country">国家</label><input id="c_country"></div><div class="dr"><label for="c_person">联系人</label><input id="c_person"></div></div>
    <div class="dr2"><div class="dr"><label for="c_email">邮箱</label><input id="c_email"></div><div class="dr"><label for="c_wa">WhatsApp/电话</label><input id="c_wa"></div></div>
    <div class="dr"><label for="c_web">官网</label><input id="c_web"></div>
    <div class="dr"><label for="c_note">备注</label><textarea id="c_note"></textarea></div>
  </div>
  <div class="df"><button class="dx" onclick="dlg.close()">取消</button><button class="ds" onclick="convSave()">保存到线索</button></div>
</dialog>
<script src="../js/datastore.js?v=2"></script><script src="../js/sources.js?v=4"></script><script src="../agnes-ai.js?v=8"></script><script src="../js/license.js?v=3"></script><script>
'use strict';
var S={all:[],results:[],convIds:{},round:0,seq:0,_p:null};

function v(i){return document.getElementById(i).value}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function log(m,ok){var b=$('log');b.style.display='block';var d=document.createElement('div');d.className=ok===true?'ok':ok===false?'fail':'';d.textContent=new Date().toLocaleTimeString()+' '+m;b.appendChild(d);b.scrollTop=b.scrollHeight}
function setP(p){$('prog').style.display=p>0?'block':'none';$('progBar').style.width=p+'%'}
function regionText(){return document.getElementById('k_region').value}
function hasC(r){return(r.email&&r.email.length>3)||(r.phone&&r.phone.length>5)}

/* ---------- 来源选择 ---------- */
function renderSrcList(){
  $('srclist').innerHTML=Sources.META.map(function(s){
    return '<label class="srcchip"><input type="checkbox" id="src_'+s.id+'"'+(s.def?' checked':'')+'> <b>'+esc(s.name)+'</b><span>'+esc(s.desc)+'</span></label>';
  }).join('')
    +'<label class="srcchip"><input type="checkbox" id="optEnrich" checked> <b>AI 评分/补充</b><span>买家意向分 + 联系方式</span></label>';
}
function selectedSources(){return Sources.META.filter(function(s){return $('src_'+s.id).checked}).map(function(s){return s.id})}

/* ---------- 批处理 ---------- */
async function inBatches(list,size,fn,label){
  for(var i=0;i<list.length;i+=size){
    var batch=list.slice(i,i+size);
    if(label)$('st').textContent=label+' '+(i+1)+'-'+Math.min(i+size,list.length)+'/'+list.length+'…';
    await Promise.all(batch.map(function(x){return fn(x)}));
  }
}

/* ---------- 合并去重 ---------- */
function dedupe(list){
  var map={},out=[];
  list.forEach(function(c){
    if(!c||!c.name)return;
    var key=c.website?Sources.domainOf(c.website):(c.linkedin?'li:'+c.linkedin.toLowerCase():(c.name||'').toLowerCase().replace(/[^a-z0-9]+/g,''));
    if(!key)return;
    var e=map[key];
    if(e){
      ['email','phone','website','country','desc','linkedin'].forEach(function(k){if(!e[k]&&c[k])e[k]=c[k]});
      if(c.source&&e._sources.indexOf(c.source)<0)e._sources.push(c.source);
      return;
    }
    c._sources=[c.source||'目录'];
    map[key]=c;out.push(c);
  });
  return out;
}

/* ---------- 主流程 ---------- */
async function doSearch(){
  if(typeof License!=='undefined'&&!(await License.consume('find')))return;
  S.round++;S.seq=0;S.all=[];S.results=[];S.convIds={};$('rB').innerHTML='';$('fbar').style.display='none';await runPipeline(false)
}
async function doMore(){S.round++;document.getElementById('btnM').disabled=true;await runPipeline(true);document.getElementById('btnM').disabled=false}

async function runPipeline(append){
  var prod=v('k_prod').trim();
  if(!prod){alert('请填写产品关键词');return}
  var ids=selectedSources();
  if(!ids.length){alert('请至少选择一个数据来源');return}
  var ctx={
    product:prod,
    region:regionText(),
    type:v('k_type'),
    queries:Sources.buildQueries(prod,regionText(),v('k_type'),14,S.round),
    exclude:append?S.all.map(function(r){return (r.name||'').toLowerCase()}):[]
  };
  log('关键词矩阵：'+ctx.queries.length+' 条 · '+ctx.queries.slice(0,3).map(function(o){return o.q}).join(' ｜ '),true);

  $('btnS').disabled=true;$('btnS').innerHTML='⏳ 挖掘中…';
  if(!append){$('btnM').style.display='none';$('rB').innerHTML='';$('log').innerHTML=''}
  setP(5);

  try{
    /* 1. 多源并行抓取 */
    var done=0,all=[];
    await Promise.all(ids.map(async function(id){
      var nm=Sources.meta(id).name;
      $('st').textContent='📡 抓取 '+nm+'…';
      try{
        var cs=await Sources.run(id,ctx);
        cs.forEach(function(c){all.push(c)});
        log(nm+': '+cs.length+' 家',cs.length>0);
        if(id==='ai'&&Sources.lastAiStats){
          var ast=Sources.lastAiStats;
          log('AI 核验：模型建议 '+ast.suggested+' 家 / 官网通过 '+ast.verified+' 家 / 丢弃 '+ast.dropped+' 家；搜索词新增 '+ast.fromSearch+' 家',ast.verified>0||ast.fromSearch>0);
        }
      }catch(e){log(nm+': 失败 '+e.message,false)}
      done++;setP(5+Math.round(done/ids.length*20));
    }));

    var merged=dedupe(all).filter(function(c){
      /* 兜底：AI 来源必须带核验标记，防止未核验公司漏进结果 */
      if(c.source==='AI'&&!c._aiVerified)return false;
      return c.name.length>2&&ctx.exclude.indexOf((c.name||'').toLowerCase())<0;
    });
    if(!merged.length)throw new Error('所有来源均未找到公司，请换个关键词或增加来源');
    log('合并去重后 '+merged.length+' 家',true);
    setP(27);

    /* 2. 规则预筛（名称+摘要） */
    var before=merged.length;
    merged=merged.filter(function(c){
      var rc=Sources.ruleCheck((c.name||'')+' '+(c.desc||''),false);
      if(rc.skip)return false;
      c._rule=rc;return true;
    });
    if(before-merged.length)log('规则预筛剔除 '+(before-merged.length)+' 家供应商/电商页');
    if(!merged.length)throw new Error('候选全部被规则判为供应商页，请换个关键词');
    setP(32);

    /* 3. 抓取页面（官网/目录页），提取联系方式与国家 */
    var pool=merged.filter(function(c){return c.website||c.profileUrl}).slice(0,20);
    await inBatches(pool,4,async function(c){
      /* AI 源已在核验阶段抓过官网，避免重复请求 */
      if(c._aiVerified&&c._text){c._verified=true;return}
      var url=c.website||c.profileUrl;
      try{
        var info=await Sources.pageInfo(url,15000);
        c._text=info.text;
        if(!c.website&&c.profileUrl){
          var w=Sources.pickWebsite(info.links,Sources.domainOf(c.profileUrl));
          if(w)c.website=w;
        }
        if(!c.country)c.country=Sources.detectCountry(info.text,'');
        var ct=info.contacts;
        if(ct.emails.length&&!c.email)c.email=ct.emails[0];
        if(!c.phone){if(ct.was.length)c.phone='+'+ct.was[0];else if(ct.phones.length)c.phone=ct.phones[0]}
        if(!c.desc&&info.text)c.desc=info.text.replace(/\s+/g,' ').slice(0,160);
        c._verified=true;
      }catch(e){c._fetchFail=true}
    },'🌐 抓取页面');
    setP(52);

    /* 4. 规则复筛（正文强信号） */
    var live=[];
    merged.forEach(function(c){
      var rc=Sources.ruleCheck((c.name||'')+' '+(c.desc||'')+' '+String(c._text||'').slice(0,4000),true);
      if(rc.skip){log('剔除 '+c.name+'：'+rc.reason);return}
      c._rule=rc;live.push(c);
    });
    merged=live;
    if(!merged.length)throw new Error('域名页全部被判为供应商，请换个关键词');
    log('规则复筛后剩 '+merged.length+' 家',true);
    setP(58);

    /* 5. AI 买家意向评分 */
    var toScore=merged.slice(0,15),aiMap={};
    if($('optEnrich').checked&&toScore.length&&typeof AgnesAI!=='undefined'){
      $('st').textContent='🧠 AI 买家意向评分…';
      try{
        var arr=await Sources.aiScoreBatch(prod,regionText(),toScore);
        arr.forEach(function(a){var i=parseInt(a.i,10)-1;if(i>=0&&i<toScore.length)aiMap[i]=a});
        log('AI 评分完成 '+Object.keys(aiMap).length+' 家',true);
      }catch(e){log('AI 评分失败：'+e.message,false)}
    }
    merged.forEach(function(c,i){
      var a=aiMap[i];
      var aiScore=a?(Number(a.score)||0):(c._rule?c._rule.score:5);
      c._ai=a?aiScore:null;
      c._price=!!(c._rule&&c._rule.isPriceInquiry)||!!(a&&/price|quotation|rfq|tender|procurement|询价|采购/i.test((a.why||'')+(a.approach||'')));
      c.score=Sources.compositeScore(aiScore,c._price);
      c.tier=Sources.tierOf(c.score);
      if(a){
        if(a.country&&!c.country)c.country=a.country;
        if(a.type&&!c.type)c.type=a.type;
        if(a.why)c.why=a.why;
        if(a.approach)c.approach=a.approach;
      }
    });
    setP(74);

    /* 6. 二次补全（高分且缺邮箱） */
    var need=merged.filter(function(c){return c.score>=7&&!c.email}).slice(0,6);
    if(need.length){
      await inBatches(need,2,async function(c){
        var ex=await Sources.enrichContacts(c.name,c.website?Sources.domainOf(c.website):'');
        if(ex.emails.length&&!c.email)c.email=ex.emails[0];
        if(!c.phone){if(ex.was.length)c.phone='+'+ex.was[0];else if(ex.phones.length)c.phone=ex.phones[0]}
        if(ex.country&&!c.country)c.country=ex.country;
      },'🔎 二次补全联系方式');
    }
    setP(94);

    /* 7. 入库 + 过滤 */
    merged.forEach(function(c){
      if(S.all.some(function(x){return x.name.toLowerCase()===c.name.toLowerCase()}))return;
      c._id='L'+(S.seq++);
      S.all.push(c);
    });
    setP(100);
    var hi=S.all.filter(function(r){return r.score>=7}).length;
    $('st').textContent='✅ '+(append?'追加':'完成')+'：共 '+S.all.length+' 家，高意向 '+hi+' 家';
    log('总计 '+S.all.length+' 家，高意向 '+hi+' 家',true);
    DataStore.add('searches',{query:prod,via:ids.join('+'),n:S.all.length,contacts:S.all.filter(hasC).length,round:S.round});
    if(S.all.length>5)$('btnM').style.display='inline-flex';
    applyFilter();
  }catch(e){
    $('st').textContent='❌ '+e.message;
    log('失败: '+e.message,false);
    if(!append&&S.all.length===0&&typeof License!=='undefined'){try{License.refund('find')}catch(_){}}
  }
  $('btnS').disabled=false;$('btnS').innerHTML='🔍 开始挖掘';
  setTimeout(function(){setP(0)},2000);
}

/* ---------- 过滤 + 渲染 ---------- */
function applyFilter(){
  var min=parseInt($('minScore').value,10)||0;
  $('minVal').textContent=min;
  S.results=S.all.filter(function(r){return (r.score||0)>=min}).sort(function(a,b){return (b.score||0)-(a.score||0)});
  $('fInfo').textContent='共 '+S.all.length+' 家，显示 '+S.results.length+' 家';
  $('fbar').style.display=S.all.length?'flex':'none';
  render();
}

function srcClass(s){
  s=String(s||'');
  if(/DuckDuckGo/i.test(s))return 'b-ddg';
  if(/LinkedIn/i.test(s))return 'b-li';
  if(/Europages/i.test(s))return 'b-eu';
  if(/go4World|ExportersIndia|ThomasNet|Bing/i.test(s))return 'b-dir';
  if(/AI/i.test(s))return 'b-ai';
  return 'b-web';
}
function flagsOf(r){
  var f='';
  if(r._price)f+='🔥';
  if(r._inquiry)f+='📋';
  if(/distributor|importer|wholesaler|dealer|trader/i.test(r.type||''))f+='⭐';
  if(r.email)f+='📧';
  if(r.phone)f+='💬';
  return f;
}
function render(){
  var nC=S.all.filter(hasC).length;
  var nH=S.all.filter(function(r){return r.score>=7}).length;
  $('sN').textContent=S.all.length;$('sH').textContent=nH;$('sC').textContent=nC;$('sI').textContent=Object.keys(S.convIds).length;
  $('bR').style.display=nC?'flex':'none';
  if(!S.results.length){$('rT').style.display='none';$('eS').style.display='block';$('twhint').style.display='none';return}
  $('rT').style.display='table';$('eS').style.display='none';$('twhint').style.display='';
  $('rB').innerHTML=S.results.map(function(r){
    var imp=S.convIds[r._id];
    var badges=(r._sources||[r.source||'目录']).map(function(s){return '<span class="badge '+srcClass(s)+'">'+esc(s)+'</span>'}).join('');
    var ch='';
    if(hasC(r)){
      var items=[];
      if(r.email)items.push('<a href="mailto:'+esc(r.email)+'">✉ '+esc(r.email)+'</a>');
      if(r.phone){var ph=r.phone.replace(/\s/g,'');if(ph.charAt(0)==='+')items.push('<a href="https://wa.me/'+esc(ph.slice(1))+'" target="_blank">🟢 '+esc(r.phone)+'</a>');else items.push('☎ '+esc(r.phone))}
      ch=items.join('<br>');
    }else{ch='<span style="color:var(--text-3)">—</span>'}
    var link=r.website||r.linkedin||'';
    var tip='理由：'+(r.why||'—')+(r.approach?' ｜ 建议：'+r.approach:'');
    return '<tr><td><div class="cn">'+(link?'<a href="'+esc(link)+'" target="_blank">'+esc(r.name)+'</a>':esc(r.name))+'</div>'+(r.desc?'<div class="cd" title="'+esc(r.desc)+'">'+esc(r.desc.slice(0,80))+'</div>':'')+'</td>'
      +'<td>'+esc(r.country||'—')+'</td>'
      +'<td><span class="score" title="'+esc(tip)+'">'+r.score+'<small>/12</small></span><span class="tier t-'+(r.tier?r.tier.key:'d')+'">'+(r.tier?r.tier.label:'低')+'</span>'+(flagsOf(r)?'<div class="flags">'+flagsOf(r)+'</div>':'')+'</td>'
      +'<td class="cc">'+ch+'</td>'
      +'<td>'+badges+'</td>'
      +'<td>'+(imp?'<span class="imp">✓ 已导入</span>':((hasC(r)||r._inquiry)?'<button class="bs bi" onclick="openConv(\''+r._id+'\')">→ 导入</button>':(r.website?'<button class="bs bd" onclick="digOne(\''+r._id+'\')">⛏ 深挖</button>':'')))+'</td></tr>';
  }).join('');
}

function leadById(id){for(var i=0;i<S.all.length;i++)if(S.all[i]._id===id)return S.all[i];return null}

async function digOne(id){
  var r=leadById(id);if(!r||!r.website)return;
  $('st').textContent='⛏ 抓取 '+Sources.host(r.website)+'…';
  try{
    var info=await Sources.pageInfo(r.website,15000);
    if(info.contacts.emails.length)r.email=info.contacts.emails[0];
    if(!r.phone){if(info.contacts.was.length)r.phone='+'+info.contacts.was[0];else if(info.contacts.phones.length)r.phone=info.contacts.phones[0]}
    if(!r.country)r.country=Sources.detectCountry(info.text,'');
    r._verified=true;
  }catch(e){}
  $('st').textContent=hasC(r)?'✓ 挖到联系方式':'未提取到';render();
}

function openConv(id){
  var r=leadById(id);if(!r)return;
  S._p=id;
  $('c_name').value=r.name||'';$('c_country').value=r.country||'';$('c_email').value=r.email||'';
  $('c_wa').value=r.phone||'';$('c_person').value='';$('c_web').value=r.website||'';
  $('c_note').value='来源：'+((r._sources||[r.source||'']).join('/'))+(r.why?' | 意向：'+r.why:'')+(r.linkedin?' | 领英：'+r.linkedin:'');
  dlg.showModal();
}
function convSave(){
  if(!S._p)return;var name=$('c_name').value.trim();
  if(!name){alert('公司名必填');return}
  var email=$('c_email').value.trim(),phone=$('c_wa').value.trim();
  var lead=leadById(S._p);
  if(!email&&!phone&&!(lead&&lead._inquiry)){alert('邮箱或电话至少填一个');return}
  DataStore.add('leads',{name:name,country:$('c_country').value.trim(),person:$('c_person').value.trim(),market:regionText()?document.getElementById('k_region').selectedOptions[0].text:'',stage:'待开发',wa:phone,email:email,product:v('k_prod').trim(),website:$('c_web').value.trim(),amount:0,last:FT.today(),note:$('c_note').value.trim(),source:'multi_source'});
  S.convIds[S._p]=name;dlg.close();render();
}
function bulkImp(){
  var n=0;S.results.forEach(function(r){
    if(!hasC(r)||S.convIds[r._id])return;
    DataStore.add('leads',{name:r.name||'未知',country:r.country||'',person:'',market:regionText()?document.getElementById('k_region').selectedOptions[0].text:'',stage:'待开发',wa:r.phone||'',email:r.email||'',website:r.website||'',product:v('k_prod').trim(),amount:0,last:FT.today(),note:'来源：'+((r._sources||[r.source||'']).join('/'))+(r.why?' | '+r.why:''),source:'multi_source'});
    S.convIds[r._id]='bulk';n++;
  });
  $('bS').textContent='已导入 '+n+' 条 ✓';render();
}
renderSrcList();
render();
</script></body></html>
