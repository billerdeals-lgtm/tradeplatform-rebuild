<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FT Compass · 找客户</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
<link rel="stylesheet" href="../assets/tokens.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--bg-page); color:var(--text-1); }
  header { background:var(--brand-900); color:#fff; padding:var(--sp-4) var(--sp-6); display:flex; align-items:center; gap:var(--sp-3); }
  header img { width:34px; height:34px; }
  header h1 { font-size:18px; margin:0; flex:1; }
  main { max-width:920px; margin:0 auto; padding:var(--sp-6) var(--sp-4) 80px; }
  .row { display:flex; gap:var(--sp-4); flex-wrap:wrap; align-items:flex-end; }
  .field { flex:1; min-width:170px; }
  .field.wide { flex:2.2; min-width:240px; }
  label { display:block; font-size:12.5px; color:var(--text-3); margin-bottom:5px; }
  input, select {
    width:100%; box-sizing:border-box; padding:10px 2px; border:0; border-bottom:1.5px solid var(--border-strong);
    font-size:14.5px; font-family:var(--font-sans); background:transparent; color:var(--text-1); transition:border-color .15s;
  }
  select { cursor:pointer; }
  input:focus, select:focus { outline:none; border-bottom-color:var(--brand-700); }
  ::placeholder { color:var(--text-3); opacity:.55; }
  .qbox { width:100%; font-family:var(--font-mono); font-size:13.5px; color:var(--brand-700); background:var(--bg-inset); border:0; border-radius:var(--r-sm); padding:11px 14px; margin-top:var(--sp-4); }
  .qbox:focus { outline:2px solid var(--brand-100); }
  .acts { display:flex; gap:var(--sp-3); margin-top:var(--sp-4); align-items:center; flex-wrap:wrap; }
  .status { font-size:13px; color:var(--text-2); }
  .ft-ai-output { white-space:pre-wrap; font-size:13.5px; margin-top:var(--sp-3); display:none; }
  .ai-badge { display:inline-block; font-size:11.5px; padding:2px 10px; border-radius:999px; margin-right:6px; }
  .ai-buyer { background:var(--accent-100); color:#8a5a00; }
  .ai-noise { background:var(--bg-inset); color:var(--text-3); }
  .ai-maybe { background:var(--info-bg); color:var(--info); }
  .ai-why { font-size:12.5px; color:#8a5a00; margin-top:4px; }
  .hist { font-size:12.5px; color:var(--text-3); margin-top:var(--sp-4); }
  .hist span { display:inline-block; background:var(--bg-inset); border-radius:999px; padding:3px 12px; margin:3px 6px 3px 0; cursor:pointer; }
  .hist span:hover { background:var(--brand-100); }
  .stats { display:flex; gap:var(--sp-8); margin:var(--sp-6) 0 var(--sp-5); padding:0 var(--sp-2); }
  .stat b { display:block; font-size:24px; font-weight:600; }
  .stat span { font-size:12px; color:var(--text-3); }
  .res { background:var(--bg-card); border-radius:var(--r-md); box-shadow:var(--shadow-card); padding:var(--sp-3) var(--sp-4); margin-bottom:var(--sp-3); }
  .res h3 { font-size:14.5px; margin:0 0 3px; }
  .res h3 a { color:var(--brand-700); text-decoration:none; }
  .res h3 a:hover { text-decoration:underline; }
  .res .u { font-size:12px; color:var(--text-3); word-break:break-all; margin-bottom:3px; }
  .res .s { font-size:13px; color:var(--text-2); line-height:1.6; }
  .res .acts { margin-top:8px; }
  .res .acts button { font-size:12px; padding:4px 14px; }
  .empty { text-align:center; color:var(--text-3); padding:var(--sp-8) 0; }
  dialog { border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow-pop); padding:var(--sp-5); max-width:420px; width:92%; }
  dialog::backdrop { background:rgba(31,41,51,.4); }
  dialog h3 { margin:0 0 var(--sp-3); font-size:15px; color:var(--brand-700); }
  dialog label { margin-top:var(--sp-2); }
  dialog input { background:var(--bg-inset); border-radius:var(--r-sm); padding:9px 12px; }
  dialog input:focus { border-bottom:0; }
  .btnrow { display:flex; gap:var(--sp-3); margin-top:var(--sp-4); }
  .ghostbtn { background:none; border:0; cursor:pointer; color:var(--text-2); font-size:13.5px; }
</style>
</head>
<body>
<header>
  <img src="../assets/logo.svg" alt="logo">
  <h1>找客户</h1>
</header>
<main>
  <div class="row">
    <div class="field wide"><label>产品 / 行业关键词（英文）</label><input id="k_prod"></div>
    <div class="field"><label>目标市场</label>
      <select id="k_region">
        <option value="">全球</option>
        <option value="Southeast Asia">东南亚</option>
        <option value="Middle East">中东</option>
        <option value="USA OR Europe">欧美</option>
        <option value="Africa">非洲</option>
        <option value="Philippines">菲律宾</option>
        <option value="Indonesia">印尼</option>
        <option value="Thailand">泰国</option>
        <option value="Malaysia">马来西亚</option>
        <option value="Cambodia">柬埔寨</option>
        <option value="Saudi Arabia OR UAE">海湾六国</option>
      </select>
    </div>
    <div class="field"><label>客户类型</label>
      <select id="k_type">
        <option value="wholesaler OR distributor">批发商/经销商</option>
        <option value="importer">进口商</option>
        <option value="brand owner">品牌方</option>
        <option value="\"online store\" OR shopify">电商卖家</option>
        <option value="supermarket OR chain">商超连锁</option>
      </select>
    </div>
  </div>
  <input id="k_query" class="qbox" placeholder="搜索词自动生成，也可直接手写">
  <div class="acts">
    <button class="ft-btn-primary" onclick="doSearch()">搜索</button>
    <button class="ft-btn-ai" onclick="aiSearch()">🧭 AI 智能搜</button>
    <button class="ghostbtn" onclick="aiExpand()">✨ AI 扩展搜索词</button>
    <span class="status" id="st"></span>
  </div>
  <div id="ai_out" class="ft-ai-output"></div>
  <div class="hist" id="hist"></div>

  <div class="stats">
    <div class="stat"><b id="stN">0</b><span>本次结果</span></div>
    <div class="stat"><b id="stConv">0</b><span>已转线索</span></div>
    <div class="stat"><b id="stTotal">0</b><span>线索总量</span></div>
    <div class="stat"><b id="stHist">0</b><span>历史搜索</span></div>
  </div>

  <div id="results">
    <div class="empty">输入条件开始搜索 · 结果可一键转为线索进入 Pipeline</div>
  </div>
</main>

<!-- 转线索弹窗 -->
<dialog id="dlgLead">
  <h3>转为线索</h3>
  <label>客户名 / 公司名</label><input id="c_name">
  <label>国家</label><input id="c_country">
  <label>邮箱（从摘要自动识别，需核对）</label><input id="c_email">
  <label>WhatsApp / 电话</label><input id="c_wa">
  <label>备注（来源页自动记录）</label><input id="c_note">
  <div class="btnrow">
    <button class="ft-btn-primary" onclick="convSave()">保存到线索 Pipeline</button>
    <button class="ghostbtn" onclick="dlgLead.close()">取消</button>
  </div>
</dialog>

<script src="../js/datastore.js"></script>
<script src="../agnes-ai.js"></script>
<script>
/* 找客户：Bing 搜索经公共 CORS 代理（与原版同思路、自研实现）
   AI 落点：关键词扩展；结果一键转线索（leads）+ 搜索历史（searches） */
var S = { results: [], convIds: {}, pending: null };

/* ---------- 搜索词拼装 ---------- */
function buildQuery() {
  var prod = v('k_prod').trim(), reg = v('k_region'), type = v('k_type');
  if (!prod) return '';
  var q = prod;
  if (type) q += ' ' + type;
  if (reg) q += ' ' + reg;
  q += ' -site:alibaba.com -site:amazon.com -site:aliexpress.com'; // 排除 C 端噪音
  return q;
}
['k_prod','k_region','k_type'].forEach(function(id){
  document.getElementById(id).addEventListener('change', function(){ document.getElementById('k_query').value = buildQuery(); });
});
function v(id) { return document.getElementById(id).value; }
function esc(s) { return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ---------- 代理链：allorigins → codetabs → jina ---------- */
var PROXIES = [
  { name: 'allorigins', wrap: function(u){ return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); }, html: true },
  { name: 'codetabs',   wrap: function(u){ return 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u); }, html: true },
  { name: 'jina',       wrap: function(u){ return 'https://r.jina.ai/' + u; }, html: false }
];
async function fetchThrough(url) {
  for (var i = 0; i < PROXIES.length; i++) {
    var p = PROXIES[i];
    try {
      var r = await fetch(p.wrap(url), { signal: AbortSignal.timeout(20000) });
      if (!r.ok) throw new Error(p.name + ' HTTP ' + r.status);
      var t = await r.text();
      if (t && t.length > 500) return { body: t, html: p.html, via: p.name };
      throw new Error(p.name + ' 返回过短');
    } catch (e) { /* 换下一个代理 */ }
  }
  throw new Error('三个代理全部失败（可能被限流，稍后再试）');
}

/* ---------- Bing 结果解析 ---------- */
function parseBing(body, isHtml) {
  var out = [];
  if (isHtml) {
    var doc = new DOMParser().parseFromString(body, 'text/html');
    doc.querySelectorAll('li.b_algo').forEach(function(li) {
      var a = li.querySelector('h2 a'), cap = li.querySelector('.b_caption p, p');
      if (a && a.href) out.push({ title: a.textContent.trim(), url: a.href, snippet: cap ? cap.textContent.trim() : '' });
    });
  } else {
    // jina 返回 markdown：[标题](url) 后跟摘要
    var lines = body.split('\n'), cur = null;
    lines.forEach(function(l) {
      var m = l.match(/^#{2,4}\s*\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/) || l.match(/^\[([^\]]{5,80})\]\((https?:\/\/[^\)]+)\)\s*$/);
      if (m && m[2].indexOf('bing.com') < 0 && m[2].indexOf('microsoft') < 0) {
        if (cur) out.push(cur);
        cur = { title: m[1].trim(), url: m[2], snippet: '' };
      } else if (cur && !cur.snippet && l.trim().length > 30) {
        cur.snippet = l.trim().slice(0, 300);
      }
    });
    if (cur) out.push(cur);
  }
  return out.filter(function(r){ return r.url.indexOf('bing.com') < 0; });
}

/* ---------- 执行搜索 ---------- */
async function doSearch() {
  var q = v('k_query').trim() || buildQuery();
  if (!q) { document.getElementById('st').textContent = '请先填产品关键词'; return; }
  var st = document.getElementById('st');
  st.textContent = '搜索中（自动切换代理）…';
  try {
    var res = await fetchThrough('https://www.bing.com/search?q=' + encodeURIComponent(q) + '&count=20');
    S.results = parseBing(res.body, res.html).slice(0, 15);
    st.textContent = '经 ' + res.via + ' 返回 ' + S.results.length + ' 条';
    render();
    DataStore.add('searches', { query: q, via: res.via, n: S.results.length });
    renderHist();
  } catch (e) { st.textContent = '❌ ' + e.message; }
}

/* ---------- 渲染 ---------- */
function render() {
  var box = document.getElementById('results');
  document.getElementById('stN').textContent = S.results.length;
  document.getElementById('stConv').textContent = Object.keys(S.convIds).length;
  document.getElementById('stTotal').textContent = DataStore.list('leads').length;
  document.getElementById('stHist').textContent = DataStore.list('searches').length;
  if (!S.results.length) { box.innerHTML = '<div class="empty">无结果，换个关键词试试</div>'; return; }
  // AI 甄别过的：买家在前、噪音沉底（无 verdict 保持原序）
  var rank = { buyer: 0, maybe: 1, none: 2, noise: 3 };
  var list = S.results.map(function(r, i) { return { r: r, i: i }; })
    .sort(function(a, b) { return (rank[(a.r.ai && a.r.ai.verdict) || 'none'] - rank[(b.r.ai && b.r.ai.verdict) || 'none']); });
  box.innerHTML = list.map(function(it) {
    var r = it.r, i = it.i, conv = S.convIds[i];
    var badge = '';
    if (r.ai && r.ai.verdict === 'buyer') badge = '<span class="ai-badge ai-buyer">🧭 AI 判定：' + esc(r.ai.type || '买家') + '</span>';
    else if (r.ai && r.ai.verdict === 'maybe') badge = '<span class="ai-badge ai-maybe">🧭 待观察</span>';
    else if (r.ai && r.ai.verdict === 'noise') badge = '<span class="ai-badge ai-noise">噪音</span>';
    return '<div class="res"' + (r.ai && r.ai.verdict === 'noise' ? ' style="opacity:.55"' : '') + '>'
      + '<h3><a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.title) + '</a></h3>'
      + '<div class="u">' + esc(r.url) + '</div>'
      + badge
      + (r.ai && r.ai.why ? '<div class="ai-why">' + esc(r.ai.why) + '</div>' : '')
      + (r.snippet ? '<div class="s">' + esc(r.snippet) + '</div>' : '')
      + '<div class="acts">' + (conv
        ? '<span class="ft-tag" style="background:var(--ok-bg);color:var(--ok)">✓ 已转线索：' + esc(conv) + '</span>'
        : '<button class="ft-btn-primary" onclick="openConv(' + i + ')">转为线索</button>')
      + '</div></div>';
  }).join('');
}
function renderHist() {
  var hs = DataStore.list('searches').slice(-8).reverse();
  document.getElementById('hist').innerHTML = hs.length
    ? '最近搜索：' + hs.map(function(h){ return '<span onclick="reuse(this)" data-q="' + esc(h.query) + '">' + esc(h.query.slice(0, 46)) + '</span>'; }).join('')
    : '';
}
function reuse(el) { document.getElementById('k_query').value = el.dataset.q; }

/* ---------- 转线索 ---------- */
function openConv(i) {
  S.pending = S.results[i];
  var r = S.pending;
  var host = ''; try { host = new URL(r.url).hostname.replace('www.',''); } catch(e){}
  document.getElementById('c_name').value = r.title.split(/[|\-–—·]/)[0].trim().slice(0, 60);
  document.getElementById('c_country').value = '';
  // 从摘要里捞邮箱/电话
  var em = (r.snippet.match(/[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[a-z]{2,}/) || [''])[0];
  var ph = (r.snippet.match(/\+\d{2}[\d\s-]{7,14}/) || [''])[0].trim();
  document.getElementById('c_email').value = em;
  document.getElementById('c_wa').value = ph;
  document.getElementById('c_note').value = '找客户搜索命中：' + host
    + (S.pending.ai && S.pending.ai.verdict === 'buyer' ? '（AI 判定：' + (S.pending.ai.type || '买家') + '，' + (S.pending.ai.why || '') + '）' : '')
    + (r.snippet ? ' · ' + r.snippet.slice(0, 80) : '');
  dlgLead.showModal();
}
function convSave() {
  if (!S.pending) return;
  var name = v('c_name'); if (!name) { alert('客户名必填'); return; }
  var lead = DataStore.add('leads', {
    name: name, country: v('c_country'), market: v('k_region') ? document.getElementById('k_region').selectedOptions[0].text : '',
    stage: '待开发', wa: v('c_wa'), email: v('c_email'), product: v('k_prod'),
    amount: 0, last: new Date().toISOString().slice(0,10), note: v('c_note'), source: 'search'
  });
  S.convIds[S.results.indexOf(S.pending)] = name;
  dlgLead.close(); render();
}

/* ---------- 🧭 AI 智能搜：生词 → 自动多轮搜索 → 去重 → AI 甄别买家 ---------- */
async function aiSearch() {
  var prod = v('k_prod').trim();
  if (!prod) { alert('先填产品关键词'); return; }
  var st = document.getElementById('st'), box = document.getElementById('ai_out');
  var market = v('k_region') ? document.getElementById('k_region').selectedOptions[0].text : '全球';
  var ctype = document.getElementById('k_type').selectedOptions[0].text;
  try {
    // 第 1 步：AI 生成搜索策略（多组词，覆盖不同客户类型表述）
    st.textContent = '🧭 AI 生成搜索策略…'; box.style.display = 'block'; box.textContent = 'AI 正在规划搜索词…';
    var qRes = await AgnesAI.ask(
      '我要在 Bing 找外贸 B2B 买家网站。产品：' + prod + '；目标市场：' + market + '；优先客户类型：' + ctype + '。'
      + '输出 JSON：{"queries":["英文搜索词1","英文搜索词2",...]}，要求：5 条；每条自带不同的客户类型表述（distributor/wholesaler/importer/agent/buying house 等）；'
      + '每条都带 -site:amazon.com -site:alibaba.com 排除 C 端；覆盖不同用词习惯；不要解释。', { json: true, maxTokens: 500, temperature: 0.4 });
    var queries = (qRes && qRes.queries) || [];
    if (!queries.length) throw new Error('AI 未返回搜索词');
    box.textContent = 'AI 给出 ' + queries.length + ' 组搜索词：\n' + queries.map(function(q){ return '· ' + q; }).join('\n');

    // 第 2 步：逐个自动搜索（最多 4 组，控次数控时间），按 URL 去重合并
    var seen = {}, merged = [];
    for (var qi = 0; qi < Math.min(queries.length, 4); qi++) {
      st.textContent = '🧭 自动搜索 ' + (qi + 1) + '/' + Math.min(queries.length, 4) + '…';
      try {
        var res = await fetchThrough('https://www.bing.com/search?q=' + encodeURIComponent(queries[qi]) + '&count=15');
        parseBing(res.body, res.html).forEach(function(r) {
          var key = r.url.replace(/[#?].*$/, '').replace(/\/$/, '').toLowerCase();
          if (!seen[key]) { seen[key] = 1; merged.push(r); }
        });
      } catch (e) { /* 单组失败不影响整体 */ }
    }
    if (!merged.length) throw new Error('各组搜索均无结果（代理可能限流，稍后再试）');
    S.results = merged.slice(0, 24);
    st.textContent = '去重后 ' + S.results.length + ' 条，AI 甄别中…';
    box.textContent += '\n\n共抓到 ' + merged.length + ' 条，去重 ' + S.results.length + ' 条，正在让 AI 甄别哪些是真买家…';

    // 第 3 步：AI 批量甄别（标题+域名+摘要 → buyer/maybe/noise）
    var digest = S.results.map(function(r, i) {
      var host = ''; try { host = new URL(r.url).hostname; } catch (e) {}
      return i + '| ' + r.title.slice(0, 70) + ' | ' + host + ' | ' + (r.snippet || '').slice(0, 90);
    }).join('\n');
    var vRes = await AgnesAI.ask(
      '以下是外贸客户搜索结果（序号|标题|域名|摘要）。逐条判断是不是值得联系的 B2B 买家/渠道商网站。'
      + '输出 JSON：{"results":[{"i":序号,"verdict":"buyer|maybe|noise","type":"importer/distributor/wholesaler/brand/…","why":"≤15字中文理由"}]}。'
      + '规则：B2B 公司官网=buyer；B2B 平台店铺页/目录黄页/新闻/招聘/C 端零售=noise；介于两者（如行业名录里的公司页）=maybe。\n' + digest,
      { json: true, maxTokens: 1200, temperature: 0.2 });
    ((vRes && vRes.results) || []).forEach(function(vv) {
      var idx = parseInt(vv.i, 10);
      if (S.results[idx] && /^(buyer|maybe|noise)$/.test(vv.verdict)) {
        S.results[idx].ai = { verdict: vv.verdict, type: vv.type || '', why: vv.why || '' };
      }
    });
    var nBuyer = S.results.filter(function(r){ return r.ai && r.ai.verdict === 'buyer'; }).length;
    st.textContent = '完成：' + S.results.length + ' 条中 AI 判定 ' + nBuyer + ' 条买家，已置顶';
    render();
    DataStore.add('searches', { query: '🧭 ' + prod + '（' + market + '）AI 智能搜', via: 'ai-pipeline', n: S.results.length, buyers: nBuyer });
    renderHist();
  } catch (e) {
    st.textContent = '❌ ' + e.message;
    box.style.display = 'block';
    box.textContent = 'AI 智能搜中断：' + e.message;
  }
}

/* ---------- AI 扩展搜索词 ---------- */
async function aiExpand() {
  var prod = v('k_prod').trim();
  if (!prod) { alert('先填产品关键词'); return; }
  var box = document.getElementById('ai_out');
  box.style.display = 'block'; box.textContent = 'AI 扩展搜索词中…';
  try {
    var txt = await AgnesAI.ask('我在用 Bing 搜外贸 B2B 客户（批发商/进口商/经销商网站）。产品：' + prod
      + '，市场：' + (v('k_region') ? document.getElementById('k_region').selectedOptions[0].text : '全球')
      + '。给我 6 条英文 Bing 搜索词，每行一条、不要编号不要解释，覆盖不同客户类型和表述习惯（如 distributor/wholesale/agent/buying house），每条都带排除 C 端的 -site:amazon.com。', { maxTokens: 400 });
    box.textContent = txt;
  } catch (e) { box.textContent = '❌ ' + e.message; }
}
renderHist();
