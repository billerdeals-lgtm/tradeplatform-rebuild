<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FT Compass · 单证中心</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
<link rel="stylesheet" href="../assets/tokens.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--bg-page); color:var(--text-1); }
  header { background:var(--brand-900); color:#fff; padding:var(--sp-4) var(--sp-6); display:flex; align-items:center; gap:var(--sp-3); }
  header img { width:34px; height:34px; }
  header h1 { font-size:18px; margin:0; flex:1; }
  header button { background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.3); border-radius:var(--r-sm); padding:6px 14px; cursor:pointer; }
  main { display:flex; gap:var(--sp-4); max-width:1280px; margin:0 auto; padding:var(--sp-4); align-items:flex-start; }
  /* 左：选择 + 表单 */
  .left { width:400px; flex-shrink:0; }
  .doclist { max-height:180px; overflow:auto; display:flex; flex-wrap:wrap; gap:6px; padding:var(--sp-3); }
  .docchip { font-size:12px; padding:5px 10px; border-radius:999px; border:1px solid var(--border-strong); background:var(--bg-card); cursor:pointer; }
  .docchip.on { background:var(--brand-700); color:#fff; border-color:var(--brand-700); }
  .catlbl { width:100%; font-size:11px; color:var(--text-3); margin-top:4px; }
  /* ---- 单据链 ---- */
  .chain { display:flex; align-items:center; gap:2px; padding:10px var(--sp-3); flex-wrap:wrap; }
  .chain-step { font-size:11.5px; padding:4px 9px; border-radius:999px; border:1px solid var(--border-strong); background:var(--bg-card); cursor:pointer; color:var(--text-2); white-space:nowrap; }
  .chain-step:hover { border-color:var(--brand-700); color:var(--brand-700); }
  .chain-step.done { background:var(--brand-100); border-color:var(--brand-500); color:var(--brand-700); }
  .chain-step.on { background:var(--brand-700); border-color:var(--brand-700); color:#fff; font-weight:600; }
  .chain-arrow { color:var(--text-3); font-size:11px; padding:0 1px; }
  .chain-derive { margin-left:auto; font-size:12px; padding:5px 12px; border-radius:var(--r-sm); border:0; background:var(--accent-500); color:#4a3200; font-weight:600; cursor:pointer; white-space:nowrap; }
  .chain-derive:hover { filter:brightness(1.06); }
  .chain-derive:disabled { opacity:.45; cursor:not-allowed; }
  .derived-line { font-size:11.5px; color:var(--text-3); margin:6px 0 0; }
  .form { padding:var(--sp-4); }
  .form h3 { margin:0 0 8px; font-size:15px; }
  .fgrid { display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-2); }
  .fgrid .full { grid-column:1 / -1; }
  .fgrid label { font-size:11px; color:var(--text-2); display:block; margin-bottom:2px; }
  .fgrid input { width:100%; box-sizing:border-box; padding:7px 9px; border:1px solid var(--border-strong); border-radius:var(--r-sm); font-size:13px; }
  .btnrow { display:flex; gap:var(--sp-2); flex-wrap:wrap; margin-top:var(--sp-3); }
  /* 右：预览（A4 纸面） */
  .right { flex:1; min-width:0; }
  .paper { background:#fff; border:1px solid var(--border); border-radius:var(--r-sm); box-shadow:var(--shadow-card); padding:44px 52px; min-height:600px; }
  .paper h2 { text-align:center; font-size:19px; margin:0 0 4px; }
  .paper .no { text-align:right; font-size:12px; color:var(--text-2); }
  .paper .party { display:flex; justify-content:space-between; font-size:13px; line-height:1.6; margin:16px 0; }
  .paper table { width:100%; border-collapse:collapse; font-size:13px; margin:12px 0; }
  .paper th, .paper td { border:1px solid #cfc9b8; padding:7px 10px; text-align:left; }
  .paper th { background:var(--bg-inset); font-size:12px; }
  .paper .notes { font-size:13px; line-height:1.9; margin-top:10px; }
  .paper { position:relative; }
  .paper .sig { position:relative; display:flex; justify-content:space-between; align-items:flex-end; margin-top:48px; font-size:13px; min-height:24px; }
  .aicheck { margin-top:var(--sp-3); font-size:13px; line-height:1.7; }
  .paper-tools { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .paper-tools select { padding:5px 8px; border:1px solid var(--border-strong); border-radius:var(--r-sm); font-size:12px; background:var(--bg-card); }
  /* ---- 品牌：纸面顶部 / 签章（.br-stamps 是 .sig 的绝对子元素，不参与 flex，不撑高度） ---- */
  .br-top { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .br-top-logo { max-height:46px; max-width:180px; object-fit:contain; }
  .br-top-name { font-size:13px; font-weight:600; color:var(--text-2); letter-spacing:.04em; }
  .br-stamps { position:absolute; left:0; bottom:0; width:260px; height:100px; margin:0; padding:0; pointer-events:none; z-index:2; }
  .br-stamp { position:absolute; object-fit:contain; }
  .br-stamp-sign { left:36px; bottom:18px; max-height:54px; max-width:150px; transform:rotate(-6deg); }
  .br-stamp-seal { left:120px; bottom:6px; width:88px; height:88px; transform:rotate(-10deg); opacity:.9; }
  .br-top-in-paper { border-bottom:1px dashed var(--border-strong); padding-bottom:6px; }
  /* ---- 品牌资料弹窗 ---- */
  dialog.br-dlg { border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow-pop); padding:0; max-width:640px; width:94%; }
  dialog.br-dlg::backdrop { background:rgba(31,41,51,.45); }
  .br-h { background:var(--brand-900); color:#fff; padding:var(--sp-4); display:flex; justify-content:space-between; gap:var(--sp-3); }
  .br-h h3 { margin:0 0 4px; font-size:16px; }
  .br-h p { margin:0; font-size:12px; opacity:.75; line-height:1.5; }
  .br-h .iconbtn { background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.3); border-radius:var(--r-sm); padding:4px 10px; cursor:pointer; height:fit-content; }
  .br-b { padding:var(--sp-4); max-height:64vh; overflow:auto; }
  .br-shots { display:grid; grid-template-columns:1fr 1fr 1fr; gap:var(--sp-3); margin-bottom:var(--sp-4); }
  .br-slot { display:flex; flex-direction:column; gap:6px; }
  .br-view { height:96px; border:1.5px dashed var(--border-strong); border-radius:var(--r-sm); background:var(--bg-inset); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .br-view img { max-width:92%; max-height:88px; object-fit:contain; }
  .br-view span { font-size:12px; color:var(--text-3); }
  .br-pick { padding:7px 0; border:1px solid var(--border-strong); border-radius:var(--r-sm); background:var(--bg-card); cursor:pointer; font-size:13px; }
  .br-pick:hover { border-color:var(--brand-700); color:var(--brand-700); }
  .br-hint { font-size:11px; color:var(--text-3); line-height:1.45; }
  .br-name { font-size:11px; color:var(--ok); }
  .br-two { display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-3); }
  .br-dr { margin-bottom:var(--sp-3); }
  .br-dr label { display:block; font-size:12px; color:var(--text-2); margin-bottom:4px; }
  .br-dr input, .br-dr textarea { width:100%; box-sizing:border-box; padding:8px 10px; border:1px solid var(--border-strong); border-radius:var(--r-sm); font-size:14px; font-family:var(--font-sans); }
  .br-dr input:focus, .br-dr textarea:focus { outline:none; border-color:var(--brand-600, var(--brand-700)); }
  .br-f { display:flex; gap:var(--sp-3); justify-content:flex-end; padding:0 var(--sp-4) var(--sp-4); }
  @media print {
    body * { visibility:hidden; }
    .paper, .paper * { visibility:visible; }
    .paper { position:absolute; left:0; top:0; width:100%; border:0; box-shadow:none; }
  }
  dialog { border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow-pop); padding:0; max-width:560px; width:92%; }
  dialog::backdrop { background:rgba(31,41,51,.4); }
  .dlg-h { background:var(--bg-inset); padding:var(--sp-3) var(--sp-4); font-weight:600; display:flex; justify-content:space-between; }
  .dlg-b { padding:var(--sp-4); }
  .dlg-b label { display:block; font-size:13px; color:var(--text-2); margin:var(--sp-3) 0 var(--sp-1); }
  .dlg-b select, .dlg-b textarea { width:100%; box-sizing:border-box; padding:8px 10px; border:1px solid var(--border-strong); border-radius:var(--r-sm); font-size:14px; font-family:var(--font-sans); }
</style>
</head>
<body>
<header>
  <img src="../assets/logo.svg" alt="">
  <h1>单证中心 <span style="font-size:12px;opacity:.7;font-weight:400">20 张出口单证 · 共享字段一次填写全单联动 · AI 单单一致校验</span></h1>
  <button onclick="openBrand()">🏷 品牌资料</button>
  <button onclick="dlgSettings.showModal()">⚙ AI 设置</button>
</header>
<main>
  <div class="left">
    <div class="ft-card doclist" id="doclist"></div>
    <div class="ft-card chain" id="chainBar"></div>
    <div class="ft-card form">
      <h3 id="formTitle">选择一张单证</h3>
      <div class="fgrid" id="formFields"></div>
      <div class="btnrow">
        <button class="ft-btn-primary" onclick="printPaper()">🖨 打印 / 存 PDF</button>
        <button class="iconbtn" onclick="saveDoc()">💾 保存到单证夹</button>
        <button class="iconbtn" onclick="dlgSaved.showModal()">📂 单证夹</button>
        <button class="iconbtn" onclick="importLead()">👤 从线索带入</button>
        <button class="iconbtn" onclick="openPicker()" title="从商品库填入品名/数量/单价/HS">📦 商品库</button>
        <button class="iconbtn" onclick="applyBrand()" title="用品牌资料填充卖方/地址/银行/币种">🏷 带入品牌</button>
        <button class="iconbtn" onclick="exportDocXls()" title="导出客户版 Excel">⬇ Excel</button>
        <button class="iconbtn" onclick="clearForm()">清空</button>
      </div>
      <div class="btnrow paper-tools" id="paperTools"></div>
      <div class="btnrow">
        <button class="ft-btn-ai" onclick="aiCheck()">🧭 AI 单单一致校验</button>
        <button class="ft-btn-ai" onclick="aiPolish()">✨ AI 润色英文备注</button>
      </div>
      <div class="ft-ai-output aicheck" id="aiOut" style="display:none"></div>
    </div>
  </div>
  <div class="right"><div class="paper" id="paper"></div></div>
</main>

<!-- 单证夹 -->
<dialog id="dlgSaved">
  <div class="dlg-h"><span>单证夹（已保存单证）</span><button class="iconbtn" onclick="dlgSaved.close()">✕</button></div>
  <div class="dlg-b" id="savedList" style="max-height:400px;overflow:auto"></div>
</dialog>

<!-- AI 润色 -->
<dialog id="dlgPolish">
  <div class="dlg-h"><span>✨ AI 润色备注</span><button class="iconbtn" onclick="dlgPolish.close()">✕</button></div>
  <div class="dlg-b">
    <label>要润色的内容（中文可）</label>
    <textarea id="polishIn" rows="3" placeholder="例如：请尽快安排余款，我们收到后 3 天内安排发货"></textarea>
    <div style="margin-top:var(--sp-3)">
      <button class="ft-btn-ai" id="btnPolish" onclick="doPolish()">✨ 润色为商务英文</button>
    </div>
    <div class="ft-ai-output" id="polishOut" style="display:none;margin-top:var(--sp-3);white-space:pre-wrap;font-size:14px;line-height:1.7"></div>
  </div>
</dialog>

<!-- 从线索带入 -->
<dialog id="dlgImport">
  <div class="dlg-h"><span>从线索带入客户信息</span><button class="iconbtn" onclick="dlgImport.close()">✕</button></div>
  <div class="dlg-b">
    <label>选择线索（自动带入买方名/地址/产品，AI 评分高的排前面）</label>
    <select id="impLead"></select>
    <div style="margin-top:var(--sp-3);text-align:right">
      <button class="ft-btn-primary" onclick="doImport()">带入</button>
    </div>
  </div>
</dialog>

<!-- AI 设置 -->
<dialog id="dlgSettings">
  <div class="dlg-h"><span>AI 设置（Agnes 2.5 Flash）</span><button class="iconbtn" onclick="dlgSettings.close()">✕</button></div>
  <div class="dlg-b" id="agPanel"></div>
</dialog>

<!-- 从商品库选 -->
<dialog id="dlgPicker">
  <div class="dlg-h"><span>📦 从商品库带入</span><button class="iconbtn" onclick="dlgPicker.close()">✕</button></div>
  <div class="dlg-b" id="pickerList" style="max-height:60vh;overflow:auto"></div>
</dialog>

<!-- 品牌资料（Logo / 电子签名 / 公司公章 + 工商银行信息） -->
<div id="brandHost"></div>

<script src="../agnes-ai.js"></script>
<script src="../js/datastore.js"></script>
<script src="../js/docs_data.js"></script>
<script src="../js/brand.js?v=3"></script>
<script src="../js/excel.js?v=1"></script>
<script src="../js/paper.js?v=1"></script>
<script>
'use strict';
/* ============================================================
   FT Compass 单证中心 v0.1（矩阵 #6 模块）
   共享字段联动 + 通用单证渲染 + AI 校验/润色（结果落 doc.aiCheck）
   ============================================================ */
var current = DOCS_DEF[2]; // 默认 PI
var values = {};           // 字段值（共享+专有）
var editingSavedId = null;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function toast(msg){ var t=document.createElement('div'); t.textContent=msg;
  t.style.cssText='position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--brand-900);color:#fff;padding:8px 20px;border-radius:999px;font-size:13px;z-index:99';
  document.body.appendChild(t); setTimeout(function(){t.remove();},2200); }
function fill(k){ // 占位符替换，未填字段显示浅色占位
  var v = values[k];
  return v ? esc(v) : '<span style="color:#c5bfae">____</span>';
}
function rep(t){ return t.replace(/\{\{(\w+)\}\}/g, function(m,k){ return fill(k); }); }

/* ---------- 左侧：单证选择 ---------- */
function renderList(){
  var cats = []; DOCS_DEF.forEach(function(d){ if(cats.indexOf(d.cat)<0) cats.push(d.cat); });
  var html = '';
  cats.forEach(function(c){
    html += '<div class="catlbl">'+esc(c)+'</div>';
    html += DOCS_DEF.filter(function(d){ return d.cat===c; }).map(function(d){
      return '<span class="docchip'+(d.id===current.id?' on':'')+'" onclick="pick(\''+d.id+'\')">'+esc(d.title.split(' / ')[0])+'</span>';
    }).join('');
  });
  $('doclist').innerHTML = html;
}
function pick(id){
  current = DOCS_DEF.find(function(d){ return d.id===id; });
  editingSavedId = null; $('aiOut').style.display='none';
  renderList(); renderChain(); renderForm(); renderPaper();
}

/* ---------- 单据链：面包屑 + 链式派生 ---------- */
function renderChain(){
  var idx = DOC_CHAIN.indexOf(current.id);
  var html = DOC_CHAIN.map(function(id, i){
    var lab = CHAIN_LABEL[id] || id;
    var cls = 'chain-step' + (id === current.id ? ' on' : (idx >= 0 && i < idx ? ' done' : ''));
    var arrow = i < DOC_CHAIN.length - 1 ? '<span class="chain-arrow">→</span>' : '';
    return '<span class="'+cls+'" onclick="pick(\''+id+'\')" title="切换到 '+esc(lab)+'">'+esc(lab)+'</span>' + arrow;
  }).join('');
  var nextId = idx >= 0 && idx < DOC_CHAIN.length - 1 ? DOC_CHAIN[idx + 1] : null;
  html += nextId
    ? '<button class="chain-derive" onclick="deriveNext()" title="继承本单共享字段，生成 '+esc(CHAIN_LABEL[nextId]||nextId)+'">⛓ 派生下一单：'+esc(CHAIN_LABEL[nextId]||nextId)+' →</button>'
    : '<span style="margin-left:auto;font-size:11.5px;color:var(--text-3)">'+(idx === DOC_CHAIN.length-1 ? '✓ 主链末端' : '非主链单证')+'</span>';
  $('chainBar').innerHTML = html;
}

function todayStr(){ var d=new Date(); return d.toISOString().slice(0,10); }

function genNo(docId){
  var pfx = DOC_NO_PREFIX[docId] || 'DOC';
  var ds = todayStr().replace(/-/g,'');
  var all = DataStore.list('docs').map(function(d){ return String((d.values||{}).no || ''); });
  if (values.no && String(values.no).indexOf(pfx + '-' + ds) === 0) all.push(String(values.no));
  var n = 1;
  var no = pfx + '-' + ds + '-' + String(n).padStart(3, '0');
  while (all.indexOf(no) >= 0){ n++; no = pfx + '-' + ds + '-' + String(n).padStart(3, '0'); }
  return no;
}

/* 链式派生：共享字段继承 → 按目标策略 clear/preset → 血缘 derivedFrom */
function deriveNext(){
  var idx = DOC_CHAIN.indexOf(current.id);
  if (idx < 0 || idx >= DOC_CHAIN.length - 1){ toast('当前单证不在主链上或已是末端'); return; }
  var nextId = DOC_CHAIN[idx + 1];
  var nextDef = DOCS_DEF.find(function(d){ return d.id === nextId; });
  if (!nextDef) return;

  // 源单关键字段缺失时提醒（不阻断）
  var miss = ['buyer','product','total'].filter(function(k){ return !values[k]; });

  // 1) 记录血缘（基于当前值）
  var lineage = {
    fromDocId: current.id,
    fromTitle: current.title,
    fromNo: values.no || '',
    fromSavedId: editingSavedId,
    at: new Date().toISOString()
  };

  // 2) 继承：共享字段全保留（no/date 重开），删掉策略要求 clear 的专有字段
  var next = {};
  Object.keys(values).forEach(function(k){ next[k] = values[k]; });
  var policy = CHAIN_DERIVE[nextId] || { clearKeys: [], presets: {} };
  (policy.clearKeys || []).forEach(function(k){ delete next[k]; });

  // 3) 新单号 + 新日期 + 派生备注
  next.no = genNo(nextId);
  next.date = todayStr();
  next.derivedFrom = lineage;

  // 4) 目标字段空则用 preset
  var presets = policy.presets || {};
  Object.keys(presets).forEach(function(k){
    if (!next[k]) next[k] = presets[k];
  });

  // 5) 若当前源单已保存，确保血缘可回溯（保存源单最新值）
  if (editingSavedId){
    DataStore.update('docs', editingSavedId, { docId: current.id, docTitle: current.title, values: values });
  }

  // 6) 切换到目标单
  values = next;
  current = nextDef;
  editingSavedId = null;
  $('aiOut').style.display = 'none';
  renderList(); renderChain(); renderForm(); renderPaper();

  var msg = '⛓ 已派生：' + (lineage.fromTitle.split(' / ')[0]) + (lineage.fromNo ? ' No.'+lineage.fromNo : '')
    + ' → ' + nextDef.title.split(' / ')[0] + ' No.' + next.no;
  if (miss.length) msg += '（源单缺：' + miss.join('/') + '，请补全）';
  toast(msg);
}

/* 单证夹：从已保存单据直接派生下一单 */
function deriveFromSaved(id){
  var d = DataStore.get('docs', id);
  if (!d) return;
  dlgSaved.close();
  // 载入源单
  editingSavedId = id;
  values = d.values || {};
  current = DOCS_DEF.find(function(x){ return x.id === d.docId; }) || current;
  renderList(); renderChain(); renderForm(); renderPaper();
  // 立即派生
  deriveNext();
}

/* ---------- 表单：共享字段 + 专有字段 ---------- */
function fieldInput(f){
  var ph = f.ph ? ' placeholder="'+esc(f.ph)+'"' : '';
  var cls = (['seller','buyer','product','remark'].indexOf(f.k)>=0) ? 'full' : '';
  return '<div class="'+cls+'"><label>'+esc(f.label)+'</label>'
    + '<input data-k="'+f.k+'" type="'+(f.type||'text')+'"'+ph+' value="'+esc(values[f.k]||'')+'" oninput="onVal(this)"></div>';
}
function renderForm(){
  $('formTitle').textContent = current.title;
  var all = SHARED_FIELDS.concat((current.rows||[]).map(function(r){ return {k:r[0], label:r[1], ph:r[2]}; }));
  $('formFields').innerHTML = all.map(fieldInput).join('');
  renderChain();
}
function onVal(input){
  values[input.dataset.k] = input.value;
  renderPaper(); // 实时联动预览
  // 已保存单证的编辑态：防抖保存
  if (editingSavedId){ clearTimeout(window._sv); window._sv = setTimeout(saveDoc, 800); }
}

/* ---------- 右侧：通用单证渲染 ---------- */
function renderPaper(){
  var d = current;
  var rowsHtml = '';
  if (d.table !== false){
    rowsHtml = '<table><tr><th style="width:50%">Description 品名</th><th>Qty 数量</th><th>Unit Price 单价</th><th>Amount 金额</th></tr>'
      + '<tr><td>'+fill('product')+'</td><td>'+fill('qty')+' '+fill('unit')+'</td><td>'+fill('currency')+' '+fill('price')+'</td><td>'+fill('currency')+' '+fill('total')+'</td></tr></table>';
  }
  var notes = (d.notes||[]).map(function(n){ return '<div>'+rep(n)+'</div>'; }).join('');
  // 品牌：顶部 Logo + 卖方信息增强（全称/地址/税号）
  var brandHdr = Brand.headerHTML();
  if (brandHdr) brandHdr = '<div class="br-top-in-paper">'+brandHdr+'</div>';
  var sellerBlock = Brand.sellerHTML(values.seller, values.sellerAddr);
  if (!sellerBlock) sellerBlock = fill('seller')+'<br>'+fill('sellerAddr');
  // 银行信息：PI 等有 bank 字段时，未手填则用品牌银行自动带出
  var bankBlock = '';
  if ((current.rows||[]).some(function(r){return r[0]==='bank'})){
    var bankVal = values.bank || Brand.bankText();
    if (bankVal) bankBlock = '<div class="notes"><b>Bank Info 收款信息:</b><br>'+esc(bankVal)+'</div>';
  }
  // 签章区：电子签名 + 公司公章 叠在 Seller 签名线上
  var stamp = Brand.signHTML();
  // 链式派生血缘
  var lineage = '';
  if (values.derivedFrom && values.derivedFrom.fromTitle){
    var df = values.derivedFrom;
    lineage = '<div class="derived-line">⛓ Derived from '
      + esc(String(df.fromTitle).split(' / ')[0])
      + (df.fromNo ? ' No. ' + esc(df.fromNo) : '')
      + (df.at ? ' · ' + esc(String(df.at).slice(0,10)) : '')
      + '</div>';
  }
  $('paper').innerHTML =
    brandHdr
    + '<h2>'+esc(d.title.split(' / ')[1]||d.title)+'</h2>'
    + '<div style="text-align:center;font-size:13px;color:var(--text-2);margin-bottom:10px">'+esc(d.title.split(' / ')[0])+'</div>'
    + lineage
    + '<div class="no">No. '+fill('no')+'<br>Date: '+fill('date')+'</div>'
    + '<div class="party"><div><b>Seller 卖方</b><br>'+sellerBlock+'</div>'
    + '<div style="text-align:right"><b>Buyer 买方</b><br>'+fill('buyer')+'<br>'+fill('buyerAddr')+'</div></div>'
    + rowsHtml
    + '<div class="notes">'+notes+'</div>'
    + bankBlock
    + (values.remark ? '<div class="notes"><b>Remarks:</b> '+esc(values.remark)+'</div>' : '')
    + '<div class="sig">'+stamp+'<div>Seller: ______________</div><div>Buyer: ______________</div></div>';
  Paper.apply($('paper'));
}

/* ---------- 纸面模板 / 横竖版 ---------- */
function initPaperTools(){
  $('paperTools').innerHTML = Paper.toolbarHTML();
}
function onPaperStyle(){
  Paper.setStyle($('paperStyle').value);
  renderPaper();
}
function onPaperOrient(){
  Paper.setOrient($('paperOrient').value);
  renderPaper();
}

/* ---------- 商品库带入 ---------- */
function openPicker(){
  var prods = DataStore.list('products');
  if (!prods.length){
    alert('商品库是空的。先到「商品库」建档。');
    return;
  }
  $('pickerList').innerHTML = prods.map(function(p){
    return '<div class="ft-card" style="padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer" onclick="pickProduct(\''+p.id+'\')">'
      + (p.image?'<img src="'+p.image+'" style="width:44px;height:44px;object-fit:contain;background:var(--bg-inset);border-radius:4px" alt="">':'<span style="font-size:22px">📦</span>')
      + '<div style="flex:1;min-width:0"><b style="font-size:13px;display:block">'+esc(p.name)+'</b>'
      + '<span style="font-size:11px;color:var(--text-3)">'
      + [p.sku, p.spec, p.price?(p.currency||'USD')+' '+p.price:'', p.moq?'MOQ '+p.moq:''].filter(Boolean).map(esc).join(' · ')
      + '</span></div>'
      + '<span class="iconbtn">选入</span></div>';
  }).join('');
  dlgPicker.showModal();
}
function pickProduct(id){
  var p = DataStore.get('products', id);
  if (!p) return;
  values.product = p.name || values.product;
  if (p.spec && !values.productSpec) { /* 规格并入备注不覆盖 */ }
  if (p.price && !values.price) values.price = p.price;
  if (p.unit && !values.unit) values.unit = p.unit;
  if (p.moq && !values.qty) values.qty = p.moq;
  if (p.currency && !values.currency) values.currency = p.currency;
  if (p.hsCode && !values.hsCode) values.hsCode = p.hsCode;
  if (p.perCtn && !values.ctns && values.qty) {
    values.ctns = Math.ceil(Number(values.qty) / Number(p.perCtn));
  }
  if (p.gw && !values.gw) values.gw = p.gw;
  if (p.nw && !values.nw) values.nw = p.nw;
  if (p.cbm && !values.meas) values.meas = p.cbm;
  if (p.mark && !values.mark) values.mark = p.mark;
  if (p.spec && !values.remark) values.remark = 'Spec: ' + p.spec;
  dlgPicker.close();
  renderForm(); renderPaper();
  toast('已带入：'+p.name);
}

/* ---------- Excel 客户版 ---------- */
function exportDocXls(){
  if (!values.no && !values.buyer && !values.product){
    alert('先填单号/买方/品名再导出'); return;
  }
  ExcelExport.docClient(current, values, Brand.get());
}

/* ---------- 品牌资料：打开 / 带入 ---------- */
function openBrand(){
  Brand.open('dlgBrand', function(){ renderPaper(); });
}
function applyBrand(){
  var b = Brand.get();
  var n = 0;
  function fillIf(k, v){ if (v && !values[k]){ values[k] = v; n++; } }
  fillIf('seller', b.sellerFull);
  fillIf('sellerAddr', b.addr);
  fillIf('currency', b.currency);
  var bank = Brand.bankText();
  fillIf('bank', bank);
  if (b.taxNo && (!values.sellerAddr || values.sellerAddr.indexOf(b.taxNo) < 0)) {
    var tag = 'Tax/VAT: ' + b.taxNo;
    values.sellerAddr = values.sellerAddr ? (values.sellerAddr + ' / ' + tag) : tag;
    n++;
  }
  renderForm(); renderPaper();
  toast(n ? ('已带入品牌资料 '+n+' 项') : '品牌字段已存在或品牌资料为空');
}

/* ---------- AI 1：单单一致校验（矩阵落点 doc.aiCheck） ---------- */
async function aiCheck(){
  var empty = ['no','date','buyer','product','total'].filter(function(k){ return !values[k]; });
  var out = $('aiOut'); out.style.display='block';
  if (empty.length){ out.innerHTML = '⚠️ 先填关键字段：'+empty.join(', '); return; }
  out.innerHTML = '⏳ AI 校验中…';
  try {
    var txt = await AgnesAI.chat([
      {role:'system', content:'你是外贸单证审核员。输出 JSON：{"ok":true/false,"issues":["问题1"],"suggestion":"一句话建议"}。只查逻辑一致性，不挑措辞。'},
      {role:'user', content:'请校验这张「'+current.title+'」的单据字段逻辑（金额=数量×单价、币种一致、港口一致、日期先后、付款条款完整性等）：\n'+JSON.stringify(values)}
    ], {json:true, temperature:0.2, maxTokens:500});
    var res = JSON.parse(txt);
    out.innerHTML = (res.ok?'✅ 校验通过':'⚠️ 发现问题')
      + (res.issues&&res.issues.length?'<br>· '+res.issues.map(esc).join('<br>· '):'')
      + (res.suggestion?'<br><b>建议：</b>'+esc(res.suggestion):'');
    // 落库
    if (editingSavedId) DataStore.saveAIResult('docs', editingSavedId, { aiCheck:{ok:res.ok, issues:res.issues, at:new Date().toISOString()} });
  } catch(e){ out.innerHTML = '校验失败：'+esc(e.message); }
}

/* ---------- AI 2：备注润色 ---------- */
async function aiPolish(){
  if (!values.remark){ toast('先在备注里写点内容（中文即可）'); return; }
  $('polishIn').value = values.remark;
  $('polishOut').style.display='none'; dlgPolish.showModal();
}
async function doPolish(){
  var src = $('polishIn').value.trim(); if(!src) return;
  $('btnPolish').disabled=true; $('btnPolish').textContent='⏳ 润色中…';
  try {
    var txt = await AgnesAI.chat([
      {role:'system', content:'你是外贸单证英文润色助手。输出礼貌、专业、简洁的商务英文，直接给润色结果，不要解释。'},
      {role:'user', content:'润色成英文备注（用于「'+current.title+'」单证，上下文：客户 '+ (values.buyer||'') +'，金额 '+ (values.currency||'')+' '+(values.total||'') +'）：\n'+src}
    ], {temperature:0.5, maxTokens:300});
    $('polishOut').textContent = txt; $('polishOut').style.display='block';
    values.remark = txt; renderPaper(); syncInput('remark', txt);
  } catch(e){ $('polishOut').textContent='润色失败：'+e.message; $('polishOut').style.display='block'; }
  $('btnPolish').disabled=false; $('btnPolish').textContent='✨ 润色为商务英文';
}
function syncInput(k,v){ var el=document.querySelector('input[data-k="'+k+'"]'); if(el) el.value=v; }

/* ---------- 打印（CSS @media print 只出 A4 预览区） ---------- */
function printPaper(){ window.print(); }

/* ---------- 保存 / 单证夹 ---------- */
function saveDoc(){
  var rec = editingSavedId ? DataStore.get('docs', editingSavedId) : null;
  if (rec){
    DataStore.update('docs', editingSavedId, { docId:current.id, docTitle:current.title, values:values });
  } else {
    var added = DataStore.add('docs', { docId:current.id, docTitle:current.title, values:values });
    editingSavedId = added.id;
  }
  toast('已保存到单证夹');
}
function clearForm(){ values={}; editingSavedId=null; $('aiOut').style.display='none'; renderList(); renderChain(); renderForm(); renderPaper(); }
function renderSaved(){
  var docs = DataStore.list('docs');
  $('savedList').innerHTML = docs.length ? docs.map(function(d){
    var chIdx = DOC_CHAIN.indexOf(d.docId);
    var canDerive = chIdx >= 0 && chIdx < DOC_CHAIN.length - 1;
    return '<div class="ft-card" style="padding:10px;margin-bottom:8px;display:flex;align-items:center;gap:8px">'
      + '<div style="flex:1"><b style="font-size:13px">'+esc(d.docTitle)+'</b>'
      + '<div style="font-size:11px;color:var(--text-2)">No.'+esc(d.values.no||'—')+' · '+esc(d.values.buyer||'—')+' · '+esc((d.updatedAt||d.createdAt||'').slice(0,10))
      + (d.aiCheck?' · <span style="color:'+(d.aiCheck.ok?'var(--ok)':'var(--danger)')+'">AI 校验'+(d.aiCheck.ok?'通过':'有问题')+'</span>':'')
      + ((d.values||{}).derivedFrom?' · <span style="color:var(--brand-700)">⛓ 派生</span>':'')+'</div></div>'
      + (canDerive?'<button class="iconbtn" onclick="deriveFromSaved(\''+d.id+'\')" title="从此单派生下一环">⛓ 派生</button>':'')
      + '<button class="iconbtn" onclick="loadSaved(\''+d.id+'\')">打开</button>'
      + '<button class="iconbtn" onclick="DataStore.remove(\'docs\',\''+d.id+'\');renderSaved()">🗑</button></div>';
  }).join('') : '<div style="color:var(--text-3);text-align:center;padding:20px">单证夹是空的</div>';
}
function loadSaved(id){
  var d = DataStore.get('docs', id); if(!d) return;
  editingSavedId = id; values = d.values||{};
  current = DOCS_DEF.find(function(x){ return x.id===d.docId; }) || current;
  dlgSaved.close(); renderList(); renderChain(); renderForm(); renderPaper();
  if (d.aiCheck){ $('aiOut').style.display='block'; $('aiOut').innerHTML=(d.aiCheck.ok?'✅':'⚠️')+' 上次 AI 校验：'+esc((d.aiCheck.issues||[]).join('；')||'通过'); }
}

/* ---------- 从线索带入客户信息 ---------- */
function importLead(){
  var leads = DataStore.list('leads').slice().sort(function(a,b){ return (b.score||0)-(a.score||0); });
  var opts = '<option value="">（选择线索，自动带入客户/产品）</option>';
  leads.forEach(function(l){
    opts += '<option value="'+l.id+'">'+esc(l.name)+'（'+esc(l.country||'')+' · '+esc(l.product||'')+'）</option>';
  });
  $('impLead').innerHTML = opts;
  dlgImport.showModal();
}

function doImport(){
  var l = DataStore.get('leads', $('impLead').value);
  if (!l){ dlgImport.close(); return; }
  values.buyer = values.buyer || l.name;
  values.buyerAddr = values.buyerAddr || (l.country||'');
  values.product = values.product || l.product || '';
  renderForm(); renderPaper(); dlgImport.close();
  toast('已带入：'+l.name+'（金额/数量需手工确认）');
}

$('agPanel').innerHTML = AgnesAI.settingsHTML();
$('brandHost').innerHTML = Brand.dialogHTML('dlgBrand');

initPaperTools();
renderList(); renderChain(); renderForm(); renderPaper();
