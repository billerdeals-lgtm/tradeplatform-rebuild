<style>
  body { margin:0; font-family:var(--font-sans); background:var(--bg-page); color:var(--text-1); }
  header { background:var(--brand-900); color:#fff; padding:var(--sp-4) var(--sp-6); display:flex; align-items:center; gap:var(--sp-3); }
  header img { width:34px; height:34px; }
  header h1 { font-size:18px; margin:0; flex:1; }
  header button { background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.3); border-radius:var(--r-sm); padding:6px 14px; cursor:pointer; }
  main { display:flex; gap:var(--sp-4); max-width:1280px; margin:0 auto; padding:var(--sp-4); align-items:flex-start; }
  /* 左：选择 + 表单 */
  .left { width:400px; flex-shrink:0; }
  .doclist { max-height:180px; overflow:auto; display:flex; flex-wrap:wrap; gap:6px; padding:var(--sp-3); }
  .docchip { font-size:12px; padding:5px 10px; border-radius:999px; border:1px solid var(--border-field); background:var(--bg-card); cursor:pointer; }
  .docchip.on { background:var(--brand-700); color:#fff; border-color:var(--brand-700); }
  .catlbl { width:100%; font-size:11px; color:var(--text-3); margin-top:4px; }
  /* ---- 单据链 ---- */
  .chain { display:flex; align-items:center; gap:2px; padding:10px var(--sp-3); flex-wrap:wrap; }
  .chain-step { font-size:11.5px; padding:4px 9px; border-radius:999px; border:1px solid var(--border-field); background:var(--bg-card); cursor:pointer; color:var(--text-2); white-space:nowrap; }
  .chain-step:hover { border-color:var(--brand-700); color:var(--brand-700); }
  .chain-step.done { background:var(--brand-100); border-color:var(--brand-500); color:var(--brand-700); }
  .chain-step.on { background:var(--brand-700); border-color:var(--brand-700); color:#fff; font-weight:600; }
  .chain-arrow { color:var(--text-3); font-size:11px; padding:0 1px; }
  .chain-derive { margin-left:auto; font-size:12px; padding:5px 12px; border-radius:var(--r-sm); border:0; background:var(--accent-500); color:#4a3200; font-weight:600; cursor:pointer; white-space:nowrap; }
  .chain-derive:hover { filter:brightness(1.06); }
  .chain-derive:disabled { opacity:.45; cursor:not-allowed; }
  .derived-line { font-size:11.5px; color:var(--text-3); margin:6px 0 0; }
  .form { padding:var(--sp-4); }
  .form h3 { margin:0 0 8px; font-size:15px; }
  .quote-hint { font-size:12px; line-height:1.6; color:#92400e; background:#fffbeb; border:1px dashed #f0b429; border-radius:var(--r-sm); padding:6px 10px; margin:0 0 10px; }
  .fgrid { display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-2); }
  .fgrid .full { grid-column:1 / -1; }
  .fgrid label { font-size:11px; color:var(--text-2); display:block; margin-bottom:2px; }
  .fgrid input { width:100%; box-sizing:border-box; padding:7px 9px; border:1px solid var(--border-field); border-radius:var(--r-sm); font-size:13px; }
  .btnrow { display:flex; gap:var(--sp-2); flex-wrap:wrap; margin-top:var(--sp-3); }
  /* 右：预览（A4 纸面） */
  .right { flex:1; min-width:0; }
  .paper { background:#fff; border:1px solid var(--border); border-radius:var(--r-sm); box-shadow:var(--shadow-card); padding:44px 52px; min-height:600px; }
  .paper h2 { text-align:center; font-size:19px; margin:0 0 4px; }
  .paper .no { text-align:right; font-size:12px; color:var(--text-2); }
  .paper .party { display:flex; justify-content:space-between; gap:20px; font-size:13px; line-height:1.6; margin:16px 0; }
  .paper .party>div { flex:1 1 0; min-width:0; overflow-wrap:anywhere; }
  .paper .party>div:first-child { padding-right:12px; }
  .paper .party>div:last-child { text-align:right; padding-left:12px; }
  .paper table { width:100%; border-collapse:collapse; table-layout:fixed; font-size:13px; margin:12px 0; }
  .paper th, .paper td { border:1px solid #cfc9b8; padding:7px 10px; text-align:left; overflow-wrap:anywhere; }
  .paper th { background:var(--bg-inset); font-size:12px; }
  .paper .notes { font-size:13px; line-height:1.9; margin-top:10px; }
  .paper { position:relative; }
  .paper .sig { position:relative; display:flex; justify-content:space-between; align-items:flex-end; margin-top:48px; font-size:13px; min-height:24px; }
  .aicheck { margin-top:var(--sp-3); font-size:13px; line-height:1.7; }
  .paper-tools { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .paper-tools select { padding:5px 8px; border:1px solid var(--border-field); border-radius:var(--r-sm); font-size:12px; background:var(--bg-card); }
  /* ---- CONFIDENTIAL 内部区（feature 7） ---- */
  .conf-sect { border:1px dashed #f0b429; background:#fffbeb; border-radius:var(--r-sm); padding:8px 10px; margin-top:8px; }
  .conf-badge { display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.04em; color:#92400e; background:#fde68a; border-radius:4px; padding:2px 7px; margin-bottom:6px; }
  .conf-hint { font-size:11px; color:#92400e; margin-top:6px; line-height:1.4; }
  .conf-sect .fgrid label { color:#92400e; }
  .conf-sect input { background:#fff; border-color:#f0b429 !important; }
  /* ---- 多 SKU 明细 ---- */
  .items-block { margin-top:4px; min-width:0; }
  .items-block > label { font-size:11px; color:var(--text-2); display:block; margin-bottom:4px; }
  .items-toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:4px 0 6px; }
  .items-toolbar button { font-size:12px; padding:5px 10px; border:1px solid var(--border-field); border-radius:var(--r-sm); background:var(--bg-card); cursor:pointer; }
  .items-toolbar button:hover { border-color:var(--brand-700); color:var(--brand-700); }
  .items-toggle { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--text-2); margin:0; }
  .items-toggle input { width:auto; margin:0; }
  .items-hint { font-size:11px; color:var(--text-3); }
  .items-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:var(--r-sm); }
  .items-editor { width:100%; min-width:660px; border-collapse:collapse; font-size:12.5px; }
  .items-editor th, .items-editor td { border-bottom:1px solid var(--border); padding:5px 6px; text-align:left; vertical-align:middle; }
  .items-editor th { background:var(--bg-inset); font-size:11px; color:var(--text-2); font-weight:600; white-space:nowrap; }
  .items-editor tr:last-child td { border-bottom:0; }
  .items-editor input { width:100%; box-sizing:border-box; padding:5px 6px; border:1px solid var(--border-field); border-radius:4px; font-size:12.5px; }
  .items-editor .num { text-align:right; font-variant-numeric:tabular-nums; }
  .items-editor .it-img { width:46px; text-align:center; }
  .items-editor .it-img img { width:34px; height:34px; object-fit:contain; background:var(--bg-inset); border-radius:4px; padding:2px; display:block; margin:0 auto; }
  .items-editor .it-img span { font-size:18px; line-height:1; }
  .items-editor .it-amt { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .items-editor .it-del { border:0; background:transparent; color:var(--danger-text,#b91c1c); cursor:pointer; font-size:15px; padding:2px 5px; }
  .items-foot { display:flex; justify-content:flex-end; gap:6px; align-items:baseline; font-size:13px; margin-top:8px; }
  .items-foot b { font-size:15px; font-variant-numeric:tabular-nums; }
  /* 纸面商品图：屏幕预览按 18mm，打印在 paper.js 里再强制一次 */
  .paper td.imgcell { text-align:center; vertical-align:middle; padding:4px; }
  .paper .item-img { width:18mm; height:18mm; object-fit:contain; display:block; margin:0 auto; background:var(--bg-inset); border-radius:3px; padding:2px; }
  .paper .item-img-ph { display:flex; width:18mm; height:18mm; align-items:center; justify-content:center; margin:0 auto; background:var(--bg-inset); border-radius:3px; font-size:15px; }
  .paper .item-sub { font-size:10.5px; color:var(--text-3); margin-top:2px; line-height:1.35; }
  .paper tr { break-inside:avoid; page-break-inside:avoid; }
  .paper thead { display:table-header-group; }
  @media print {
    .paper .item-img, .paper .item-img-ph { background:none !important; border-radius:0 !important; padding:0 !important; }
  }
  #gateBox { margin-top:var(--sp-2); }
  /* ---- 品牌：纸面顶部 / 签章（.br-stamps 是 .sig 的绝对子元素，不参与 flex，不撑高度） ---- */
  .br-top { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .br-top-logo { max-height:46px; max-width:180px; object-fit:contain; }
  .br-top-name { font-size:13px; font-weight:600; color:var(--text-2); letter-spacing:.04em; }
  .br-stamps { position:absolute; left:0; bottom:0; width:260px; height:100px; margin:0; padding:0; pointer-events:none; z-index:2; }
  .br-stamp { position:absolute; object-fit:contain; }
  .br-stamp-sign { left:36px; bottom:18px; max-height:54px; max-width:150px; transform:rotate(-6deg); }
  .br-stamp-seal { left:120px; bottom:6px; width:88px; height:88px; transform:rotate(-10deg); opacity:.9; }
  .br-top-in-paper { border-bottom:1px dashed var(--border-strong); padding-bottom:6px; }
  /* ---- 品牌资料弹窗 ---- */
  dialog.br-dlg { border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow-pop); padding:0; max-width:640px; width:94%; }
  dialog.br-dlg::backdrop { background:rgba(31,41,51,.45); }
  .br-h { background:var(--brand-900); color:#fff; padding:var(--sp-4); display:flex; justify-content:space-between; gap:var(--sp-3); }
  .br-h h3 { margin:0 0 4px; font-size:16px; }
  .br-h p { margin:0; font-size:12px; opacity:.75; line-height:1.5; }
  .br-h .iconbtn { background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.3); border-radius:var(--r-sm); padding:4px 10px; cursor:pointer; height:fit-content; }
  .br-b { padding:var(--sp-4); max-height:64vh; overflow:auto; }
  .br-shots { display:grid; grid-template-columns:1fr 1fr 1fr; gap:var(--sp-3); margin-bottom:var(--sp-4); }
  .br-slot { display:flex; flex-direction:column; gap:6px; }
  .br-view { height:96px; border:1.5px dashed var(--border-strong); border-radius:var(--r-sm); background:var(--bg-inset); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .br-view img { max-width:92%; max-height:88px; object-fit:contain; }
  .br-view span { font-size:12px; color:var(--text-3); }
  .br-pick { padding:7px 0; border:1px solid var(--border-field); border-radius:var(--r-sm); background:var(--bg-card); cursor:pointer; font-size:13px; }
  .br-pick:hover { border-color:var(--brand-700); color:var(--brand-700); }
  .br-hint { font-size:11px; color:var(--text-3); line-height:1.45; }
  .br-name { font-size:11px; color:var(--ok-text); }
  .br-two { display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-3); }
  .br-dr { margin-bottom:var(--sp-3); }
  .br-dr label { display:block; font-size:12px; color:var(--text-2); margin-bottom:4px; }
  .br-dr input, .br-dr textarea { width:100%; box-sizing:border-box; padding:8px 10px; border:1px solid var(--border-field); border-radius:var(--r-sm); font-size:14px; font-family:var(--font-sans); }
  .br-dr input:focus, .br-dr textarea:focus { border-color:var(--brand-600, var(--brand-700)); }
  .br-f { display:flex; gap:var(--sp-3); justify-content:flex-end; padding:0 var(--sp-4) var(--sp-4); }
  @media print {
    body * { visibility:hidden; }
    .paper, .paper * { visibility:visible; }
  }
  .print-hint { font-size:11.5px; color:var(--text-3); line-height:1.55; margin-top:6px; }
  dialog { border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow-pop); padding:0; max-width:560px; width:92%; }
  dialog::backdrop { background:rgba(31,41,51,.4); }
  .dlg-h { background:var(--bg-inset); padding:var(--sp-3) var(--sp-4); font-weight:600; display:flex; justify-content:space-between; }
  .dlg-b { padding:var(--sp-4); }
  .dlg-b label { display:block; font-size:13px; color:var(--text-2); margin:var(--sp-3) 0 var(--sp-1); }
  .dlg-b select, .dlg-b textarea { width:100%; box-sizing:border-box; padding:8px 10px; border:1px solid var(--border-field); border-radius:var(--r-sm); font-size:14px; font-family:var(--font-sans); }
</style>

<body>
<header>
  <img src="../assets/logo.svg" alt="">
  <h1>单证中心 <span style="font-size:12px;opacity:.7;font-weight:400">20 张出口单证 · 共享字段一次填写全单联动 · AI 单单一致校验</span></h1>
  <button onclick="openBrand()">🏷 品牌资料</button>
  <button onclick="dlgSettings.showModal()">⚙ AI 设置</button>
</header>
<main>
  <div class="left">
    <div class="ft-card doclist" id="doclist"></div>
    <div class="ft-card chain" id="chainBar"></div>
    <div class="ft-card form">
      <h3 id="formTitle">选择一张单证</h3>
      <div id="quoteHint" class="quote-hint" style="display:none"></div>
      <div class="fgrid" id="formFields"></div>
      <div class="btnrow">
        <button class="ft-btn-primary" onclick="printPaper()">🖨 打印 / 存 PDF</button>
        <button class="iconbtn" onclick="saveDoc()">💾 保存到单证夹</button>
        <button class="iconbtn" onclick="dlgSaved.showModal()">📂 单证夹</button>
        <button class="iconbtn" onclick="importLead()">👤 从线索带入</button>
        <button class="iconbtn" onclick="openPicker()" title="从商品库填入品名/数量/单价/HS">📦 商品库</button>
        <button class="iconbtn" onclick="applyBrand()" title="用品牌资料填充卖方/地址/银行/币种">🏷 带入品牌</button>
        <button class="iconbtn" onclick="exportDocXls()" title="导出客户版 Excel">⬇ Excel</button>
        <button class="iconbtn" onclick="clearForm()">清空</button>
      </div>
      <div class="btnrow paper-tools" id="paperTools"></div>
      <div class="print-hint">打印 / 存 PDF：在打印对话框里把「边距」设为「无」、取消勾选「页眉和页脚」；纸张方向会自动跟随上面的「竖版 / 横版 A4」。</div>
      <div class="btnrow">
        <button class="ft-btn-ai" onclick="aiCheck()">🧭 AI 单单一致校验</button>
        <button class="ft-btn-ai" onclick="aiPolish()">✨ AI 润色英文备注</button>
        <button class="iconbtn" onclick="runGate(true)" title="Formal Output Gate：必填校验 + Issue Navigator">🔎 输出校验</button>
      </div>
      <div id="gateBox"></div>
      <div class="ft-ai-output aicheck" id="aiOut" style="display:none" aria-live="polite"></div>
    </div>
  </div>
  <div class="right">
    <!-- 单证纸面始终显示；style 与报价页保持同一约定（display:block），供 .paperhint 判断 -->
    <div class="paperhint">← 左右滑动查看整页 →</div>
    <div class="paper" id="paper" style="display:block"></div>
  </div>
</main>

<!-- 单证夹 -->
<dialog role="dialog" aria-modal="true" id="dlgSaved" aria-label="单证夹">
  <div class="dlg-h"><span>单证夹（已保存单证）</span><button class="iconbtn" onclick="dlgSaved.close()" aria-label="关闭">✕</button></div>
  <div class="dlg-b" id="savedList" style="max-height:400px;overflow:auto"></div>
</dialog>

<!-- AI 润色 -->
<dialog role="dialog" aria-modal="true" id="dlgPolish" aria-label="AI 润色备注">

  <div class="dlg-b">
    <label for="polishIn">要润色的内容（中文可）</label>

    <div class="ft-ai-output" id="polishOut" style="display:none;margin-top:var(--sp-3);white-space:pre-wrap;font-size:14px;line-height:1.7" aria-live="polite"></div>
  </div>

<!-- 从线索带入 -->
<dialog role="dialog" aria-modal="true" id="dlgImport" aria-label="从线索带入客户信息">
  <div class="dlg-h"><span>从线索带入客户信息</span><button class="iconbtn" onclick="dlgImport.close()" aria-label="关闭">✕</button></div>
  <div class="dlg-b">
    <label for="impLead">选择线索（自动带入买方名/地址/产品，AI 评分高的排前面）</label>
    <select id="impLead"></select>
    <div style="margin-top:var(--sp-3);text-align:right">
      <button class="ft-btn-primary" onclick="doImport()">带入</button>

<dialog role="dialog" aria-modal="true" id="dlgSettings" aria-label="AI 设置">

<!-- 从商品库选 -->
<dialog role="dialog" aria-modal="true" id="dlgPicker" aria-label="从商品库带入">
  <div class="dlg-h"><span>📦 从商品库带入</span><button class="iconbtn" onclick="dlgPicker.close()" aria-label="关闭">✕</button></div>

<script>
'use strict';
/* ============================================================
   FT Compass 单证中心 v0.1（矩阵 #6 模块）
   共享字段联动 + 通用单证渲染 + AI 校验/润色（结果落 doc.aiCheck）
   ============================================================ */
var current = DOCS_DEF[2]; // 默认 PI
var values = {};           // 字段值（共享+专有）
var editingSavedId = null;
var currentLeadId = '';   // 当前单证来源线索（保存时落库，客户 360 用它精确匹配）
var currentLeadName = ''; // 线索删除后仍保留客户名，单证夹里可读
var currentQuoteId = '';  // 从报价转来的 PI：记住报价 id，重复转单时不再建第二张
var currentQuoteNo = '';  // 报价单号，单证夹/表单里可读

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
/* 统一走 assets/a11y.js 的右下角提示条，避免同一句提示出现在多个位置 */
function toast(msg){ if (window.FT && FT.toast) FT.toast(msg); }
function fill(k){ // 占位符替换，未填字段显示浅色占位
  var v = values[k];
  return v ? esc(v) : '<span style="color:#c5bfae">____</span>';
}
function rep(t){ return t.replace(/\{\{(\w+)\}\}/g, function(m,k){ return fill(k); }); }

/* ---------- 多 SKU 明细：配置 / 默认开关 ---------- */
var ITEM_SHARED_KEYS = { product:1, qty:1, unit:1, price:1, total:1 };
function cfgDocImages(){
  try { return (DataStore.getCfg() || {}).docImagesDefault || 'auto'; }
  catch (e) { return 'auto'; }
}
function showImagesOn(){

}
function itemProducts(){

/* ---------- 左侧：单证选择（feature 8：短标题走词典） ---------- */
function renderList(){
  var cats = []; DOCS_DEF.forEach(function(d){ if(cats.indexOf(d.cat)<0) cats.push(d.cat); });
  var html = '';
  cats.forEach(function(c){
    html += '<div class="catlbl">'+esc(c)+'</div>';
    html += DOCS_DEF.filter(function(d){ return d.cat===c; }).map(function(d){
      return '<span class="docchip'+(d.id===current.id?' on':'')+'" onclick="pick(\''+d.id+'\')">'+esc(String(d.title||'').split(' / ')[0])+'</span>';
    }).join('');
  });
  $('doclist').innerHTML = html;
}
function pick(id){
  var same = current && current.id === id;
  current = DOCS_DEF.find(function(d){ return d.id===id; }) || current;
  if (!same){
    /* 切换单证类型时：同一客户已存过这个类型，就直接打开那张，
       否则用当前共享字段新建一张。避免「切走再切回来保存」生成重复单证。 */
    var saved = findSavedForCurrentCustomer(id);
    if (saved){
      editingSavedId = saved.id;
      values = saved.values || {};
      currentLeadId = saved.leadId || currentLeadId;
      currentLeadName = saved.leadName || (saved.values && saved.values.buyer) || currentLeadName;
      currentQuoteId = saved.quoteId || '';
      currentQuoteNo = saved.quoteNo || '';
    } else {
      editingSavedId = null;
      /* 换单证类型后没有对应已存单：PI 之外不再沿用报价关联，避免把 CI/PL 也标成同一张报价 */
      if (id !== 'pi') { currentQuoteId = ''; currentQuoteNo = ''; }
    }
  }
  $('aiOut').style.display='none'; gateRan=false;
  renderList(); renderChain(); renderForm(); renderPaper(); refreshGate();
}
/* 同一客户（优先 leadId，其次买方名）已经存过的同类单证 */
function findSavedForCurrentCustomer(docId){
  var wantLead = currentLeadId || '';
  var wantBuyer = String(values.buyer || '').trim().toLowerCase();
  var hits = DataStore.list('docs').filter(function(d){
    if (d.docId !== docId) return false;
    if (wantLead){
      if (d.leadId === wantLead) return true;
      if (d.leadId) return false;
    }
    var b = String((d.values && d.values.buyer) || '').trim().toLowerCase();
    return !!wantBuyer && b === wantBuyer;
  });
  if (!hits.length) return null;
  hits.sort(function(a, b){
    return String(b.updatedAt || b.createdAt || '').localeCompare(String(a.updatedAt || a.createdAt || ''));
  });
  return hits[0];
}

/* ---------- 单据链：面包屑 + 链式派生 ---------- */
function renderChain(){
  var idx = DOC_CHAIN.indexOf(current.id);
  var html = DOC_CHAIN.map(function(id, i){
    var lab = CHAIN_LABEL[id] || id;
    var cls = 'chain-step' + (id === current.id ? ' on' : (idx >= 0 && i < idx ? ' done' : ''));
    var arrow = i < DOC_CHAIN.length - 1 ? '<span class="chain-arrow">→</span>' : '';
    return '<span class="'+cls+'" onclick="pick(\''+id+'\')" title="切换到 '+esc(lab)+'">'+esc(lab)+'</span>' + arrow;
  }).join('');
  var nextId = idx >= 0 && idx < DOC_CHAIN.length - 1 ? DOC_CHAIN[idx + 1] : null;
  html += nextId
    ? '<button class="chain-derive" onclick="deriveNext()" title="继承本单共享字段，生成 '+esc(CHAIN_LABEL[nextId]||nextId)+'">⛓ 派生下一单：'+esc(CHAIN_LABEL[nextId]||nextId)+' →</button>'
    : '<span style="margin-left:auto;font-size:11.5px;color:var(--text-3)">'+(idx === DOC_CHAIN.length-1 ? '✓ 主链末端' : '非主链单证')+'</span>';
  $('chainBar').innerHTML = html;
}

function todayStr(){ return FT.today(); }

function genNo(docId){
  var pfx = DOC_NO_PREFIX[docId] || 'DOC';
  var ds = todayStr().replace(/-/g,'');
  var all = DataStore.list('docs').map(function(d){ return String((d.values||{}).no || ''); });
  if (values.no && String(values.no).indexOf(pfx + '-' + ds) === 0) all.push(String(values.no));
  var n = 1;
  var no = pfx + '-' + ds + '-' + String(n).padStart(3, '0');
  while (all.indexOf(no) >= 0){ n++; no = pfx + '-' + ds + '-' + String(n).padStart(3, '0'); }
  return no;
}

/* 链式派生：共享字段继承 → 按目标策略 clear/preset → 血缘 derivedFrom */
function deriveNext(){
  var idx = DOC_CHAIN.indexOf(current.id);
  if (idx < 0 || idx >= DOC_CHAIN.length - 1){ toast('当前单证不在主链上或已是末端'); return; }
  var nextId = DOC_CHAIN[idx + 1];
  var nextDef = DOCS_DEF.find(function(d){ return d.id === nextId; });
  if (!nextDef) return;

  if (current.items) syncItemsToValues(); // 先把明细收进 values 再派生

  // 源单关键字段缺失时提醒（不阻断）
  var miss = ['buyer','product','total'].filter(function(k){ return !values[k]; });

  // 1) 记录血缘（基于当前值）
  var lineage = {
    fromDocId: current.id,
    fromTitle: current.title,
    fromNo: values.no || '',
    fromSavedId: editingSavedId,
    at: new Date().toISOString()
  };

  // 2) 继承：共享字段全保留（no/date 重开），删掉策略要求 clear 的专有字段
  var next = {};
  Object.keys(values).forEach(function(k){ next[k] = values[k]; });
  var policy = CHAIN_DERIVE[nextId] || { clearKeys: [], presets: {} };
  (policy.clearKeys || []).forEach(function(k){ delete next[k]; });

  // 3) 新单号 + 新日期 + 派生备注
  next.no = genNo(nextId);
  next.date = todayStr();
  next.derivedFrom = lineage;
  /* 图片开关是新单自己的默认值：PI 开、CI/PL 关，不跟着源单硬继承 */
  if (nextDef.items) next.showImages = DocItems.defaultShowImages(nextId, cfgDocImages());

  // 4) 目标字段空则用 preset（不覆盖 CONFIDENTIAL 内部字段）
  var presets = policy.presets || {};
  Object.keys(presets).forEach(function(k){
    if (!Confidential.is(k) && !next[k]) next[k] = presets[k];
  });

  // 5) 若当前源单已保存，确保血缘可回溯（保存源单最新值）
  if (editingSavedId){
    DataStore.update('docs', editingSavedId, {
      docId: current.id, docTitle: current.title, values: values,
      leadId: currentLeadId || '', leadName: currentLeadName || values.buyer || ''
    });
  }

  // 6) 切换到目标单
  values = next;
  current = nextDef;
  editingSavedId = null;
  gateRan = false;
  $('aiOut').style.display = 'none';
  renderList(); renderChain(); renderForm(); renderPaper(); refreshGate();

  var msg = '⛓ 已派生：' + (lineage.fromTitle.split(' / ')[0]) + (lineage.fromNo ? ' No.'+lineage.fromNo : '')
    + ' → ' + String((nextDef.title||'')).split(' / ')[0] + ' No.' + next.no;
  if (miss.length) msg += '（源单缺：' + miss.join('/') + '，请补全）';
  toast(msg);
}

/* 单证夹：从已保存单据直接派生下一单 */
function deriveFromSaved(id){
  var d = DataStore.get('docs', id);
  if (!d) return;
  dlgSaved.close();
  // 载入源单
  editingSavedId = id;
  values = d.values || {};
  currentLeadId = d.leadId || '';
  currentLeadName = d.leadName || (d.values && d.values.buyer) || '';
  current = DOCS_DEF.find(function(x){ return x.id === d.docId; }) || current;
  currentQuoteId = d.quoteId || '';
  currentQuoteNo = d.quoteNo || '';
  gateRan = false;
  renderList(); renderChain(); renderForm(); renderPaper(); refreshGate();
  // 立即派生
  deriveNext();
}

/* ---------- 表单：共享字段 + 专有字段 + CONFIDENTIAL 内部区 ---------- */
function fieldInput(f){
  var ph = f.ph ? ' placeholder="'+esc(f.ph)+'"' : '';

function renderForm(){
  $('formTitle').textContent = String(current.title||'').split(' / ')[0];
  var all = SHARED_FIELDS.concat((current.rows||[]).map(function(r){ return {k:r[0], label:r[1], ph:r[2]}; }))

/* ---------- 多 SKU 明细：编辑区 ---------- */
function itemsEditorHTML(){
  var rows = DocItems.fromValues(values, { keepBlank: true });
  if (!rows.length) rows = [DocItems.normalizeRow({})];

      + '<td><input class="it-spec" value="'+esc(r.spec)+'" placeholder="Spec" aria-label="规格"></td>'
      + '<td><input class="it-qty num" type="number" min="0" step="any" value="'+esc(r.qty)+'" oninput="onItemInput(this)" aria-label="数量"></td>'
      + '<td><input class="it-unit" value="'+esc(r.unit || 'pcs')+'" oninput="onItemInput(this)" aria-label="单位"></td>'

    + '<span class="items-hint">图片按商品库实时关联，不复制进单据</span>'

function readItemRows(){
  var out = [], tbody = document.querySelector('#itemsBlock tbody');
  if (!tbody) return out;
  Array.prototype.forEach.call(tbody.querySelectorAll('tr'), function(tr){
    out.push({
      productId: tr.getAttribute('data-pid') || '',
      name: tr.querySelector('.it-name').value,
      sku: tr.querySelector('.it-sku').value,
      spec: tr.querySelector('.it-spec').value,
      qty: tr.querySelector('.it-qty').value,
      unit: tr.querySelector('.it-unit').value,
      price: tr.querySelector('.it-price').value
    });
  });
  return out;
}
function syncItemsToValues(opts){
  if (!current.items || !document.getElementById('itemsBlock')) return false;
  DocItems.sync(values, readItemRows(), opts);
  return true;
}
function refreshItemTotals(){
  var tbody = document.querySelector('#itemsBlock tbody');
  if (!tbody) return;
  var rows = [];
  Array.prototype.forEach.call(tbody.querySelectorAll('tr'), function(tr){
    var q = parseFloat(tr.querySelector('.it-qty').value) || 0;
    var p = parseFloat(tr.querySelector('.it-price').value) || 0;
    tr.querySelector('.it-amt').textContent = DocItems.money(q * p);
    rows.push({ qty: q, price: p });
  });
  var totalEl = document.getElementById('itemsTotal');
  if (totalEl) totalEl.textContent = (values.currency || 'USD') + ' ' + DocItems.money(DocItems.sum(rows));
}
function onItemInput(){
  syncItemsToValues({ keepBlank: true });
  refreshItemTotals();
  renderPaper();
  if (gateRan) refreshGate();
  scheduleSave();
}
function addBlankItem(){
  syncItemsToValues({ keepBlank: true });
  var rows = DocItems.fromValues(values, { keepBlank: true });
  rows.push(DocItems.normalizeRow({}));
  DocItems.sync(values, rows, { keepBlank: true });
  renderForm(); renderPaper(); refreshGate(); scheduleSave();
}
function removeItemRow(btn){
  var tr = btn.closest('tr');
  var rows = readItemRows();
  var idx = Array.prototype.indexOf.call(tr.parentNode.children, tr);
  if (rows.length <= 1) rows = [{}];
  else rows.splice(idx, 1);
  DocItems.sync(values, rows, { keepBlank: true });
  renderForm(); renderPaper(); refreshGate(); scheduleSave();
}
function toggleShowImages(on){
  values.showImages = !!on;
  renderPaper();
  scheduleSave();
}
function scheduleSave(){
  if (!editingSavedId) return;
  clearTimeout(window._sv);
  window._sv = setTimeout(saveDoc, 800);
}
function renderQuoteHint(){
  var el = $('quoteHint'); if (!el) return;
  if (!currentQuoteId || current.id !== 'pi'){ el.style.display='none'; el.innerHTML=''; return; }
  el.style.display = 'block';
  el.innerHTML = '💰 来自报价 <b>' + esc(currentQuoteNo || currentQuoteId) + '</b>'
    + ' · 客户 / 产品 / 金额已带入，核对后点「保存到单证夹」即可';
}
function onVal(input){
  values[input.dataset.k] = input.value;
  if (current.items && input.dataset.k === 'currency'){
    var totalEl = document.getElementById('itemsTotal');
    if (totalEl) totalEl.textContent = (input.value || 'USD') + ' ' + DocItems.money(DocItems.sum(DocItems.fromValues(values)));
  }
  renderPaper(); // 实时联动预览
  if (gateRan) refreshGate();
  // 已保存单证的编辑态：防抖保存
  scheduleSave();
}

/* ---------- 右侧：通用单证渲染（客户版：Confidential.strip + i18n 标签） ---------- */
/* ---------- 纸面货物明细：单行兼容 + 多 SKU 循环 ---------- */
function paperRowsHTML(d){
  if (d.table === false) return '';
  var qtyHead = '<th scope="col">'+esc(I18N.t('t.qty'))+'</th><th scope="col">'+esc(I18N.t('t.unitPrice'))+'</th><th scope="col">'+esc(I18N.t('t.amount'))+'</th>';

  if (!d.items){
    return '<table aria-label="货物明细"><thead><tr><th scope="col" style="width:50%">'+esc(I18N.t('t.desc'))+'</th>'+qtyHead+'</tr></thead>'
      + '<tbody><tr><td>'+fill('product')+'</td><td>'+fill('qty')+' '+fill('unit')+'</td><td>'+fill('currency')+' '+fill('price')+'</td><td>'+fill('currency')+' '+fill('total')+'</td></tr></tbody></table>';
  }
  var rows = DocItems.fromValues(values);
  if (!rows.length) rows = [DocItems.normalizeRow({})];
  var prods = itemProducts();
  var imgs = rows.map(function(r){ return DocItems.imageFor(r, prods, FT.imgSrc); });
  var showImg = showImagesOn() && imgs.some(Boolean);
  var cur = values.currency || 'USD';

    ? '<colgroup><col style="width:16%"><col style="width:34%"><col style="width:14%"><col style="width:18%"><col style="width:18%"></colgroup>'
    : '<colgroup><col style="width:50%"><col style="width:16%"><col style="width:17%"><col style="width:17%"></colgroup>';
  var head = '<thead><tr>' + (showImg ? '<th scope="col" class="imgcol" aria-label="Product image"></th>' : '')
    + '<th scope="col">'+esc(I18N.t('t.desc'))+'</th>' + qtyHead + '</tr></thead>';
  var body = rows.map(function(r, i){
    var name = String(r.name || '').trim();
    var sub = [r.spec, r.sku].filter(function(x){ return String(x || '').trim(); }).map(esc).join(' · ');
    var desc = (name ? esc(name) : '<span style="color:#c5bfae">____</span>')
      + (sub ? '<div class="item-sub">'+sub+'</div>' : '');
    var qty = (r.qty === '' ? '____' : esc(String(DocItems.money(r.qty)).replace(/\.00$/, '')))
      + ' ' + (String(r.unit || '').trim() ? esc(r.unit) : '____');
    var price = (r.price === '' ? '____' : esc(DocItems.money(r.price)));
    var amount = esc(DocItems.money(r.amount));
    var imgCell = showImg
      ? '<td class="imgcell">'+(imgs[i] ? '<img class="item-img" src="'+esc(imgs[i])+'" alt="">' : '<span class="item-img-ph" aria-hidden="true">📦</span>')+'</td>'

    return '<tr>'+imgCell+'<td>'+desc+'</td><td>'+qty+'</td><td>'+esc(cur)+' '+price+'</td><td>'+esc(cur)+' '+amount+'</td></tr>';
  }).join('');

    ? '<tfoot><tr><td colspan="'+(showImg ? 4 : 3)+'" style="text-align:right;font-weight:600">'+esc(I18N.t('q.total'))+'</td>'
      + '<td style="font-weight:600">'+esc(cur)+' '+esc(DocItems.money(total))+'</td></tr></tfoot>'
    : '';
  return '<table aria-label="货物明细">'+colgroup+head+'<tbody>'+body+'</tbody>'+foot+'</table>';
}

      if (!String(rows[i].name || '').trim() && !String(rows[i].productId || '').trim()){ target = i; break; }

/* ---------- AI 1：单单一致校验（先过 Gate，再走 AI；矩阵落点 doc.aiCheck） ---------- */
async function aiCheck(){
  var issues = currentIssues();
  var out = $('aiOut'); out.style.display='block';
  if (Gate.errorsOf(issues).length){
    gateRan = true; refreshGate();
    out.innerHTML = '⚠️ 先过输出校验：'+Gate.errorsOf(issues).map(function(i){return i.msg;}).join('；');
    return;
  }
  out.innerHTML = '⏳ AI 校验中…';
  try {
    var pub = Confidential.strip(values);
    var txt = await AgnesAI.chat([
      {role:'system', content:'你是外贸单证审核员。输出 JSON：{"ok":true/false,"issues":["问题1"],"suggestion":"一句话建议"}。只查逻辑一致性，不挑措辞。'},
      {role:'user', content:'请校验这张「'+I18N.docTitle(current)+'」的单据字段逻辑（金额=数量×单价、币种一致、港口一致、日期先后、付款条款完整性等）：\n'+JSON.stringify(pub)}
    ], {json:true, temperature:0.2, maxTokens:500});
    var res = JSON.parse(txt);
    out.innerHTML = (res.ok?'✅ 校验通过':'⚠️ 发现问题')
      + (res.issues&&res.issues.length?'<br>· '+res.issues.map(esc).join('<br>· '):'')
      + (res.suggestion?'<br><b>建议：</b>'+esc(res.suggestion):'');
    // 落库（aiCheck 本身是 CONFIDENTIAL，不进客户版）
    if (editingSavedId) DataStore.saveAIResult('docs', editingSavedId, { aiCheck:{ok:res.ok, issues:res.issues, at:new Date().toISOString()} });
  } catch(e){ out.innerHTML = '校验失败：'+esc(e.message); }
}

/* ---------- 打印（Gate 拦截；CSS @media print 只出 A4 预览区） ---------- */
var printing = false;
function printPaper(){
  if (current.items) syncItemsToValues();
  if (!runGate(false)) return;
  if (printing) return;
  printing = true;
  /* 图片解码是异步的：直接 window.print() 会偶发印出空白图。
     最多等 1.5 秒，坏图不阻塞打印。 */
  var decoded = Promise.all(Array.prototype.slice.call(document.images).map(function(img){
    return img.decode ? img.decode().catch(function(){}) : Promise.resolve();
  }));
  var timeout = new Promise(function(resolve){ setTimeout(resolve, 1500); });
  Promise.race([decoded, timeout]).then(function(){
    window.print();
  }).catch(function(){
    window.print();
  }).then(function(){
    setTimeout(function(){ printing = false; }, 500);
  });
}

function doImport(){
  var l = DataStore.get('leads', $('impLead').value);
  if (!l){ dlgImport.close(); return; }
  /* leadId 与买方名必须指向同一个人：换客户时先确认，避免单证串到别的线索 */
  var buyerChanged = !!(values.buyer && l.name && values.buyer !== l.name);
  if (buyerChanged){
    if (!confirm('当前买方是「'+values.buyer+'」，要替换为「'+l.name+'」吗？')) return;
  }
  /* 换客户后另存新单，否则会把上一位客户的已存单证覆盖掉 */
  if (editingSavedId && (buyerChanged || (currentLeadId && currentLeadId !== l.id))){
    editingSavedId = null;
  }
  /* 手动换成别的线索：解除原报价关联，避免这张单证被当成该报价的 PI */
  if (currentLeadId && currentLeadId !== l.id){ currentQuoteId = ''; currentQuoteNo = ''; }
  values.buyer = l.name || values.buyer;
  values.buyerAddr = values.buyerAddr || (l.addr || l.country || '');
  values.product = values.product || l.product || '';
  currentLeadId = l.id;
  currentLeadName = l.name || '';

  /* 俄语演示线索：补齐一套可直接导出的示例数据，并把单据语言切到俄语 */
  var demoRu = l.demo === 'ru';
  if (demoRu) {
    var preset = {
      qty:'6000', unit:'шт.', price:'3.10', currency:'USD', total:'18600.00',
      payment:'30% предоплата, 70% до отгрузки',
      delivery:'25 дней после предоплаты',
      portFrom:'Нинбо', portTo:'Санкт-Петербург',
      valid:'30 дней', hsCode:'6307.90',
      ctns:'300', gw:'1200', nw:'1000', meas:'12.5', mark:'N/M'
    };
    Object.keys(preset).forEach(function(k){ if (!values[k]) values[k] = preset[k]; });

/* ---------- 报价 → PI：?quote=<id> ---------- */
function fmt2(n){ return (Number(n) || 0).toFixed(2); }

function latestDoc(list){
  return list.slice().sort(function(a, b){
    return String(b.updatedAt || b.createdAt || '').localeCompare(String(a.updatedAt || a.createdAt || ''));
  })[0] || null;
}

/** 打开某张报价对应的 PI：已有就打开原单，没有才按报价预填。
 *  用 quoteId 去重，避免同一张报价被转出多张 PI。 */
function openFromQuote(qid){
  var q = DataStore.get('quotes', qid);
  if (!q){ toast('未找到这张报价（可能已删除）'); return; }

  var existed = latestDoc(DataStore.list('docs').filter(function(d){
    return d.docId === 'pi' && d.quoteId === qid;
  }));
  if (existed){
    loadSaved(existed.id);
    toast('该报价已生成 PI No.' + ((existed.values||{}).no || '') + '，已打开原单');
    return;
  }

  var lead = q.leadId ? DataStore.get('leads', q.leadId) : null;
  var rawItems = Array.isArray(q.items) ? q.items : [];
  var rows = DocItems.fromQuoteItems(rawItems, itemProducts());

  var pi = DOCS_DEF.find(function(d){ return d.id === 'pi'; });
  if (pi) current = pi;

  values = {};
  var no = genNo('pi');
  values.no = no;
  values.date = todayStr();
  values.buyer = q.leadName || (lead && lead.name) || '';
  values.buyerAddr = (lead && (lead.addr || lead.country)) || '';
  values.currency = q.currency || 'USD';
  values.payment = q.payment || '';
  values.portFrom = q.portFrom || '';
  values.portTo = q.portTo || '';
  values.delivery = q.delivery || '';
  values.valid = q.validUntil || q.validity || '';
  values.remark = q.note || '';
  if (rows.length){
    DocItems.sync(values, rows); // 全部明细带入，首行回写兼容字段
    if (values.price) values.price = fmt2(values.price); // 兼容旧回归：单价固定两位
  } else {
    values.product = q.product || '';
    values.total = q.total ? fmt2(q.total) : '';
  }
  if (!values.total && q.total) values.total = fmt2(q.total);
  values.showImages = DocItems.defaultShowImages('pi', cfgDocImages());

  var note = '由报价 ' + (q.no || qid) + ' 生成';
  if (rows.length > 1){
    note += '；已带入 ' + rows.length + ' 项明细';
  } else if (!rows.length){
    note += '；报价没有明细，请手工补产品 / 数量 / 单价';
  }
  values.internalNote = note;

  currentLeadId = q.leadId || '';
  currentLeadName = q.leadName || (lead && lead.name) || '';
  currentQuoteId = qid;
  currentQuoteNo = q.no || '';
  editingSavedId = null;
  gateRan = false;
  $('aiOut').style.display = 'none';
  renderList(); renderChain(); renderForm(); renderPaper(); refreshGate();
  toast('已从报价 ' + (q.no || '') + ' 带入 PI 草稿'
    + (rows.length > 1 ? '；已带入 ' + rows.length + ' 项明细' : ''));
}

  toast('已恢复上次未保存的单证草稿');
  return true;
}
