<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FT Compass · 客户 360°</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
<link rel="stylesheet" href="../assets/tokens.css?v=3">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--bg-page); color:var(--text-1); }
  header { background:var(--brand-900); color:#fff; padding:var(--sp-4) var(--sp-6); display:flex; align-items:center; gap:var(--sp-3); }
  header img { width:34px; height:34px; }
  header h1 { font-size:18px; margin:0; flex:1; }
  main { max-width:1100px; margin:0 auto; padding:var(--sp-4) var(--sp-6) 80px; display:flex; gap:var(--sp-4); align-items:flex-start; }
  /* 左：客户列表 */
  .left { width:300px; flex-shrink:0; }
  .left .ft-card { padding:var(--sp-3); }
  .search-box { width:100%; box-sizing:border-box; padding:8px 12px; border:1px solid var(--border-field); border-radius:var(--r-sm); font-size:13px; margin-bottom:var(--sp-3); }
  .clist { max-height:calc(100vh - 220px); overflow:auto; }
  .citem { padding:10px 12px; border-radius:var(--r-sm); cursor:pointer; margin-bottom:4px; border-left:3px solid transparent; transition:all .15s; display:flex; align-items:center; gap:10px; }
  .citem:hover { background:var(--bg-inset); }
  .citem.on { background:var(--brand-50); border-left-color:var(--brand-600); }
  .citem .avatar { width:36px; height:36px; border-radius:50%; background:var(--brand-100); color:var(--brand-700); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; flex-shrink:0; }
  .citem .ci-info { flex:1; min-width:0; }
  .citem .ci-name { font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .citem .ci-sub { font-size:12px; color:var(--text-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .citem .ci-badge { font-size:11px; padding:1px 8px; border-radius:999px; flex-shrink:0; }
  /* 右：详情 */
  .right { flex:1; min-width:0; }
  .profile-card { display:flex; gap:var(--sp-4); align-items:flex-start; padding:var(--sp-4); flex-wrap:wrap; }
  .profile-card .avatar-lg { width:64px; height:64px; border-radius:50%; background:var(--brand-100); color:var(--brand-700); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:24px; flex-shrink:0; }
  .profile-card .info { flex:1; min-width:200px; }
  .profile-card .info h2 { margin:0 0 4px; font-size:20px; }
  .profile-card .info .sub { font-size:13px; color:var(--text-2); }
  .profile-card .tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .profile-card .tag { font-size:11.5px; padding:3px 10px; border-radius:999px; }
  .tag-stage { background:var(--brand-100); color:var(--brand-700); }
  .tag-market { background:#dbeafe; color:#1d4ed8; }
  .tag-type { background:#fef3c7; color:#92400e; }
  .profile-card .quick-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .qa-btn { font-size:12.5px; padding:6px 14px; border-radius:var(--r-sm); border:0; cursor:pointer; display:flex; align-items:center; gap:4px; }
  .qa-btn.whatsapp { background:#075e54; color:#fff; }
  .qa-btn.email { background:var(--brand-700); color:#fff; }
  .qa-btn.quote { background:#b45309; color:#fff; }
  .qa-btn.todo { background:var(--bg-inset); color:var(--text-2); border:1px solid var(--border); }
  /* 统计条 */
  .stats-bar { display:flex; gap:var(--sp-6); padding:0 var(--sp-4) var(--sp-3); }
  .stat-item b { display:block; font-size:22px; font-weight:600; }
  .stat-item span { font-size:12px; color:var(--text-3); }
  /* 标签页 */
  .tabs { display:flex; border-bottom:1px solid var(--border); padding:0 var(--sp-4); gap:4px; }
  .tab { padding:10px 16px; font-size:13.5px; color:var(--text-3); cursor:pointer; border-bottom:2px solid transparent; transition:all .15s; }
  .tab:hover { color:var(--text-1); }
  .tab.on { color:var(--brand-700); border-bottom-color:var(--brand-700); font-weight:600; }
  .tab-content { padding:var(--sp-4); display:none; }
  .tab-content.on { display:block; }
  /* 时间线 */
  .timeline { position:relative; padding-left:24px; }
  .timeline::before { content:''; position:absolute; left:8px; top:0; bottom:0; width:2px; background:var(--border); }
  .tl-item { position:relative; margin-bottom:var(--sp-4); }
  .tl-item::before { content:''; position:absolute; left:-20px; top:6px; width:12px; height:12px; border-radius:50%; border:2px solid var(--brand-600); background:#fff; }
  .tl-item.done::before { background:var(--brand-600); }
  .tl-item .tl-date { font-size:12px; color:var(--text-3); }
  .tl-item .tl-title { font-size:13.5px; font-weight:500; margin:2px 0; }
  .tl-item .tl-desc { font-size:12.5px; color:var(--text-2); }
  /* 关联项 */
  .linked-item { display:flex; align-items:center; gap:var(--sp-3); padding:10px 14px; background:var(--bg-inset); border-radius:var(--r-sm); margin-bottom:6px; font-size:13px; }
  .linked-item .li-icon { font-size:16px; width:24px; text-align:center; }
  .linked-item .li-info { flex:1; }
  .linked-item .li-title { font-weight:500; }
  .linked-item .li-sub { font-size:12px; color:var(--text-3); }
  .linked-item .li-amount { font-weight:500; color:var(--brand-700); }
  .empty-tab { text-align:center; color:var(--text-3); padding:var(--sp-6) 0; font-size:13px; }
  /* 空状态：左栏没有客户 / 搜索无结果 */
  .empty-state { text-align:center; padding:var(--sp-5) var(--sp-4); }
  .empty-state .es-icon { font-size:30px; line-height:1; }
  .empty-state .es-title { font-size:14.5px; font-weight:600; margin:10px 0 6px; }
  .empty-state .es-desc { font-size:12.5px; color:var(--text-2); line-height:1.7; margin:0 0 14px; }
  .es-actions { display:flex; flex-direction:column; gap:8px; }
  .es-btn { width:100%; padding:9px 12px; border-radius:var(--r-sm); border:1px solid var(--border-field); background:var(--bg-card); color:var(--text-1); font-size:13px; font-family:var(--font-sans); cursor:pointer; }
  .es-btn.primary { background:var(--brand-700); border-color:var(--brand-700); color:#fff; font-weight:600; }
  .es-btn:hover { border-color:var(--brand-700); color:var(--brand-700); }
  .es-btn.primary:hover { background:#095c42; border-color:#095c42; color:#fff; }
  .es-link { margin-top:10px; border:0; background:none; color:var(--brand-700); font-size:12.5px; text-decoration:underline; cursor:pointer; font-family:var(--font-sans); padding:4px; }
  /* 右栏默认说明卡（无客户时不再指向空左栏） */
  .detail-empty { padding:var(--sp-7) var(--sp-6); }
  .detail-empty .de-icon { font-size:30px; line-height:1; }
  .detail-empty .de-title { font-size:15px; font-weight:600; margin:10px 0 6px; }
  .detail-empty .de-desc { font-size:13px; color:var(--text-2); line-height:1.75; margin:0 0 14px; max-width:52ch; }
  .detail-empty ul { margin:0; padding:0; list-style:none; display:grid; gap:9px; }
  .detail-empty li { font-size:13px; color:var(--text-2); line-height:1.6; display:flex; gap:8px; align-items:flex-start; }
  .detail-empty li b { color:var(--text-1); font-weight:600; }
  .note-box { background:var(--bg-inset); border-radius:var(--r-sm); padding:var(--sp-3); margin-top:var(--sp-3); }
  .note-box textarea { width:100%; box-sizing:border-box; border:0; background:transparent; font-size:13px; font-family:var(--font-sans); resize:vertical; min-height:60px; }
  .note-box .note-saved { font-size:12px; color:var(--ok-text); margin-top:4px; }
  /* 竞品 */
  .comp-item { border:1px solid var(--border); border-radius:var(--r-sm); padding:10px 12px; margin-bottom:8px; background:var(--bg-inset); }
  .comp-top { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .comp-name { font-weight:600; font-size:14px; }
  .comp-meta { font-size:11.5px; color:var(--text-3); }
  .comp-meta a { color:var(--brand-700); text-decoration:none; }
  .comp-row { font-size:12.5px; color:var(--text-2); margin-top:4px; line-height:1.55; }
  .comp-row b { color:var(--text-1); font-weight:600; }
  .comp-acts { margin-left:auto; display:flex; gap:6px; }
  .comp-acts button { padding:3px 9px; border-radius:var(--r-sm); border:1px solid var(--border); background:var(--bg-card); font-size:11.5px; cursor:pointer; }
  .comp-acts button:hover { border-color:var(--brand-700); color:var(--brand-700); }
  .comp-acts .del:hover { border-color:var(--danger); color:var(--danger-text); }
  .comp-empty { text-align:center; color:var(--text-3); padding:var(--sp-5) 0; font-size:13px; }
  dialog#dlgComp { border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow-pop); padding:0; max-width:640px; width:94%; }
  dialog#dlgComp::backdrop { background:rgba(31,41,51,.4); }
  .dlg-h { background:var(--bg-inset); padding:var(--sp-3) var(--sp-4); font-weight:600; display:flex; justify-content:space-between; align-items:center; }
  .dlg-b { padding:var(--sp-4); max-height:68vh; overflow:auto; }
  .f2 { display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-3); }
  .f2 .full { grid-column:1/-1; }
  .dlg-b label { display:block; font-size:12px; color:var(--text-2); margin-bottom:3px; }
  .dlg-b input, .dlg-b textarea { width:100%; box-sizing:border-box; padding:8px 10px; border:1px solid var(--border-field); border-radius:var(--r-sm); font-size:14px; font-family:var(--font-sans); background:var(--bg-card); }
  .dlg-b textarea { min-height:56px; resize:vertical; }
  .df { display:flex; gap:var(--sp-3); padding:0 var(--sp-4) var(--sp-4); justify-content:flex-end; }
  .df button { padding:9px 20px; border-radius:var(--r-sm); border:0; font-size:14px; font-weight:600; cursor:pointer; }
  .ds { background:var(--brand-700); color:#fff; } .dx { background:var(--bg-inset); color:var(--text-2); border:1px solid var(--border) !important; }
</style>
<script src="../assets/standalone.js"></script>

<body>
<header>
  <img src="../assets/logo.svg" alt="">
  <h1>客户 360°</h1>
</header>
<main>
  <div class="left">
    <div class="ft-card">
      <input class="search-box" id="searchC" aria-label="搜索客户" placeholder="搜索客户名/国家/产品…" oninput="renderList()">
      <div class="clist" id="clist"></div>
    </div>
  </div>
  <div class="right">
    <div id="detailArea">
      <div class="ft-card detail-empty" id="detailEmpty">
        <div class="de-icon" aria-hidden="true">📇</div>
        <div class="de-title">选择一个客户，查看完整 360° 视图</div>
        <p class="de-desc">这里把散落在各模块的信息拼到一起，不用来回翻页。左侧列表为空时，可以先去找客户，或录入手上的线索。</p>
        <ul>
          <li>🕒 <span><b>跟进时间线</b>：谁在什么时候联系过，报价走到哪一步</span></li>
          <li>📄 <span><b>关联单据</b>：报价、单证、邮件与待办，一处看全</span></li>
          <li>🧠 <span><b>AI 摘要</b>：给这个客户的下一步建议</span></li>
        </ul>
      </div>
    </div>
  </div>
</main>

<dialog role="dialog" aria-modal="true" id="dlgComp" aria-labelledby="ce_title">
  <div class="dlg-h"><span id="ce_title">添加竞品</span><button class="iconbtn" onclick="dlgComp.close()" aria-label="关闭">✕</button></div>
  <div class="dlg-b">
    <div class="f2">
      <div class="full"><label for="ce_name">竞品公司 / 品牌 *</label><input id="ce_name" placeholder="客户可能选择的对手"></div>
      <div><label for="ce_country">国家 / 市场</label><input id="ce_country"></div>
      <div><label for="ce_website">官网</label><input id="ce_website" placeholder="https://example.com"></div>
      <div class="full"><label for="ce_product">对标产品 / 品类</label><input id="ce_product"></div>
      <div><label for="ce_price">价格 / 报价</label><input id="ce_price"></div>
      <div><label for="ce_moq">MOQ</label><input id="ce_moq"></div>
      <div class="full"><label for="ce_advantage">对方优势</label><textarea id="ce_advantage" rows="2"></textarea></div>
      <div class="full"><label for="ce_threat">对我们的威胁 / 应对</label><textarea id="ce_threat" rows="2"></textarea></div>
      <div class="full"><label for="ce_note">备注</label><textarea id="ce_note" rows="2"></textarea></div>
    </div>
  </div>
  <div class="df"><button class="dx" onclick="dlgComp.close()">取消</button><button class="ds" onclick="saveComp()">保存竞品</button></div>
</dialog>

<script src="../js/datastore.js"></script>
<script src="../agnes-ai.js?v=8"></script>
<script>
'use strict';

var S = { lead: null };
var compEditingId = null;

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function safeUrl(u) {
  u = String(u || '').trim();
  if (!u) return '';
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try { return new URL(u).href; } catch (e) { return ''; }
}

function renderList() {
  var q = $('searchC').value.toLowerCase();
  var all = DataStore.list('leads');
  var leads = all.filter(function(l) {
    if (!q) return true;
    return (l.name||'').toLowerCase().includes(q) || (l.country||'').toLowerCase().includes(q) || (l.product||'').toLowerCase().includes(q);
  }).reverse();

  var box = $('clist');
  if (!leads.length) {
    box.innerHTML = all.length
      ? '<div class="empty-state">'
        + '<div class="es-title">没有匹配的客户</div>'
        + '<div class="es-desc">换个关键词，或清空搜索看全部客户。</div>'
        + '<button type="button" class="es-btn" onclick="clearSearch()">清空搜索</button>'
        + '</div>'
      : '<div class="empty-state">'
        + '<div class="es-icon" aria-hidden="true">🧭</div>'
        + '<div class="es-title">还没有客户</div>'
        + '<div class="es-desc">客户 360° 会自动汇总线索、报价、单证和待办。先去找一批客户，或录入手上的线索；想先看效果也可以载入示例。</div>'
        + '<div class="es-actions">'
        + '<button type="button" class="es-btn primary" onclick="FT.go(\'modules/find.html\')">🔍 去找客户</button>'
        + '<button type="button" class="es-btn" onclick="FT.go(\'modules/leads.html\')">＋ 录入线索</button>'
        + '</div>'
        + '<button type="button" class="es-link" onclick="loadDemoLeads()">载入 2 条示例</button>'
        + '</div>';
    return;
  }
  box.innerHTML = leads.map(function(l) {
    var initials = (l.name||'?').slice(0,1).toUpperCase();
    var st = l.stage || '待开发';
    return '<div class="citem" role="button" tabindex="0" onclick="selectLead(\'' + l.id + '\',this)">'
      + '<div class="avatar">' + esc(initials) + '</div>'
      + '<div class="ci-info"><div class="ci-name">' + esc(l.name) + '</div>'
      + '<div class="ci-sub">' + esc(l.country||'') + ' · ' + esc(l.product||'') + '</div></div>'
      + '<span class="ci-badge tag-stage">' + esc(st) + '</span>'
      + '</div>';
  }).join('');
}

function clearSearch() {
  $('searchC').value = '';
  renderList();
  $('searchC').focus();
}

function iso(off) { var d = new Date(); d.setDate(d.getDate() + off); return d.toISOString().slice(0, 10); }

/* 空态卡里的「载入示例」：只在没有任何线索时写入，避免重复播种 */
function loadDemoLeads() {
  if (DataStore.list('leads').length) { renderList(); return; }
  DataStore.add('leads', { name: 'Omar', country: 'Egypt', market: '中东', stage: '报价', wa: '+20101234567', email: '', product: 'prayer pillow blue', amount: 2400, last: iso(-4), note: '等PI（示例，可删）', score: null });
  DataStore.add('leads', { name: 'John', country: 'USA', market: '欧美', stage: '待开发', wa: '', email: 'john@importer.com', product: 'gift box', amount: 0, last: iso(-35), note: '展会名片（示例，可删）', score: null });
  renderList();
  var first = document.querySelector('#clist .citem');
  if (first) first.click();
  if (window.FT && FT.toast) FT.toast('已载入 2 条示例客户');
}

function selectLead(id, el) {
  S.lead = DataStore.get('leads', id);
  if (!S.lead) return;
  renderDetail();
  // 高亮（显式传 el：键盘触发时 window.event 不可靠）
  el = el || (window.event && window.event.currentTarget);
  document.querySelectorAll('.citem').forEach(function(x){
    x.classList.remove('on');
    x.removeAttribute('aria-current');
  });
  if (el && el.classList) { el.classList.add('on'); el.setAttribute('aria-current', 'true'); }
}

function renderDetail() {
  var l = S.lead;
  if (!l) return;
  var initials = (l.name||'?').slice(0,1).toUpperCase();

  // 收集关联数据
  var quotes = DataStore.list('quotes').filter(function(q){ return q.leadId === l.id; });
  var todos = DataStore.list('todos').filter(function(t){ return t.leadId === l.id; });
  var docs = DataStore.list('docs').filter(function(d){ return (d.buyer||'').includes(l.name) || (d.leadId === l.id); });
  var outreach = DataStore.list('outreach').filter(function(o){ return o.leadId === l.id; });
  var comps = DataStore.list('comps').filter(function(c){ return c.leadId === l.id; });

  var totalQuoted = quotes.reduce(function(s,q){ return s + (q.total||0); }, 0);
  var quoteCurrency = quotes.length ? quotes[0].currency : 'USD';

  var html = '<div class="ft-card profile-card">'
    + '<div class="avatar-lg">' + esc(initials) + '</div>'
    + '<div class="info">'
    +   '<h2>' + esc(l.name) + '</h2>'
    +   '<div class="sub">' + esc(l.country||'') + (l.market ? ' · ' + esc(l.market) : '') + '</div>'
    +   '<div class="tags">'
    +     '<span class="tag tag-stage">' + esc(l.stage||'待开发') + '</span>'
    +     (l.market ? '<span class="tag tag-market">' + esc(l.market) + '</span>' : '')
    +     (l.product ? '<span class="tag tag-type">' + esc(l.product) + '</span>' : '')
    +   '</div>'
    + '</div>'
    + '<div class="quick-actions">'
    +   (l.wa ? '<a class="qa-btn whatsapp" href="https://wa.me/' + esc(l.wa.replace(/\D/g,'')) + '" target="_blank">💬 WhatsApp</a>' : '')
    +   (l.email ? '<a class="qa-btn email" href="mailto:' + esc(l.email) + '">✉ 邮件</a>' : '')
    +   '<button class="qa-btn quote" onclick="FT.go(\'modules/quotes.html\')">💰 报价</button>'
    +   '<button class="qa-btn todo" onclick="addTodo()">✅ 加待办</button>'
    + '</div>'
    + '</div>';

  // 统计条
  html += '<div class="ft-card stats-bar">'
    + '<div class="stat-item"><b>' + quotes.length + '</b><span>报价</span></div>'
    + '<div class="stat-item"><b>' + docs.length + '</b><span>单证</span></div>'
    + '<div class="stat-item"><b>' + todos.length + '</b><span>待办</span></div>'
    + '<div class="stat-item"><b>' + outreach.length + '</b><span>触达</span></div>'
    + '<div class="stat-item"><b>' + comps.length + '</b><span>竞品</span></div>'
    + '<div class="stat-item"><b>' + esc(quoteCurrency) + ' ' + totalQuoted.toFixed(2) + '</b><span>累计报价</span></div>'
    + '</div>';

  // 标签页
  html += '<div class="ft-card">'
    + '<div class="tabs" role="tablist" aria-label="客户资料分类">'
    +   '<div class="tab on" role="tab" aria-selected="true" tabindex="0" id="tab-timeline" aria-controls="tc-timeline" data-tab="timeline" onclick="switchTab(\'timeline\',this)">📅 时间线</div>'
    +   '<div class="tab" role="tab" aria-selected="false" tabindex="-1" id="tab-quotes" aria-controls="tc-quotes" data-tab="quotes" onclick="switchTab(\'quotes\',this)">💰 报价 (' + quotes.length + ')</div>'
    +   '<div class="tab" role="tab" aria-selected="false" tabindex="-1" id="tab-docs" aria-controls="tc-docs" data-tab="docs" onclick="switchTab(\'docs\',this)">📄 单证 (' + docs.length + ')</div>'
    +   '<div class="tab" role="tab" aria-selected="false" tabindex="-1" id="tab-todos" aria-controls="tc-todos" data-tab="todos" onclick="switchTab(\'todos\',this)">✅ 待办 (' + todos.length + ')</div>'
    +   '<div class="tab" role="tab" aria-selected="false" tabindex="-1" id="tab-outreach" aria-controls="tc-outreach" data-tab="outreach" onclick="switchTab(\'outreach\',this)">📧 触达 (' + outreach.length + ')</div>'
    +   '<div class="tab" role="tab" aria-selected="false" tabindex="-1" id="tab-comps" aria-controls="tc-comps" data-tab="comps" onclick="switchTab(\'comps\',this)">⚔️ 竞品 (' + comps.length + ')</div>'
    +   '<div class="tab" role="tab" aria-selected="false" tabindex="-1" id="tab-notes" aria-controls="tc-notes" data-tab="notes" onclick="switchTab(\'notes\',this)">📝 备注</div>'
    + '</div>';

  // 时间线
  var events = [];
  if (l.createdAt) events.push({ date: l.createdAt, title: '线索创建', desc: '来源：' + (l.source||''), done: true });
  quotes.forEach(function(q){
    events.push({ date: q.createdAt, title: '报价 ' + (q.no||''), desc: q.currency + ' ' + (q.total||0).toFixed(2) + ' — ' + (q.status||'draft'), done: q.status==='accepted' });
  });
  outreach.forEach(function(o){
    events.push({ date: o.createdAt, title: '触达：' + (o.scene||''), desc: (o.content||'').slice(0,80), done: true });
  });
  todos.forEach(function(t){
    events.push({ date: t.createdAt || t.due, title: '待办：' + (t.title||''), desc: t.done ? '✅ 已完成' : (t.due ? '到期：' + t.due : ''), done: t.done });
  });
  events.sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });

  html += '<div class="tab-content on" id="tc-timeline" role="tabpanel" aria-labelledby="tab-timeline">';
  if (events.length) {
    html += '<div class="timeline">' + events.slice(0,15).map(function(ev){
      return '<div class="tl-item' + (ev.done ? ' done' : '') + '">'
        + '<div class="tl-date">' + esc(ev.date ? new Date(ev.date).toLocaleDateString() : '') + '</div>'
        + '<div class="tl-title">' + esc(ev.title) + '</div>'
        + '<div class="tl-desc">' + esc(ev.desc) + '</div>'
        + '</div>';
    }).join('') + '</div>';
  } else { html += '<div class="empty-tab">暂无交互记录</div>'; }
  html += '</div>';

  // 报价
  html += '<div class="tab-content" id="tc-quotes" role="tabpanel" aria-labelledby="tab-quotes">';
  if (quotes.length) {
    quotes.forEach(function(q){
      html += '<div class="linked-item"><span class="li-icon">💰</span><div class="li-info">'
        + '<div class="li-title">' + esc(q.no||'未编号') + '</div>'
        + '<div class="li-sub">' + esc(q.date||'') + ' · ' + esc(q.product||'') + ' · ' + esc(q.status||'draft') + '</div>'
        + '</div><span class="li-amount">' + esc(q.currency||'USD') + ' ' + (q.total||0).toFixed(2) + '</span></div>';
    });
  } else { html += '<div class="empty-tab">暂无报价记录</div>'; }
  html += '</div>';

  // 单证
  html += '<div class="tab-content" id="tc-docs" role="tabpanel" aria-labelledby="tab-docs">';
  if (docs.length) {
    docs.forEach(function(d){
      html += '<div class="linked-item"><span class="li-icon">📄</span><div class="li-info">'
        + '<div class="li-title">' + esc(d.title||d.type||'单证') + '</div>'
        + '<div class="li-sub">' + esc(d.date||'') + ' · ' + esc(d.no||'') + '</div>'
        + '</div></div>';
    });
  } else { html += '<div class="empty-tab">暂无单证记录</div>'; }
  html += '</div>';

  // 待办
  html += '<div class="tab-content" id="tc-todos" role="tabpanel" aria-labelledby="tab-todos">';
  if (todos.length) {
    todos.forEach(function(t){
      html += '<div class="linked-item"><span class="li-icon">' + (t.done ? '✅' : '⬜') + '</span><div class="li-info">'
        + '<div class="li-title">' + esc(t.title||'') + '</div>'
        + '<div class="li-sub">' + (t.due ? '到期：' + esc(t.due) : '') + '</div>'
        + '</div></div>';
    });
  } else { html += '<div class="empty-tab">暂无待办</div>'; }
  html += '</div>';

  // 触达
  html += '<div class="tab-content" id="tc-outreach" role="tabpanel" aria-labelledby="tab-outreach">';
  if (outreach.length) {
    outreach.forEach(function(o){
      html += '<div class="linked-item"><span class="li-icon">📧</span><div class="li-info">'
        + '<div class="li-title">' + esc(o.scene||'触达') + '</div>'
        + '<div class="li-sub">' + esc((o.content||'').slice(0,100)) + '</div>'
        + '</div></div>';
    });
  } else { html += '<div class="empty-tab">暂无触达记录</div>'; }
  html += '</div>';

  // 竞品
  html += '<div class="tab-content" id="tc-comps" role="tabpanel" aria-labelledby="tab-comps">';
  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'
    + '<b style="font-size:13px">竞品对比（' + comps.length + '）</b>'
    + '<button class="btn-sm" style="padding:4px 12px;background:var(--brand-700);color:#fff;border:0;border-radius:var(--r-sm);cursor:pointer;font-size:12.5px" onclick="openCompEdit()">＋ 添加竞品</button>'
    + '</div>';
  if (comps.length) {
    comps.forEach(function(c){
      var url = safeUrl(c.website);
      var meta = [c.country || '', url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(url.replace(/^https?:\/\/(www\.)?/, '')) + '</a>' : '']
        .filter(Boolean).join(' · ');
      html += '<div class="comp-item">'
        + '<div class="comp-top"><span class="comp-name">' + esc(c.name) + '</span>'
        + (meta ? '<span class="comp-meta">' + meta + '</span>' : '')
        + '<span class="comp-acts"><button onclick="openCompEdit(\'' + esc(c.id) + '\')">编辑</button><button class="del" onclick="delComp(\'' + esc(c.id) + '\')">删除</button></span></div>'
        + (c.product ? '<div class="comp-row"><b>对标产品：</b>' + esc(c.product) + '</div>' : '')
        + ((c.price || c.moq) ? '<div class="comp-row"><b>价格 / MOQ：</b>' + esc(c.price || '—') + (c.moq ? ' · ' + esc(c.moq) : '') + '</div>' : '')
        + (c.advantage ? '<div class="comp-row"><b>优势：</b>' + esc(c.advantage) + '</div>' : '')
        + (c.threat ? '<div class="comp-row"><b>威胁 / 应对：</b>' + esc(c.threat) + '</div>' : '')
        + (c.note ? '<div class="comp-row"><b>备注：</b>' + esc(c.note) + '</div>' : '')
        + '</div>';
    });
  } else {
    html += '<div class="comp-empty">还没有记录这个客户的竞品<br><br><button class="btn-sm" style="padding:5px 14px;background:var(--brand-700);color:#fff;border:0;border-radius:var(--r-sm);cursor:pointer;font-size:12.5px" onclick="openCompEdit()">＋ 添加第一个竞品</button></div>';
  }
  html += '</div>';

  // 备注
  html += '<div class="tab-content" id="tc-notes" role="tabpanel" aria-labelledby="tab-notes">'
    + '<div class="note-box"><textarea id="noteArea" aria-label="客户备注" placeholder="记录关于这个客户的备注…">' + esc(l.note||'') + '</textarea>'
    + '<div class="note-saved" id="noteSaved" role="status"></div>'
    + '<button class="btn-sm" style="margin-top:6px;padding:4px 12px;background:var(--brand-700);color:#fff;border:0;border-radius:var(--r-sm);cursor:pointer;font-size:12.5px" onclick="saveNote()">保存备注</button>'
    + '</div>'
    + '<div class="note-box" style="margin-top:var(--sp-3)"><b style="font-size:13px">AI 客户摘要</b>'
    + '<div id="aiSummary" style="font-size:13px;color:var(--text-2);margin-top:6px" aria-live="polite">点击下方按钮生成 AI 对该客户的分析摘要</div>'
    + '<button class="btn-sm" style="margin-top:8px;padding:4px 12px;background:var(--brand-700);color:#fff;border:0;border-radius:var(--r-sm);cursor:pointer;font-size:12.5px" onclick="aiSummary()">🧠 AI 生成摘要</button>'
    + '</div>'
    + '</div>';

  html += '</div>';
  $('detailArea').innerHTML = html;
}

function switchTab(name, el) {
  document.querySelectorAll('.tab-content').forEach(function(tc){ tc.classList.remove('on'); });
  document.querySelectorAll('.tab').forEach(function(t){
    var on = t === el;
    t.classList.toggle('on', on);
    t.setAttribute('aria-selected', on ? 'true' : 'false');
    // roving tabindex：只有选中项留在 Tab 序列里，其余用方向键进入
    t.tabIndex = on ? 0 : -1;
  });
  $('tc-' + name).classList.add('on');
}

function saveNote() {
  if (!S.lead) return;
  var note = $('noteArea').value.trim();
  DataStore.update('leads', S.lead.id, { note: note });
  S.lead.note = note;
  $('noteSaved').textContent = '✓ 已保存';
  setTimeout(function(){ $('noteSaved').textContent = ''; }, 2000);
}

function addTodo() {
  if (!S.lead) return;
  var title = prompt('待办事项：');
  if (!title) return;
  DataStore.add('todos', {
    title: title, leadId: S.lead.id, leadName: S.lead.name,
    due: new Date(Date.now() + 86400000).toISOString().slice(0,10),
    done: false
  });
  renderDetail();
}

async function aiSummary() {
  var l = S.lead;
  if (!l) return;
  var quotes = DataStore.list('quotes').filter(function(q){ return q.leadId === l.id; });
  var todos = DataStore.list('todos').filter(function(t){ return t.leadId === l.id; });
  var outreach = DataStore.list('outreach').filter(function(o){ return o.leadId === l.id; });
  var box = $('aiSummary');
  box.textContent = '🧠 AI 分析中…';
  try {
    var p = '分析以下外贸客户，给出 360° 摘要和跟进建议。\n'
      + '客户：' + (l.name||'?') + '（' + (l.country||'?') + '，' + (l.market||'?') + '市场）\n'
      + '产品：' + (l.product||'?') + '\n'
      + '阶段：' + (l.stage||'?') + '\n'
      + '邮箱：' + (l.email||'无') + '\n'
      + 'WhatsApp：' + (l.wa||'无') + '\n'
      + '报价次数：' + quotes.length + '，累计报价：' + quotes.reduce(function(s,q){return s+(q.total||0);},0) + '\n'
      + '触达次数：' + outreach.length + '\n'
      + '待办数：' + todos.length + '（未完成：' + todos.filter(function(t){return !t.done;}).length + '）\n'
      + '备注：' + (l.note||'无') + '\n\n'
      + '请给出：\n'
      + '1) 客户价值评估（一句话）\n'
      + '2) 当前跟进状态总结\n'
      + '3) 下一步最佳行动建议（具体可执行）\n'
      + '用中文，简洁。';
    var res = await AgnesAI.ask(p, { temperature: 0.4, maxTokens: 600 });
    box.textContent = res;
  } catch(e) {
    box.textContent = '❌ ' + e.message;
  }
}

/* ---------- 竞品 ---------- */
function activateTab(name) {
  var el = document.querySelector('.tab[data-tab="' + name + '"]');
  if (el) switchTab(name, el);
}

function openCompEdit(id) {
  if (!S.lead) { alert('请先选择客户'); return; }
  compEditingId = id || null;
  var c = id ? DataStore.get('comps', id) : null;
  $('ce_title').textContent = id ? '编辑竞品' : ('添加竞品 · ' + (S.lead.name || ''));
  var map = { name:'ce_name', country:'ce_country', website:'ce_website', product:'ce_product',
    price:'ce_price', moq:'ce_moq', advantage:'ce_advantage', threat:'ce_threat', note:'ce_note' };
  Object.keys(map).forEach(function(k){ $(map[k]).value = c && c[k] != null ? c[k] : ''; });
  $('dlgComp').showModal();
  setTimeout(function(){ $('ce_name').focus(); }, 50);
}

function saveComp() {
  if (!S.lead) return;
  var name = $('ce_name').value.trim();
  if (!name) { alert('竞品公司/品牌必填'); $('ce_name').focus(); return; }
  var rec = {
    name: name,
    country: $('ce_country').value.trim(),
    website: safeUrl($('ce_website').value.trim()),
    product: $('ce_product').value.trim(),
    price: $('ce_price').value.trim(),
    moq: $('ce_moq').value.trim(),
    advantage: $('ce_advantage').value.trim(),
    threat: $('ce_threat').value.trim(),
    leadId: S.lead.id,
    note: $('ce_note').value.trim()
  };
  if (compEditingId) DataStore.update('comps', compEditingId, rec);
  else DataStore.add('comps', rec);
  $('dlgComp').close();
  compEditingId = null;
  renderDetail();
  activateTab('comps');
}

function delComp(id) {
  var c = DataStore.get('comps', id);
  if (!c) return;
  if (!confirm('删除竞品「' + (c.name || '') + '」？不影响客户线索。')) return;
  DataStore.remove('comps', id);
  renderDetail();
  activateTab('comps');
}

renderList();
</script>
