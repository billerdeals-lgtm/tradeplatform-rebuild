<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FT Compass · 我的资料</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
<link rel="stylesheet" href="../assets/tokens.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--bg-page); color:var(--text-1); }
  header { background:var(--brand-900); color:#fff; padding:var(--sp-4) var(--sp-6); display:flex; align-items:center; gap:var(--sp-3); }
  header img { width:34px; height:34px; }
  header h1 { font-size:18px; margin:0; flex:1; }
  main { max-width:760px; margin:0 auto; padding:var(--sp-6) var(--sp-4) 80px; }
  .intro { font-size:13px; color:var(--text-2); line-height:1.8; margin-bottom:var(--sp-6); }
  section { margin-bottom:var(--sp-7); }
  section > h2 { font-size:14px; color:var(--text-2); font-weight:600; letter-spacing:.05em; margin:0 0 var(--sp-4); padding-bottom:var(--sp-2); border-bottom:1px solid var(--border); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-4) var(--sp-6); }
  .full { grid-column:1/-1; }
  label { display:block; font-size:12.5px; color:var(--text-3); margin-bottom:5px; }
  input, textarea {
    width:100%; box-sizing:border-box; padding:10px 2px; border:0; border-bottom:1.5px solid var(--border-strong);
    font-size:14.5px; font-family:var(--font-sans); background:transparent; color:var(--text-1); transition:border-color .15s;
  }
  input:focus, textarea:focus { outline:none; border-bottom-color:var(--brand-700); }
  textarea { resize:vertical; min-height:56px; line-height:1.6; }
  ::placeholder { color:var(--text-3); opacity:.55; }
  .sellrow { display:flex; gap:var(--sp-4); align-items:flex-end; }
  .sellrow textarea { flex:1; }
  .btnrow { display:flex; gap:var(--sp-3); margin-top:var(--sp-6); align-items:center; }
  .saved { color:var(--ok); font-size:13px; display:none; }
  .ft-ai-output { white-space:pre-wrap; font-size:13.5px; margin-top:var(--sp-3); display:none; }
</style>
</head>
<body>
<header>
  <img src="../assets/logo.svg" alt="logo">
  <h1>我的资料</h1>
</header>
<main>
  <div class="intro">全应用 AI 个性化的数据源：开发信署名、跟进话术、报价备注会自动引用以下内容——填得越全，AI 生成越像"你"。所有字段可选。</div>

  <section>
    <h2>发信人署名</h2>
    <div class="grid">
      <div><label>我的称呼（英文信里用）</label><input id="p_name"></div>
      <div><label>职位</label><input id="p_role"></div>
      <div class="full"><label>公司名（英文）</label><input id="p_company"></div>
      <div><label>WhatsApp</label><input id="p_wa"></div>
      <div><label>邮箱</label><input id="p_email"></div>
    </div>
  </section>

  <section>
    <h2>业务底盘</h2>
    <div class="grid">
      <div class="full"><label>主营产品</label><textarea id="p_products"></textarea></div>
      <div class="full">
        <label>核心卖点（AI 写信必引用）</label>
        <div class="sellrow">
          <textarea id="p_selling"></textarea>
          <button class="ft-btn-ai" onclick="aiPolish()" title="AI 润色卖点">✨ 润色</button>
        </div>
        <div id="polish_out" class="ft-ai-output"></div>
      </div>
      <div><label>起运港</label><input id="p_port"></div>
      <div><label>常用付款方式</label><input id="p_payment"></div>
      <div><label>MOQ 政策</label><input id="p_moq"></div>
      <div><label>公司网站</label><input id="p_site"></div>
    </div>
  </section>

  <div class="btnrow">
    <button class="ft-btn-primary" onclick="save()">保存资料</button>
    <span class="saved" id="saved">✓ 已保存，各模块即刻生效</span>
  </div>

  <!-- 品牌资料（Logo / 电子签名 / 公司公章 + 工商银行） -->
  <section class="ft-card" style="padding:var(--sp-4);margin-top:var(--sp-6);margin-bottom:var(--sp-4)">
    <h2 style="margin-top:0;font-size:14px">品牌与印章（单证/报价通用）</h2>
    <div style="font-size:13px;color:var(--text-2);line-height:1.7;margin-bottom:var(--sp-3)">
      Logo、电子签名、公司公章和收款资料保存一次，单证中心的报价、PI、合同、CI、装箱单自动盖章复用。
      <button class="ft-btn-primary" style="margin-left:8px" onclick="openBrandDlg()">🏷 打开品牌资料</button>
    </div>
    <div id="brandSummary" style="display:flex;gap:var(--sp-4);flex-wrap:wrap;align-items:center;font-size:13px"></div>
  </section>
</main>

<div id="brandHost"></div>

<script src="../js/datastore.js"></script>
<script src="../agnes-ai.js"></script>
<script src="../js/brand.js?v=3"></script>
<script>
/* 我的资料：单条记录（固定 id 'my'）存 profile 集合 */
var FIELDS = ['p_name','p_role','p_company','p_wa','p_email','p_products','p_selling','p_port','p_payment','p_moq','p_site'];
var K = FIELDS.map(function(f){ return f.slice(2); }); // 去掉 p_ 前缀作字段名

function me() { return DataStore.list('profile')[0] || null; }
function fill() {
  var m = me() || {};
  FIELDS.forEach(function(f, i) { document.getElementById(f).value = m[K[i]] || ''; });
}
function save() {
  var rec = me() || { id: 'my' };
  FIELDS.forEach(function(f, i) { rec[K[i]] = document.getElementById(f).value.trim(); });
  if (me()) DataStore.update('profile', 'my', rec); else DataStore.add('profile', rec);
  var s = document.getElementById('saved'); s.style.display = 'inline';
  setTimeout(function(){ s.style.display = 'none'; }, 2500);
}
async function aiPolish() {
  var box = document.getElementById('polish_out'), selling = document.getElementById('p_selling').value.trim();
  if (!selling) { box.style.display='block'; box.textContent = '先写下卖点草稿，再点润色'; return; }
  box.style.display = 'block'; box.textContent = 'AI 润色中…';
  try {
    var prods = document.getElementById('p_products').value.trim();
    var txt = await AgnesAI.ask('把这条外贸卖点润色成英文 USP 一句话（15-25 词，去掉空话，突出可验证事实），给出英文后另起一行附中文对照：\n卖点：' + selling + (prods ? '\n主营产品：' + prods : ''), { maxTokens: 300 });
    box.textContent = txt + '\n\n（点文本框可手动复制/修改，保存后全应用生效）';
  } catch (e) { box.textContent = '❌ ' + e.message; }
}
/* ---------- 品牌资料 ---------- */
function openBrandDlg(){ Brand.open('dlgBrand', paintBrand); }
function paintBrand(){
  var b = Brand.get();
  var box = document.getElementById('brandSummary');
  var items = [];
  items.push(b.logo ? '<img src="'+b.logo+'" style="max-height:38px">' : '<span style="color:var(--text-3)">Logo 未设置</span>');
  items.push(b.sign ? '✍ 签名 ✓' : '<span style="color:var(--text-3)">签名未设置</span>');
  items.push(b.seal ? '🔴 公章 ✓' : '<span style="color:var(--text-3)">公章未设置</span>');
  items.push(b.sellerFull ? escTxt(b.sellerFull) : '');
  items.push(b.bankAcct ? '🏦 '+escTxt(b.bankName||'')+' '+escTxt((b.bankAcct||'').slice(0,6)+'…') : '');
  box.innerHTML = items.filter(Boolean).map(function(x){ return '<span>'+x+'</span>'; }).join('<span style="color:var(--text-3)">·</span>');
}
function escTxt(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

fill();
document.getElementById('brandHost').innerHTML = Brand.dialogHTML('dlgBrand');
Brand.initDialog('dlgBrand', paintBrand);
paintBrand();
</script>
</body>
</html>
