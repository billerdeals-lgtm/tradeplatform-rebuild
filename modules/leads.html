<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b6e4f'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23fff' stroke-width='3.5'/%3E%3Cpath d='M32 15 L38 32 L32 49 L26 32 Z' fill='%23ffc53d'/%3E%3Ccircle cx='32' cy='32' r='3.2' fill='%230b6e4f'/%3E%3C/svg%3E">

<style>
  /* FT Compass 视觉体系（tokens.css 为准）：翡翠绿 / 琥珀 AI 规范 / 米白纸面 */
  * { box-sizing: border-box; margin: 0; }
  body { font: 15px/1.7 var(--font-sans); background: var(--bg-page); color: var(--text-1); }
  header { background: var(--brand-900); color: #fff; padding: 12px 22px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 50; }
  header .logo { width: 38px; height: 38px; border-radius: 9px; background: #ffffff22; display: flex; align-items: center; justify-content: center; }
  header h1 { font-size: 17px; font-weight: 600; flex: 1; }
  header .hbtn { background: #ffffff22; border: 0; color: #fff; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 70px; }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar input, .toolbar select { padding: 9px 12px; border: 1px solid var(--border-field); border-radius: 9px; font-size: 14px; background: #fff; }
  .toolbar input { flex: 1; min-width: 180px; }
  .btn { padding: 9px 18px; border: 0; border-radius: 9px; background: #0b6e4f; color: #fff; cursor: pointer; font-size: 14px; }
  .btn.amber { background: #ffc53d; color: #4a3800; }
  .btn.ghost { background: #ecefe6; color: #33412e; }
  .btn.sm { padding: 5px 11px; font-size: 12.5px; border-radius: 7px; }
  .btn:disabled { opacity: .5; cursor: wait; }

  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat { background: #fff; border: 1px solid #e4e2d8; border-radius: 12px; padding: 10px 18px; font-size: 13px; color: #5c6657; }
  .stat b { display: block; font-size: 20px; color: #0b6e4f; }

  /* 线索卡 */
  .lead { background: #fff; border: 1px solid #e4e2d8; border-radius: 13px; padding: 14px 18px; margin-bottom: 12px; }
  .lead .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .lead .name { font-weight: 700; font-size: 16px; }
  .tag { font-size: 12px; padding: 2px 10px; border-radius: 20px; background: #ecefe6; color: #4c5747; }
  .tag.s0 { background: #f3e8d7; color: #7a5b1c; } .tag.s1 { background: #dfe9f5; color: #2c5282; }
  .tag.s2 { background: #e8ddf3; color: #5b3a86; } .tag.s3 { background: #f7ddd8; color: #99412f; }
  .tag.s4 { background: #d9efe2; color: #1d6b45; }
  .tag.hi { background: #0b6e4f; color: #fff; } .tag.mid { background: #ffc53d; color: #4a3800; } .tag.lo { background: #e4e2d8; }
  .lead .meta { color: var(--text-2); font-size: 13px; margin-top: 4px; }
  .lead .acts { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
  /* AI 输出容器：琥珀规范（tokens.css）——一眼识别"AI 说的" */
  .aiout, .mout { background: var(--accent-100); border-left: 3px solid var(--accent-500); border-radius: 10px; padding: 10px 13px; font-size: 13.5px; white-space: pre-wrap; }
  .aiout { margin-top: 10px; display: none; }

  /* 弹窗：原生 dialog 元素，由 show()/hide() 调 showModal()/close()。
     用 [open] 而不是 .show，Esc、焦点圈定、背景 inert 都交给浏览器。 */
  dialog.mask { position: fixed; inset: 0; z-index: 100; box-sizing: border-box; width: 100%; max-width: none; height: 100%; max-height: none; margin: 0; border: 0; padding: 40px 14px; background: transparent; overflow: auto; }
  dialog.mask[open] { display: flex; align-items: flex-start; justify-content: center; }
  dialog.mask::backdrop { background: rgba(34,48,31,.4); }
  .mask.show { display: flex; }
  .modal { background: #fff; border-radius: 14px; padding: 22px 24px; width: 640px; max-width: 96vw; }
  .modal h3 { font-size: 16px; margin-bottom: 12px; color: #0b6e4f; }
  .modal label { display: block; font-size: 12.5px; color: #5c6657; margin: 10px 0 4px; }
  .modal input, .modal select, .modal textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--border-field); border-radius: 9px; font-size: 14px; background: #fcfcfa; }
  .modal textarea { min-height: 76px; resize: vertical; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .mrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .mout { max-height: 260px; overflow: auto; display: none; margin-top: 10px; }
  .mrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .cfgbox input, .cfgbox label { font: 14px/1.6 system-ui; }

  /* 分页：导入上千条客户后不要一次渲染全部卡片 */
  .pager { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 8px 0 18px; flex-wrap: wrap; }
  .pager .info { color: var(--text-2); font-size: 13px; }
  /* CSV 导入预览 */
  .imap { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 10px 0 4px; }
  .imap th, .imap td { border: 1px solid var(--border); padding: 5px 7px; text-align: left; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .imap th { background: #f5f7fa; font-weight: 600; color: var(--text-2); }
  .inote { font-size: 12.5px; color: var(--text-2); line-height: 1.7; }
  .iwarn { font-size: 12.5px; color: #b45309; line-height: 1.7; }
  .iradio { display: flex; gap: 16px; flex-wrap: wrap; margin: 8px 0 0; font-size: 13px; }
  .iradio label { display: inline-flex; align-items: center; gap: 5px; margin: 0; }
</style>

<body>

<header>
  <div class="logo">
    <svg width="26" height="26" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="19" fill="none" stroke="#fff" stroke-width="3.5"/>
      <path d="M32 13 L38.5 32 L32 51 L25.5 32 Z" fill="#ffc53d"/>
      <circle cx="32" cy="32" r="3.4" fill="#0b6e4f"/>
    </svg>
  </div>
  <h1>线索工作台</h1>
  <button class="hbtn" onclick="openCfg()">⚙ AI 设置</button>
</header>

<main>
  <div class="stats">
    <div class="stat"><b id="stTotal">0</b>线索总数</div>
    <div class="stat"><b id="stHot">0</b>高分线索(≥70)</div>
    <div class="stat"><b id="stDue">0</b>超3天未跟进</div>
    <div class="stat"><b id="stAmt">$0</b>线索预估总额</div>
  </div>

  <div class="toolbar">
    <input id="q" aria-label="搜索线索" placeholder="搜索客户名 / 产品 / 备注…" oninput="resetPage();render()">
    <select id="fStage" aria-label="按阶段筛选" onchange="resetPage();render()">
      <option value="">全部阶段</option><option>待开发</option><option>已联系</option>
      <option>试样</option><option>报价</option><option>成交</option>
    </select>
    <button class="btn" onclick="openEdit()">＋ 添加线索</button>
    <button class="btn ghost" id="btnPickCsv" onclick="pickCsv()">⬆ 导入 CSV</button>
    <button class="btn ghost" onclick="exportCsv()">导出 CSV</button>
  </div>
  <input type="file" id="csvFile" accept=".csv,.txt,.xlsx,text/csv,text/plain,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="display:none" onchange="readCsv(this)">

  <div id="list"></div>
  <nav class="pager" id="pager" aria-label="线索分页" hidden></nav>
</main>

<!-- 新增/编辑线索 -->
<dialog class="mask" id="mEdit" role="dialog" aria-modal="true" aria-labelledby="editTitle">
  <div class="modal">
    <h3 id="editTitle">添加线索</h3>
    <div class="grid2">
      <div><label for="e_name">客户名 *</label><input id="e_name"></div>
      <div><label for="e_country">国家</label><input id="e_country" placeholder="Egypt / USA…"></div>
      <div><label for="e_market">市场</label><select id="e_market"><option>中东</option><option>东南亚</option><option>欧美</option><option>非洲</option><option>其他</option></select></div>
      <div><label for="e_stage">阶段</label><select id="e_stage"><option>待开发</option><option>已联系</option><option>试样</option><option>报价</option><option>成交</option></select></div>
      <div><label for="e_wa">WhatsApp（含国家码）</label><input id="e_wa" placeholder="+2010…"></div>
      <div><label for="e_email">邮箱</label><input id="e_email" placeholder="buyer@company.com"></div>
      <div><label for="e_product">关注产品</label><input id="e_product" placeholder="prayer pillow"></div>
      <div><label for="e_amount">预估金额 (USD)</label><input id="e_amount" type="number" value="0"></div>
      <div><label for="e_last">最后联系</label><input id="e_last" type="date"></div>
    </div>
    <label for="e_note">备注</label><textarea id="e_note" placeholder="展会名片 / 等 PI / 嫌贵…"></textarea>
    <div class="mrow">
      <button class="btn" onclick="saveEdit()">保存</button>
      <button class="btn ghost" onclick="hide('mEdit')">取消</button>
    </div>
  </div>
</dialog>

<!-- AI 触达：生成开发信 / 回复草稿 -->
<dialog class="mask" id="mTouch" role="dialog" aria-modal="true" aria-labelledby="touchTitle">
  <div class="modal">
    <h3 id="touchTitle">AI 触达</h3>
    <div class="mrow" style="margin:0 0 6px">
      <button class="btn sm ghost" id="tabMail" onclick="touchTab('mail')">✉ 生成开发信</button>
      <button class="btn sm ghost" id="tabReply" onclick="touchTab('reply')">↩ 客户回复草稿</button>
      <button class="btn sm ghost" id="tabObjection" onclick="touchTab('objection')">⚡ 异议应对</button>
    </div>
    <div id="paneMail">
      <label for="t_scene">场景</label>
      <select id="t_scene"><option>首封冷开发信</option><option>询盘首复</option><option>样品跟进</option><option>报价跟进</option><option>久未回复二次跟进</option></select>
      <label for="t_me">我的署名信息（一句话即可）</label>
      <input id="t_me" placeholder="Wei, Beijing Northwind Trading Co., Ltd., 工厂直供/低MOQ/免费样品">
    </div>
    <div id="paneReply" style="display:none">
      <label for="t_cw">粘贴客户原话（WhatsApp/邮件）</label>
      <textarea id="t_cw" placeholder="Hi, the price is too high…"></textarea>
    </div>
    <div id="paneObjection" style="display:none">
      <label for="t_objPre">客户提出了什么异议？</label>
      <select id="t_objPre"><option value="">— 常见异议快捷选择 —</option><option>价格太贵 Your price is too high</option><option>其他供应商报得更低 Another supplier quoted lower</option><option>我要请示老板 I need to ask my boss</option><option>先下一小单试试 We'll try a small order first</option><option>付款条件不合适 Payment terms don't work</option></select>
      <textarea id="t_obj" aria-label="异议原话或描述" placeholder="或直接粘贴客户原话/描述异议…" style="min-height:60px"></textarea>
    </div>
    <div class="mrow"><button class="btn" id="btnGen" onclick="genTouch()">AI 生成</button></div>
    <div class="mout" id="t_out" aria-live="polite"></div>
    <div class="mrow" id="t_sendRow" style="display:none">

      <button class="btn sm amber" onclick="sendGmail()">Gmail 发送</button>
      <button class="btn sm amber" onclick="sendOutlook()">Outlook 发送</button>
      <button class="btn sm ghost" onclick="copyOut()">复制全文</button>
    </div>
    <div class="mrow"><button class="btn ghost" onclick="hide('mTouch')">关闭</button></div>
  </div>
</dialog>

<!-- CSV 导入预览 -->
<dialog class="mask" id="mImport" role="dialog" aria-modal="true" aria-labelledby="impTitle">
  <div class="modal" style="width:760px">
    <h3 id="impTitle">导入客户 CSV</h3>
    <div id="impSummary" class="inote">正在读取…</div>
    <div id="impMapRow" style="display:none;margin-top:10px">
      <label for="impNameCol">客户名列（必选）</label>
      <select id="impNameCol" onchange="remapImport()"></select>
      <div class="inote" id="impMapHint" style="margin-top:6px"></div>
    </div>
    <div id="impTable"></div>
    <div id="impWarn" class="iwarn"></div>
    <div class="iradio" id="impMode">
      <label><input type="radio" name="dupMode" value="skip" checked> 跳过重复客户（推荐）</label>
      <label><input type="radio" name="dupMode" value="all"> 全部导入（允许重名）</label>
    </div>
    <div class="mrow" style="margin-top:14px">
      <button class="btn" id="btnImport" onclick="doImport()">✅ 开始导入</button>
      <button class="btn ghost" onclick="hide('mImport')">取消</button>
      <button class="btn ghost" onclick="downloadTemplate()">下载模板</button>
    </div>
    <div class="inote" style="margin-top:10px">支持 Excel .xlsx、Excel「另存为 CSV UTF-8」、WPS/Google 导出的 CSV；自动识别逗号/分号/Tab 分隔与 GBK 编码。旧版 .xls 请先在 Excel 中另存为 .xlsx 或 CSV。</div>
  </div>
</dialog>

<!-- AI 设置（复用 AgnesAI 面板） -->
<dialog class="mask" id="mCfg" role="dialog" aria-modal="true" aria-labelledby="cfgTitle">
  <div class="modal cfgbox">
    <h3 id="cfgTitle">AI 设置（Agnes 3.0 Flash）</h3>
    <div id="cfgHolder"></div>
    <div class="mrow"><button class="btn ghost" onclick="hide('mCfg')">关闭</button></div>
  </div>
</dialog>

<script>
/* ================= FT Compass 线索工作台 v0.2 =================
 * 模块：线索 Pipeline + 统计 + CSV 导出 + Agnes AI（评分/开发信/回复草稿）
 * 数据：DataStore 统一适配层（键 ftc_leads_v1，与待办/单证/话术模块互通）
 * AI 评分结果为一等字段：score/scoreReason/nextAction/nextChannel
 * ======================================================= */

var STAGES = ['待开发', '已联系', '试样', '报价', '成交'];
var PAGE_SIZE = 100;
var S = { leads: [], editId: null, touchId: null, touchMode: 'mail', lastOut: '', lastDraftId: null, page: 1, importData: null, importRaw: null };

function load() {
  S.leads = DataStore.list('leads');
  // 旧版字段迁移：_score/_next → score/nextAction（一次性，写回后删除旧键）
  var migrated = false;
  S.leads.forEach(function (l) {
    if (l._score != null && l.score == null) {
      l.score = l._score; l.nextAction = l.nextAction || l._next || ''; migrated = true;
    }
    if ('_score' in l) { delete l._score; delete l._next; migrated = true; }
  });
  if (migrated) DataStore.saveAll('leads', S.leads);
}

/* 示例数据：只在用户从空态卡点选时写入，不再首次运行自动播种 */
function loadDemo() {
  if (S.leads.length && !confirm('当前已有 ' + S.leads.length + ' 条线索。仍要追加 2 条示例吗？')) return;
  DataStore.add('leads', { name: 'Omar', country: 'Egypt', market: '中东', stage: '报价', wa: '+20101234567', email: '', product: 'prayer pillow blue', amount: 2400, last: iso(-4), note: '等PI（示例，可删）', score: null });
  DataStore.add('leads', { name: 'John', country: 'USA', market: '欧美', stage: '待开发', wa: '', email: 'john@importer.com', product: 'gift box', amount: 0, last: iso(-35), note: '展会名片（示例，可删）', score: null });
  S.leads = DataStore.list('leads');
  render();
}
function save() {
  try {
    DataStore.saveAll('leads', S.leads);
    return true;
  } catch (e) {
    alert('保存失败：' + e.message);
    S.leads = DataStore.list('leads');
    render();
    return false;
  }
}
function uid() { return 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
function iso(off) { return FT.today(off); }

/* 俄语演示线索：一键插入，供单证中心「从线索带入」后导出俄语单据 */
function addDemoRu() {
  var exists = S.leads.filter(function (l) { return l.demo === 'ru'; })[0];
  if (exists) {
    alert('俄语演示线索已存在：\n' + exists.name + '\n\n可直接到「单证中心 → 从线索带入」使用。');
    return;
  }
  DataStore.add('leads', {
    name: 'ООО «Балтийский Торг»',
    country: 'Россия',
    addr: '191119, Россия, г. Санкт-Петербург, ул. Правды, д. 10, оф. 412',
    market: '其他',
    stage: '报价',
    wa: '+7 812 000-00-00',
    email: 'sales@balt-torg.ru',
    product: 'Подушки для молитвы, подарочные коробки',
    amount: 18600,
    last: iso(-2),
    note: '演示数据：圣彼得堡进口商，等 PI（可删）',
    score: null,
    demo: 'ru'
  });
  S.leads = DataStore.list('leads');
  render();
  alert('已添加俄语演示线索。\n\n下一步：单证中心 → 从线索带入 → 选择 ООО «Балтийский Торг»\n系统会自动切到俄语并填好数量/单价/付款/港口，直接打印或导出即可。');
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
/* 内联 onclick 里的 id 参数：转义引号/反斜杠，避免备份文件里的恶意 id 逃出字符串 */
function jsArg(s) {
  return String(s == null ? '' : s)
    .replace(/\\/g, '\\\\').replace(/'/g, "\\'")
    .replace(/[\r\n]/g, ' ')
    .replace(/</g, '\\u003c').replace(/>/g, '\\u003e');
}
function show(id) {
  var d = document.getElementById(id);
  if (!d) return;
  if (typeof d.showModal === 'function') {
    if (!d.open) d.showModal();
    // 焦点必须进弹窗，不能留在触发按钮上
    var first = d.querySelector('input:not([type=hidden]), select, textarea, button');
    if (first) setTimeout(function () { try { first.focus(); } catch (e) {} }, 0);
    else { d.tabIndex = -1; d.focus(); }
  } else {
    d.classList.add('show');
  }
}
function hide(id) {
  var d = document.getElementById(id);
  if (!d) return;
  if (typeof d.close === 'function' && d.open) d.close();
  else d.classList.remove('show');
}

/* ---------- 渲染 ---------- */
function resetPage(){ S.page = 1; }
function pageInfo(total){
  var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (S.page > pages) S.page = pages;
  if (S.page < 1) S.page = 1;
  return { pages: pages, from: (S.page - 1) * PAGE_SIZE, to: (S.page - 1) * PAGE_SIZE + PAGE_SIZE };
}
function renderPager(total, pages){
  var p = document.getElementById('pager');
  if (!p) return;
  if (total <= PAGE_SIZE) { p.hidden = true; p.innerHTML = ''; return; }
  p.hidden = false;
  p.innerHTML = '<button class="btn sm ghost" onclick="goPage(' + (S.page - 1) + ')"' + (S.page <= 1 ? ' disabled' : '') + '>← 上一页</button>'
    + '<span class="info">第 ' + S.page + ' / ' + pages + ' 页 · 共 ' + total + ' 条</span>'
    + '<button class="btn sm ghost" onclick="goPage(' + (S.page + 1) + ')"' + (S.page >= pages ? ' disabled' : '') + '>下一页 →</button>';
}
function goPage(n){
  S.page = n;
  render();
  var el = document.getElementById('list');
  if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start' });
}
function render() {
  var q = (document.getElementById('q').value || '').toLowerCase();
  var fs = document.getElementById('fStage').value;
  var matched = S.leads.filter(function (l) {
    if (fs && l.stage !== fs) return false;
    if (!q) return true;
    return [l.name, l.product, l.note, l.country].join(' ').toLowerCase().indexOf(q) >= 0;
  }).slice().sort(function (a, b) { return (b.score || 0) - (a.score || 0); }); // AI 高分在前
  var pg = pageInfo(matched.length);
  var list = matched.slice(pg.from, pg.to);

  document.getElementById('stTotal').textContent = S.leads.length;
  document.getElementById('stHot').textContent = S.leads.filter(function (l) { return (l.score || 0) >= 70; }).length;
  document.getElementById('stDue').textContent = S.leads.filter(function (l) { return l.last && l.stage !== '成交' && l.last < iso(-3); }).length;

function openEdit(id) {
  S.editId = id || null;
  var l = id ? S.leads.find(function (x) { return x.id === id; }) : {};
  document.getElementById('editTitle').textContent = id ? '编辑线索' : '添加线索';
  ['name', 'country', 'wa', 'email', 'product', 'note'].forEach(function (k) {
    document.getElementById('e_' + k).value = l[k] || '';
  });
  document.getElementById('e_market').value = l.market || '中东';
  document.getElementById('e_stage').value = l.stage || '待开发';
  document.getElementById('e_amount').value = l.amount || 0;
  document.getElementById('e_last').value = (l.last || '').slice(0, 10);
  show('mEdit');
}
function saveEdit() {
  var name = document.getElementById('e_name').value.trim();
  if (!name) { alert('客户名必填'); return; }
  var obj = {
    name: name,
    country: v('e_country'), market: v('e_market'), stage: v('e_stage'),
    wa: v('e_wa'), email: v('e_email'), product: v('e_product'),
    amount: +v('e_amount') || 0, note: v('e_note'),
    last: v('e_last') || (S.editId ? '' : iso(0))
  };
  if (S.editId) {
    var l = S.leads.find(function (x) { return x.id === S.editId; });
    Object.assign(l, obj); // 编辑不清除已有 AI 评分
  } else {
    obj.id = uid(); if (!obj.last) obj.last = iso(0); obj.score = null;
    S.leads.push(obj);
  }
  if (!save()) return;
  hide('mEdit'); render();
}
function delLead(id) {
  if (!confirm('删除这条线索？（不可恢复）')) return;
  var before = S.leads;
  S.leads = S.leads.filter(function (x) { return x.id !== id; });
  if (!save()) { S.leads = before; return; }
  unlinkLeadRefs(id);
  render();
}
/* 删除线索时保留业务记录，只解除关联：
   待办/报价/竞品/触达/单证里的客户名不丢，也不会再出现点不动的悬空 leadId。 */
function unlinkLeadRefs(id) {
  var failed = [];
  ['todos', 'quotes', 'comps', 'outreach', 'docs'].forEach(function (name) {
    try {
      var arr = DataStore.list(name);
      var hit = false;
      arr.forEach(function (x) {
        if (x && x.leadId === id) { x.leadId = ''; hit = true; }
      });
      if (hit) DataStore.saveAll(name, arr);
    } catch (e) { failed.push(name); }
  });
  if (failed.length) toast('线索已删除，但部分关联记录未能解除（' + failed.join('、') + '）');
}
function v(id) { return document.getElementById(id).value.trim(); }

/* ---------- AI：评分（结果经 saveAIResult 落库为一等字段） ---------- */
async function aiScore(id, btn) {
  var l = S.leads.find(function (x) { return x.id === id; });
  var box = document.getElementById('ai_' + id);
  btn.disabled = true; box.style.display = 'block';
  box.textContent = 'AI 评分中…';
  try {
    var r = await AgnesAI.scoreLead(l);
    DataStore.saveAIResult('leads', id, {
      score: r.score, scoreReason: r.reason,
      nextAction: r.next_action || '', nextChannel: r.channel || ''
    });
    S.leads = DataStore.list('leads'); // 同步工作副本
    box.innerHTML = '<b>AI ' + r.score + ' 分（' + esc(r.tier) + '）</b> — ' + esc(r.reason)
      + '\n下一步: ' + esc(r.next_action) + (r.channel ? '\n建议渠道: ' + esc(r.channel) : '');
    render(); // 重排序（高分在前）+ 待办/单证模块可读到该结果
  } catch (e) { box.textContent = '❌ ' + e.message; }
  btn.disabled = false;
}

function openTouch(id) {
  S.touchId = id; S.touchMode = 'mail'; S.lastOut = ''; S.lastDraftId = null;
  var l = S.leads.find(function (x) { return x.id === id; });

  document.getElementById('t_sendRow').style.display = 'none';
  touchTab('mail');
  show('mTouch');
}
function touchTab(mode) {
  S.touchMode = mode;
  S.lastOut = ''; S.lastDraftId = null;
  document.getElementById('t_out').style.display = 'none';
  document.getElementById('t_out').textContent = '';
  document.getElementById('t_sendRow').style.display = 'none';
  document.getElementById('paneMail').style.display = mode === 'mail' ? '' : 'none';
  document.getElementById('paneReply').style.display = mode === 'reply' ? '' : 'none';
  document.getElementById('paneObjection').style.display = mode === 'objection' ? '' : 'none';
}
async function genTouch() {
  var l = S.leads.find(function (x) { return x.id === S.touchId; });
  var btn = document.getElementById('btnGen'), out = document.getElementById('t_out');
  var pre = document.getElementById('t_objPre').value;
  var objText = document.getElementById('t_obj').value.trim() || pre;
  btn.disabled = true; out.style.display = 'block'; out.textContent = 'AI 生成中…';
  try {
    if (S.touchMode === 'mail') {
      var me = DataStore.list('profile')[0] || {};   // 我的资料：署名/卖点自动注入
      S.lastOut = await AgnesAI.genOutreach(l, v('t_scene'), {
        name: me.name || '', company: me.company || '',
        selling: v('t_me') || me.selling || '',
        products: me.products || '', port: me.port || '', payment: me.payment || ''
      });
    } else if (S.touchMode === 'reply') {
      S.lastOut = await AgnesAI.genReply(l, document.getElementById('t_cw').value);
    } else {
      if (!objText) { out.textContent = '请先填写客户异议（快捷选择或粘贴原话）'; btn.disabled = false; return; }
      S.lastOut = await AgnesAI.genObjection(l, objText);
    }
    out.textContent = S.lastOut;
    document.getElementById('t_sendRow').style.display = 'flex';
    // 落库：先生成「草稿」，真正点发送后才变成「已发送」（发送记录模块按此区分）
    var draft = { leadId: l.id, leadName: l.name, type: S.touchMode === 'objection' ? 'ai_objection' : S.touchMode, status: 'draft', content: S.lastOut };
    var prev = S.lastDraftId ? DataStore.get('outreach', S.lastDraftId) : null;
    if (prev && prev.status !== 'sent') {
      DataStore.update('outreach', S.lastDraftId, draft);
    } else {
      var rec = DataStore.add('outreach', draft);
      S.lastDraftId = rec.id;
    }
  } catch (e) { out.textContent = '❌ ' + e.message; }
  btn.disabled = false;
}
/* 四通道发送：WhatsApp / Gmail / Outlook / 复制（正文取 AI 输出全文） */
function outBody() {
  return String(S.lastOut || '')
    .replace(/【中文要点】[\s\S]*$/, '')
    .replace(/【中文翻译】[\s\S]*$/, '')
    .trim();
}
function subjBody() {
  var body = outBody();
  return { su: 'Re: ' + (S.leads.find(function (x) { return x.id === S.touchId; }).product || 'cooperation'), bd: body };
}
/* 发送成功后：回写最后联系 + 把草稿标记为已发送 */
function markSent(channel, body) {
  var l = S.leads.find(function (x) { return x.id === S.touchId; });
  if (!l) return;
  l.last = iso(0);
  var saved = save();
  var sentAt = new Date().toISOString();
  var patch = { status: 'sent', channel: channel, content: body || S.lastOut, sentAt: sentAt };
  try {
    if (S.lastDraftId && DataStore.get('outreach', S.lastDraftId)) {
      DataStore.update('outreach', S.lastDraftId, patch);
    } else {
      DataStore.add('outreach', {
        leadId: l.id, leadName: l.name, type: channel === 'wa' ? 'wa' : 'mail',
        status: 'sent', channel: channel, content: patch.content, sentAt: sentAt
      });
    }
    var label = channel === 'wa' ? 'WhatsApp' : channel === 'gmail' ? 'Gmail' : 'Outlook';
    toast('已记录：' + label + ' 已发送 · 最后联系更新为 ' + l.last);
  } catch (e) {
    toast('已打开发送窗口，但触达记录写入失败：' + e.message);
  }
  if (saved) render();
}
function sendVia(channel) {
  var l = S.leads.find(function (x) { return x.id === S.touchId; });
  if (!l || !S.lastOut) { alert('请先生成内容'); return; }
  var body = outBody(), url = '';
  if (channel === 'wa') {
    if (!l.wa) { alert('该线索没有 WhatsApp 号，编辑线索补上'); return; }
    url = 'https://wa.me/' + l.wa.replace(/[^\d]/g, '') + '?text=' + encodeURIComponent(body);
  } else {
    if (!l.email) { alert('该线索没有邮箱，编辑线索补上'); return; }
    var sb = subjBody();
    url = channel === 'gmail'
      ? 'https://mail.google.com/mail/?view=cm&to=' + encodeURIComponent(l.email) + '&su=' + encodeURIComponent(sb.su) + '&body=' + encodeURIComponent(sb.bd)
      : 'https://outlook.live.com/mail/0/compose?to=' + encodeURIComponent(l.email) + '&subject=' + encodeURIComponent(sb.su) + '&body=' + encodeURIComponent(sb.bd);
  }
  var w = window.open(url, '_blank');
  if (!w) { alert('浏览器拦截了新窗口，请允许弹窗后重试'); return; }
  markSent(channel, body);
}
function sendWa() { sendVia('wa'); }
function sendGmail() { sendVia('gmail'); }
function sendOutlook() { sendVia('outlook'); }
function copyOut() {
  navigator.clipboard.writeText(S.lastOut).then(function () { toast('已复制全文（复制不算发送，不会更新最后联系）'); });
}

/* ---------- CSV 导入 ---------- */
var IMPORT_MAX = 5000;
var FIELD_LABEL = { name:'客户名', country:'国家', market:'市场', stage:'阶段', wa:'WhatsApp', email:'邮箱',
  product:'产品', amount:'预估金额', last:'最后联系', note:'备注', nextAction:'下一步', score:'AI评分' };

function pickCsv() {
  var f = document.getElementById('csvFile');
  if (!f) return;
  f.value = '';
  f.click();
}
function readCsv(input) {
  var f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  if (f.size > 20 * 1024 * 1024) { alert('文件超过 20MB，请拆分后再导入'); return; }
  var isXlsx = /\.xlsx$/i.test(f.name || '');
  if (/\.xls$/i.test(f.name || '')) {
    alert('旧版 .xls 是二进制格式，无法直接读取。请在 Excel/WPS 中「另存为」.xlsx 或 CSV 后再导入。');
    return;
  }
  var reader = new FileReader();
  reader.onload = function () {
    if (isXlsx) {
      FTCsv.readXlsx(reader.result, IMPORT_MAX + 1).then(function (rows) {
        prepareImportRows(rows, 'XLSX（Excel 工作簿）', f.name);
      }).catch(function (e) {
        alert('读取 Excel 失败：' + e.message);
      });
      return;
    }
    try {
      var dec = FTCsv.decode(reader.result);
      prepareImport(dec.text, dec.encoding, f.name);
    } catch (e) { alert('读取失败：' + e.message); }
  };
  reader.onerror = function () { alert('读取文件失败，请确认文件未被其他程序占用'); };
  reader.readAsArrayBuffer(f);
}
function prepareImport(text, encoding, filename) {
  var rows = FTCsv.parse(text);
  prepareImportRows(rows, encoding, filename);
}
function prepareImportRows(rows, encoding, filename) {
  if (!rows || rows.length < 2) { alert('至少需要一行表头和一行数据'); return; }
  if (rows.length > IMPORT_MAX + 1) { alert('单次最多导入 ' + IMPORT_MAX + ' 条，请拆分文件'); return; }
  var headerInfo = FTCsv.findHeaderRow(rows, 10);
  var headerRow = headerInfo.index;
  var header = rows[headerRow] || [];
  S.importRaw = {
    rows: rows, headerRow: headerRow, header: header,
    auto: headerInfo.mapping || {}, encoding: encoding, filename: filename
  };
  /* 客户名列做成下拉：外部表格的列名千奇百怪（公司英文名/企业全称/Account…），
     自动识别不到时必须让用户自己指一列，否则会变成一个点不动的死按钮。 */
  var sel = document.getElementById('impNameCol');
  sel.innerHTML = '<option value="">（请选择客户名列）</option>'
    + header.map(function (h, i) {
      var label = String(h == null ? '' : h).trim();
      return '<option value="' + i + '">' + (i + 1) + '. ' + esc(label.slice(0, 40) || '（空列）') + '</option>';
    }).join('');
  if (S.importRaw.auto.name != null) sel.value = String(S.importRaw.auto.name);
  document.getElementById('impMapRow').style.display = '';
  applyImportMapping();
  show('mImport');
}
function remapImport() { applyImportMapping(); }

/* 用当前选择的客户名列重新生成预览与导入数据 */
function applyImportMapping() {
  var raw = S.importRaw;
  if (!raw) return;
  var sel = document.getElementById('impNameCol');
  var pick = sel && sel.value !== '' ? parseInt(sel.value, 10) : -1;
  var manual = isFinite(pick) && pick >= 0;

  var mapping = {};
  Object.keys(raw.auto || {}).forEach(function (k) { mapping[k] = raw.auto[k]; });
  if (manual) {
    /* 手工指定的列就是客户名，避免同一列又被当成国家/邮箱等字段 */
    Object.keys(mapping).forEach(function (k) { if (mapping[k] === pick) delete mapping[k]; });
    mapping.name = pick;
  }

  var res = FTCsv.toLeads(raw.rows.slice(raw.headerRow + 1), mapping, { headerRow: raw.headerRow });
  var existing = {};
  (S.leads || []).forEach(function (l) { var k = FTCsv.dedupeKey(l); if (k) existing[k] = true; });
  var dupExisting = 0;
  res.records.forEach(function (r) { var k = FTCsv.dedupeKey(r); if (k && existing[k]) dupExisting++; });

  S.importData = {
    records: res.records, invalid: res.invalid, dupFile: res.duplicateInFile,
    dupExisting: dupExisting, errors: res.errors, encoding: raw.encoding,
    filename: raw.filename, mapping: mapping
  };

  var cols = Object.keys(mapping).map(function (k) { return FIELD_LABEL[k] || k; }).join('、');
  document.getElementById('impSummary').innerHTML =
    '<b>' + esc(raw.filename) + '</b> · ' + esc(raw.encoding) + '<br>'
    + '识别到 ' + Object.keys(mapping).length + ' 列：' + esc(cols || '无') + '<br>'
    + '数据 ' + (raw.rows.length - raw.headerRow - 1) + ' 行 · 有效 <b>' + res.records.length + '</b> 条'
    + (raw.headerRow > 0 ? ' · 表头在第 ' + (raw.headerRow + 1) + ' 行' : '')
    + (res.duplicateInFile ? ' · 文件内重复 ' + res.duplicateInFile + ' 条' : '')
    + (res.invalid ? ' · 缺少客户名 ' + res.invalid + ' 条' : '')
    + (dupExisting ? ' · 与现有客户重复 <b>' + dupExisting + '</b> 条' : '');

  var hint = '';
  if (mapping.name == null) hint = '⚠ 没有识别到客户名列，请在上方下拉里指定一列，否则无法导入。';
  else if (manual && raw.auto.name == null) hint = '原表的列名没有自动对上，已按你选择的第 ' + (pick + 1) + ' 列作为客户名。';
  document.getElementById('impMapHint').textContent = hint;

  document.getElementById('impTable').innerHTML = previewTable(res.records.slice(0, 5));
  document.getElementById('impWarn').innerHTML = res.errors.length
    ? res.errors.map(function (e) { return '第 ' + e.row + ' 行：' + esc(e.msg); }).join('<br>') : '';
  var btn = document.getElementById('btnImport');
  btn.disabled = !res.records.length;
  btn.textContent = res.records.length ? '✅ 开始导入 ' + res.records.length + ' 条' : '✅ 开始导入';
}
function previewTable(records) {
  if (!records.length) return '<div class="iwarn">没有可预览的数据</div>';
  var head = '<tr><th>客户名</th><th>国家</th><th>阶段</th><th>邮箱</th><th>WhatsApp</th><th>预估USD</th></tr>';
  var body = records.map(function (r) {
    return '<tr><td>' + esc(r.name) + '</td><td>' + esc(r.country) + '</td><td>' + esc(r.stage) + '</td>'
      + '<td>' + esc(r.email) + '</td><td>' + esc(r.wa) + '</td><td>' + esc(r.amount) + '</td></tr>';
  }).join('');
  return '<table class="imap"><thead>' + head + '</thead><tbody>' + body + '</tbody></table>';
}
function doImport() {
  var d = S.importData;
  if (!d || !d.records.length) return;
  var picked = document.querySelector('input[name="dupMode"]:checked');
  var mode = picked ? picked.value : 'skip';
  var base = DataStore.list('leads');
  var existing = {};
  base.forEach(function (l) { var k = FTCsv.dedupeKey(l); if (k) existing[k] = true; });
  var add = [], skipDup = 0;
  d.records.forEach(function (r) {
    var k = FTCsv.dedupeKey(r);
    if (mode === 'skip' && k && existing[k]) { skipDup++; return; }
    if (k) existing[k] = true;
    var rec = Object.assign({}, r);
    rec.id = uid();
    rec.createdAt = new Date().toISOString();
    if (rec.score != null) rec.aiImported = true;
    add.push(rec);
  });
  if (!add.length) { alert('没有可导入的新记录（全部与现有客户重复）'); return; }
  var btn = document.getElementById('btnImport');
  btn.disabled = true;
  try {
    DataStore.saveAll('leads', base.concat(add));
  } catch (e) {
    btn.disabled = false;
    alert('导入失败：' + e.message);
    return;
  }
  S.leads = DataStore.list('leads');
  S.page = 1;
  hide('mImport');
  /* 导入后必须把搜索/阶段筛选复位：否则新客户会被当前的筛选条件挡住，
     看上去就像“导入没成功”。 */
  var qEl = document.getElementById('q'); if (qEl) qEl.value = '';
  var fEl = document.getElementById('fStage'); if (fEl) fEl.value = '';
  render();
  var listEl = document.getElementById('list');
  if (listEl && listEl.scrollIntoView) listEl.scrollIntoView({ block: 'start' });
  toast('导入完成：新增 ' + add.length + ' 条，已在下方列表第 1 页'
    + (skipDup ? '（跳过重复 ' + skipDup + ' 条）' : ''));
}
function downloadTemplate() {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([FTCsv.template()], { type: 'text/csv;charset=utf-8' }));
  a.download = 'FTCompass_客户导入模板.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- CSV 导出 ---------- */
function exportCsv() {
  if (!S.leads.length) { alert('没有数据'); return; }
  var rows = [['客户名', '国家', '市场', '阶段', 'WhatsApp', '邮箱', '产品', '预估USD', '最后联系', 'AI评分', 'AI下一步', '备注']];
  S.leads.forEach(function (l) {
    rows.push([l.name, l.country, l.market, l.stage, l.wa, l.email, l.product, l.amount, l.last, l.score == null ? '' : l.score, l.nextAction || '', l.note]);
  });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([FTCsv.build(rows)], { type: 'text/csv;charset=utf-8' }));
  a.download = 'ftcompass_leads_' + iso(0) + '.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

load(); render();
/* 首页空态的「导入客户 CSV」带 ?import=1 进来：
   先尝试直接打开文件选择；浏览器若因为缺少用户手势拦截，就高亮按钮把人引过去。 */
try {
  if (/[?&]import=1\b/.test(location.search)) {
    var pb = document.getElementById('btnPickCsv');
    if (pb) {
      setTimeout(function () {
        try { pickCsv(); } catch (e) {}
        try {
          pb.scrollIntoView({ block: 'center' });
          pb.focus();
          pb.style.outline = '3px solid #ffc53d';
          setTimeout(function () { pb.style.outline = ''; }, 3000);
        } catch (e) {}
      }, 300);
    }
  }
} catch (e) {}
