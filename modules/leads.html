<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b6e4f'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23fff' stroke-width='3.5'/%3E%3Cpath d='M32 15 L38 32 L32 49 L26 32 Z' fill='%23ffc53d'/%3E%3Ccircle cx='32' cy='32' r='3.2' fill='%230b6e4f'/%3E%3C/svg%3E">
<title>FT Compass · 外贸线索工作台</title>
<link rel="stylesheet" href="../assets/tokens.css">
<script src="../agnes-ai.js"></script>
<script src="../js/datastore.js"></script>
<style>
  /* FT Compass 视觉体系（tokens.css 为准）：翡翠绿 / 琥珀 AI 规范 / 米白纸面 */
  * { box-sizing: border-box; margin: 0; }
  body { font: 15px/1.7 var(--font-sans); background: var(--bg-page); color: var(--text-1); }
  header { background: var(--brand-900); color: #fff; padding: 12px 22px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 50; }
  header .logo { width: 38px; height: 38px; border-radius: 9px; background: #ffffff22; display: flex; align-items: center; justify-content: center; }
  header h1 { font-size: 17px; font-weight: 600; flex: 1; }
  header .hbtn { background: #ffffff22; border: 0; color: #fff; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 70px; }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar input, .toolbar select { padding: 9px 12px; border: 1px solid #d5d2c4; border-radius: 9px; font-size: 14px; background: #fff; }
  .toolbar input { flex: 1; min-width: 180px; }
  .btn { padding: 9px 18px; border: 0; border-radius: 9px; background: #0b6e4f; color: #fff; cursor: pointer; font-size: 14px; }
  .btn.amber { background: #ffc53d; color: #4a3800; }
  .btn.ghost { background: #ecefe6; color: #33412e; }
  .btn.sm { padding: 5px 11px; font-size: 12.5px; border-radius: 7px; }
  .btn:disabled { opacity: .5; cursor: wait; }

  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat { background: #fff; border: 1px solid #e4e2d8; border-radius: 12px; padding: 10px 18px; font-size: 13px; color: #5c6657; }
  .stat b { display: block; font-size: 20px; color: #0b6e4f; }

  /* 线索卡 */
  .lead { background: #fff; border: 1px solid #e4e2d8; border-radius: 13px; padding: 14px 18px; margin-bottom: 12px; }
  .lead .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .lead .name { font-weight: 700; font-size: 16px; }
  .tag { font-size: 12px; padding: 2px 10px; border-radius: 20px; background: #ecefe6; color: #4c5747; }
  .tag.s0 { background: #f3e8d7; color: #7a5b1c; } .tag.s1 { background: #dfe9f5; color: #2c5282; }
  .tag.s2 { background: #e8ddf3; color: #5b3a86; } .tag.s3 { background: #f7ddd8; color: #99412f; }
  .tag.s4 { background: #d9efe2; color: #1d6b45; }
  .tag.hi { background: #0b6e4f; color: #fff; } .tag.mid { background: #ffc53d; color: #4a3800; } .tag.lo { background: #e4e2d8; }
  .lead .meta { color: #77806f; font-size: 13px; margin-top: 4px; }
  .lead .acts { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
  /* AI 输出容器：琥珀规范（tokens.css）——一眼识别"AI 说的" */
  .aiout, .mout { background: var(--accent-100); border-left: 3px solid var(--accent-500); border-radius: 10px; padding: 10px 13px; font-size: 13.5px; white-space: pre-wrap; }
  .aiout { margin-top: 10px; display: none; }

  /* 弹窗 */
  .mask { position: fixed; inset: 0; background: #22301f66; display: none; align-items: flex-start; justify-content: center; z-index: 100; overflow: auto; padding: 40px 14px; }
  .mask.show { display: flex; }
  .modal { background: #fff; border-radius: 14px; padding: 22px 24px; width: 640px; max-width: 96vw; }
  .modal h3 { font-size: 16px; margin-bottom: 12px; color: #0b6e4f; }
  .modal label { display: block; font-size: 12.5px; color: #5c6657; margin: 10px 0 4px; }
  .modal input, .modal select, .modal textarea { width: 100%; padding: 9px 12px; border: 1px solid #d5d2c4; border-radius: 9px; font-size: 14px; background: #fcfcfa; }
  .modal textarea { min-height: 76px; resize: vertical; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .mrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .mout { max-height: 260px; overflow: auto; display: none; margin-top: 10px; }
  .mrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .cfgbox input, .cfgbox label { font: 14px/1.6 system-ui; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg width="26" height="26" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="19" fill="none" stroke="#fff" stroke-width="3.5"/>
      <path d="M32 13 L38.5 32 L32 51 L25.5 32 Z" fill="#ffc53d"/>
      <circle cx="32" cy="32" r="3.4" fill="#0b6e4f"/>
    </svg>
  </div>
  <h1>FT Compass · 线索工作台</h1>
  <button class="hbtn" onclick="openCfg()">⚙ AI 设置</button>
</header>

<main>
  <div class="stats">
    <div class="stat"><b id="stTotal">0</b>线索总数</div>
    <div class="stat"><b id="stHot">0</b>高分线索(≥70)</div>
    <div class="stat"><b id="stDue">0</b>3天内待跟进</div>
    <div class="stat"><b id="stAmt">$0</b>线索预估总额</div>
  </div>

  <div class="toolbar">
    <input id="q" placeholder="搜索客户名 / 产品 / 备注…" oninput="render()">
    <select id="fStage" onchange="render()">
      <option value="">全部阶段</option><option>待开发</option><option>已联系</option>
      <option>试样</option><option>报价</option><option>成交</option>
    </select>
    <button class="btn" onclick="openEdit()">＋ 添加线索</button>
    <button class="btn ghost" onclick="exportCsv()">导出 CSV</button>
  </div>

  <div id="list"></div>
</main>

<!-- 新增/编辑线索 -->
<div class="mask" id="mEdit">
  <div class="modal">
    <h3 id="editTitle">添加线索</h3>
    <div class="grid2">
      <div><label>客户名 *</label><input id="e_name"></div>
      <div><label>国家</label><input id="e_country" placeholder="Egypt / USA…"></div>
      <div><label>市场</label><select id="e_market"><option>中东</option><option>东南亚</option><option>欧美</option><option>非洲</option><option>其他</option></select></div>
      <div><label>阶段</label><select id="e_stage"><option>待开发</option><option>已联系</option><option>试样</option><option>报价</option><option>成交</option></select></div>
      <div><label>WhatsApp（含国家码）</label><input id="e_wa" placeholder="+2010…"></div>
      <div><label>邮箱</label><input id="e_email" placeholder="buyer@company.com"></div>
      <div><label>关注产品</label><input id="e_product" placeholder="prayer pillow"></div>
      <div><label>预估金额 (USD)</label><input id="e_amount" type="number" value="0"></div>
    </div>
    <label>备注</label><textarea id="e_note" placeholder="展会名片 / 等 PI / 嫌贵…"></textarea>
    <div class="mrow">
      <button class="btn" onclick="saveEdit()">保存</button>
      <button class="btn ghost" onclick="hide('mEdit')">取消</button>
    </div>
  </div>
</div>

<!-- AI 触达：生成开发信 / 回复草稿 -->
<div class="mask" id="mTouch">
  <div class="modal">
    <h3 id="touchTitle">AI 触达</h3>
    <div class="mrow" style="margin:0 0 6px">
      <button class="btn sm ghost" id="tabMail" onclick="touchTab('mail')">✉ 生成开发信</button>
      <button class="btn sm ghost" id="tabReply" onclick="touchTab('reply')">↩ 客户回复草稿</button>
      <button class="btn sm ghost" id="tabObjection" onclick="touchTab('objection')">⚡ 异议应对</button>
    </div>
    <div id="paneMail">
      <label>场景</label>
      <select id="t_scene"><option>首封冷开发信</option><option>询盘首复</option><option>样品跟进</option><option>报价跟进</option><option>久未回复二次跟进</option></select>
      <label>我的署名信息（一句话即可）</label>
      <input id="t_me" placeholder="Wei, Xingtai Yunwei, 工厂直供/低MOQ/免费样品">
    </div>
    <div id="paneReply" style="display:none">
      <label>粘贴客户原话（WhatsApp/邮件）</label>
      <textarea id="t_cw" placeholder="Hi, the price is too high…"></textarea>
    </div>
    <div id="paneObjection" style="display:none">
      <label>客户提出了什么异议？</label>
      <select id="t_objPre"><option value="">— 常见异议快捷选择 —</option><option>价格太贵 Your price is too high</option><option>其他供应商报得更低 Another supplier quoted lower</option><option>我要请示老板 I need to ask my boss</option><option>先下一小单试试 We'll try a small order first</option><option>付款条件不合适 Payment terms don't work</option></select>
      <textarea id="t_obj" placeholder="或直接粘贴客户原话/描述异议…" style="min-height:60px"></textarea>
    </div>
    <div class="mrow"><button class="btn" id="btnGen" onclick="genTouch()">AI 生成</button></div>
    <div class="mout" id="t_out"></div>
    <div class="mrow" id="t_sendRow" style="display:none">
      <button class="btn sm amber" onclick="sendWa()">WhatsApp 发送</button>
      <button class="btn sm amber" onclick="sendGmail()">Gmail 发送</button>
      <button class="btn sm amber" onclick="sendOutlook()">Outlook 发送</button>
      <button class="btn sm ghost" onclick="copyOut()">复制全文</button>
    </div>
    <div class="mrow"><button class="btn ghost" onclick="hide('mTouch')">关闭</button></div>
  </div>
</div>

<!-- AI 设置（复用 AgnesAI 面板） -->
<div class="mask" id="mCfg">
  <div class="modal cfgbox">
    <h3>AI 设置（Agnes 2.5 Flash）</h3>
    <div id="cfgHolder"></div>
    <div class="mrow"><button class="btn ghost" onclick="hide('mCfg')">关闭</button></div>
  </div>
</div>

<script>
/* ================= FT Compass 线索工作台 v0.2 =================
 * 模块：线索 Pipeline + 统计 + CSV 导出 + Agnes AI（评分/开发信/回复草稿）
 * 数据：DataStore 统一适配层（键 ftc_leads_v1，与待办/单证/话术模块互通）
 * AI 评分结果为一等字段：score/scoreReason/nextAction/nextChannel
 * ======================================================= */

var STAGES = ['待开发', '已联系', '试样', '报价', '成交'];
var S = { leads: [], editId: null, touchId: null, touchMode: 'mail', lastOut: '' };

function load() {
  S.leads = DataStore.list('leads');
  // 旧版字段迁移：_score/_next → score/nextAction（一次性，写回后删除旧键）
  var migrated = false;
  S.leads.forEach(function (l) {
    if (l._score != null && l.score == null) {
      l.score = l._score; l.nextAction = l.nextAction || l._next || ''; migrated = true;
    }
    if ('_score' in l) { delete l._score; delete l._next; migrated = true; }
  });
  if (migrated) DataStore.saveAll('leads', S.leads);
  if (!S.leads.length) { // 首次运行放 2 条示例（可删），字段与蓝图数据模型一致
    DataStore.add('leads', { name: 'Omar', country: 'Egypt', market: '中东', stage: '报价', wa: '+20101234567', email: '', product: 'prayer pillow blue', amount: 2400, last: iso(-4), note: '等PI（示例，可删）', score: null });
    DataStore.add('leads', { name: 'John', country: 'USA', market: '欧美', stage: '待开发', wa: '', email: 'john@importer.com', product: 'gift box', amount: 0, last: iso(-35), note: '展会名片（示例，可删）', score: null });
    S.leads = DataStore.list('leads');
  }
}
function save() { DataStore.saveAll('leads', S.leads); }
function uid() { return 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
function iso(off) { var d = new Date(); d.setDate(d.getDate() + off); return d.toISOString().slice(0, 10); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function show(id) { document.getElementById(id).classList.add('show'); }
function hide(id) { document.getElementById(id).classList.remove('show'); }

/* ---------- 渲染 ---------- */
function render() {
  var q = (document.getElementById('q').value || '').toLowerCase();
  var fs = document.getElementById('fStage').value;
  var list = S.leads.filter(function (l) {
    if (fs && l.stage !== fs) return false;
    if (!q) return true;
    return (l.name + l.product + l.note + l.country).toLowerCase().indexOf(q) >= 0;
  }).slice().sort(function (a, b) { return (b.score || 0) - (a.score || 0); }); // AI 高分在前

  document.getElementById('stTotal').textContent = S.leads.length;
  document.getElementById('stHot').textContent = S.leads.filter(function (l) { return (l.score || 0) >= 70; }).length;
  document.getElementById('stDue').textContent = S.leads.filter(function (l) { return l.last && l.last <= iso(3); }).length;
  document.getElementById('stAmt').textContent = '$' + S.leads.reduce(function (s, l) { return s + (+l.amount || 0); }, 0).toLocaleString();

  var h = list.length ? '' : '<div class="lead" style="text-align:center;color:#8a937f">没有线索，点右上「＋ 添加线索」开始</div>';
  list.forEach(function (l) {
    var si = STAGES.indexOf(l.stage);
    var scoreTag = l.score != null ? '<span class="tag ' + (l.score >= 70 ? 'hi' : l.score >= 40 ? 'mid' : 'lo') + '">AI ' + l.score + '</span>' : '';
    h += '<div class="lead"><div class="top">'
      + '<span class="name">' + esc(l.name) + '</span>'
      + '<span class="tag s' + si + '">' + esc(l.stage) + '</span>' + scoreTag
      + '<span style="flex:1"></span>'
      + '<button class="btn sm amber" onclick="aiScore(\'' + l.id + '\',this)">⚡ AI 评分</button>'
      + '<button class="btn sm" onclick="openTouch(\'' + l.id + '\')">✉ AI 触达</button>'
      + '<button class="btn sm ghost" onclick="openEdit(\'' + l.id + '\')">编辑</button>'
      + '<button class="btn sm ghost" onclick="delLead(\'' + l.id + '\')">删除</button>'
      + '</div><div class="meta">'
      + esc(l.country || '—') + ' · ' + esc(l.market || '') + ' · 产品: ' + esc(l.product || '—')
      + ' · 预估 $' + (+l.amount || 0)
      + ' · 最后联系 ' + esc(l.last || '—')
      + (l.wa ? ' · WA ' + esc(l.wa) : '') + (l.email ? ' · ' + esc(l.email) : '')
      + (l.note ? ' · 📝 ' + esc(l.note) : '')
      + '</div>'
      + (l.scoreReason ? '<div class="aiout" style="display:block"><b>AI ' + l.score + ' 分</b> — ' + esc(l.scoreReason)
        + (l.nextAction ? '\n下一步: ' + esc(l.nextAction) : '') + (l.nextChannel ? '\n建议渠道: ' + esc(l.nextChannel) : '') + '</div>' : '')
      + '<div class="aiout" id="ai_' + l.id + '"></div></div>';
  });
  document.getElementById('list').innerHTML = h;
}

/* ---------- 新增/编辑/删除 ---------- */
function openEdit(id) {
  S.editId = id || null;
  var l = id ? S.leads.find(function (x) { return x.id === id; }) : {};
  document.getElementById('editTitle').textContent = id ? '编辑线索' : '添加线索';
  ['name', 'country', 'wa', 'email', 'product', 'note'].forEach(function (k) {
    document.getElementById('e_' + k).value = l[k] || '';
  });
  document.getElementById('e_market').value = l.market || '中东';
  document.getElementById('e_stage').value = l.stage || '待开发';
  document.getElementById('e_amount').value = l.amount || 0;
  show('mEdit');
}
function saveEdit() {
  var name = document.getElementById('e_name').value.trim();
  if (!name) { alert('客户名必填'); return; }
  var obj = {
    name: name,
    country: v('e_country'), market: v('e_market'), stage: v('e_stage'),
    wa: v('e_wa'), email: v('e_email'), product: v('e_product'),
    amount: +v('e_amount') || 0, note: v('e_note')
  };
  if (S.editId) {
    var l = S.leads.find(function (x) { return x.id === S.editId; });
    Object.assign(l, obj); // 编辑不清除已有 AI 评分
  } else {
    obj.id = uid(); obj.last = iso(0); obj.score = null;
    S.leads.push(obj);
  }
  save(); hide('mEdit'); render();
}
function delLead(id) {
  if (!confirm('删除这条线索？（不可恢复）')) return;
  S.leads = S.leads.filter(function (x) { return x.id !== id; });
  save(); render();
}
function v(id) { return document.getElementById(id).value.trim(); }

/* ---------- AI：评分（结果经 saveAIResult 落库为一等字段） ---------- */
async function aiScore(id, btn) {
  var l = S.leads.find(function (x) { return x.id === id; });
  var box = document.getElementById('ai_' + id);
  btn.disabled = true; box.style.display = 'block';
  box.textContent = 'AI 评分中…';
  try {
    var r = await AgnesAI.scoreLead(l);
    DataStore.saveAIResult('leads', id, {
      score: r.score, scoreReason: r.reason,
      nextAction: r.next_action || '', nextChannel: r.channel || ''
    });
    S.leads = DataStore.list('leads'); // 同步工作副本
    box.innerHTML = '<b>AI ' + r.score + ' 分（' + esc(r.tier) + '）</b> — ' + esc(r.reason)
      + '\n下一步: ' + esc(r.next_action) + (r.channel ? '\n建议渠道: ' + esc(r.channel) : '');
    render(); // 重排序（高分在前）+ 待办/单证模块可读到该结果
  } catch (e) { box.textContent = '❌ ' + e.message; }
  btn.disabled = false;
}

/* ---------- AI：触达（开发信 / 回复草稿） ---------- */
function openTouch(id) {
  S.touchId = id; S.touchMode = 'mail';
  var l = S.leads.find(function (x) { return x.id === id; });
  document.getElementById('touchTitle').textContent = 'AI 触达：' + l.name + '（' + (l.country || '') + '）';
  document.getElementById('t_out').style.display = 'none';
  document.getElementById('t_sendRow').style.display = 'none';
  touchTab('mail');
  show('mTouch');
}
function touchTab(mode) {
  S.touchMode = mode;
  document.getElementById('paneMail').style.display = mode === 'mail' ? '' : 'none';
  document.getElementById('paneReply').style.display = mode === 'reply' ? '' : 'none';
  document.getElementById('paneObjection').style.display = mode === 'objection' ? '' : 'none';
}
async function genTouch() {
  var l = S.leads.find(function (x) { return x.id === S.touchId; });
  var btn = document.getElementById('btnGen'), out = document.getElementById('t_out');
  var pre = document.getElementById('t_objPre').value;
  var objText = document.getElementById('t_obj').value.trim() || pre;
  btn.disabled = true; out.style.display = 'block'; out.textContent = 'AI 生成中…';
  try {
    if (S.touchMode === 'mail') {
      S.lastOut = await AgnesAI.genOutreach(l, v('t_scene'), { name: '', company: '', selling: v('t_me') });
    } else if (S.touchMode === 'reply') {
      S.lastOut = await AgnesAI.genReply(l, document.getElementById('t_cw').value);
    } else {
      if (!objText) { out.textContent = '请先填写客户异议（快捷选择或粘贴原话）'; btn.disabled = false; return; }
      S.lastOut = await AgnesAI.genObjection(l, objText);
    }
    out.textContent = S.lastOut;
    document.getElementById('t_sendRow').style.display = 'flex';
    // 落库：触达历史（复盘模块的触达数据源）
    DataStore.add('outreach', { leadId: l.id, leadName: l.name, type: S.touchMode, content: S.lastOut });
  } catch (e) { out.textContent = '❌ ' + e.message; }
  btn.disabled = false;
}
/* 四通道发送：WhatsApp / Gmail / Outlook / 复制（正文取 AI 输出全文） */
function subjBody() {
  var body = S.lastOut.replace(/【中文要点】[\s\S]*$/, ''); // 发送时剥掉中文备注段
  return { su: 'Re: ' + (S.leads.find(function (x) { return x.id === S.touchId; }).product || 'cooperation'), bd: body };
}
function sendWa() {
  var l = S.leads.find(function (x) { return x.id === S.touchId; });
  if (!l.wa) { alert('该线索没有 WhatsApp 号，编辑线索补上'); return; }
  window.open('https://wa.me/' + l.wa.replace(/[^\d]/g, '') + '?text=' + encodeURIComponent(S.lastOut), '_blank');
}
function sendGmail() {
  var l = S.leads.find(function (x) { return x.id === S.touchId; });
  if (!l.email) { alert('该线索没有邮箱，编辑线索补上'); return; }
  var sb = subjBody();
  window.open('https://mail.google.com/mail/?view=cm&to=' + encodeURIComponent(l.email)
    + '&su=' + encodeURIComponent(sb.su) + '&body=' + encodeURIComponent(sb.bd), '_blank');
}
function sendOutlook() {
  var l = S.leads.find(function (x) { return x.id === S.touchId; });
  if (!l.email) { alert('该线索没有邮箱，编辑线索补上'); return; }
  var sb = subjBody();
  window.open('https://outlook.live.com/mail/0/compose?to=' + encodeURIComponent(l.email)
    + '&subject=' + encodeURIComponent(sb.su) + '&body=' + encodeURIComponent(sb.bd), '_blank');
}
function copyOut() {
  navigator.clipboard.writeText(S.lastOut).then(function () { alert('已复制全文'); });
}

/* ---------- AI 设置 ---------- */
function openCfg() {
  document.getElementById('cfgHolder').innerHTML = AgnesAI.settingsHTML();
  show('mCfg');
}

/* ---------- CSV 导出 ---------- */
function exportCsv() {
  if (!S.leads.length) { alert('没有数据'); return; }
  var rows = [['客户名', '国家', '市场', '阶段', 'WhatsApp', '邮箱', '产品', '预估USD', '最后联系', 'AI评分', 'AI下一步', '备注']];
  S.leads.forEach(function (l) {
    rows.push([l.name, l.country, l.market, l.stage, l.wa, l.email, l.product, l.amount, l.last, l.score == null ? '' : l.score, l.nextAction || '', l.note]);
  });
  var csv = '\ufeff' + rows.map(function (r) {
    return r.map(function (c) { return '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'ftcompass_leads_' + iso(0) + '.csv'; a.click();
}

load(); render();
</script>
